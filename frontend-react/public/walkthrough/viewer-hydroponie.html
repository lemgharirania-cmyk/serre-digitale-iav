<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroBioTech — Hydroponie</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans',system-ui,sans-serif}
#pano{position:fixed;inset:0;width:100%;height:100%}
.pnlm-about-msg,.pnlm-panorama-info,.pnlm-controls-container,
.pnlm-load-box,.pnlm-lbar,.pnlm-lbar-fill,.pnlm-load-button,
.pnlm-loading,.pnlm-compass{display:none!important}
.pnlm-hotspot-base{background:transparent!important;border:none!important;
  width:auto!important;height:auto!important;overflow:visible!important}
.pnlm-hotspot-base .pnlm-sprite{display:none!important}

/* NAV hotspots */
.hs-nav{width:72px;height:72px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,1) 0%,rgba(160,225,185,1) 50%,rgba(45,142,80,.9) 100%);
  border:3px solid rgba(45,142,80,.95);
  box-shadow:0 0 0 10px rgba(45,142,80,.22),0 0 28px rgba(45,142,80,.35),0 4px 14px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;
  animation:hsp 2.5s ease-in-out infinite;cursor:pointer}
.hs-cross{width:72px;height:72px;border-radius:50%;cursor:pointer;
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,1) 0%,rgba(155,210,248,1) 50%,rgba(30,122,181,.9) 100%);
  border:3px solid rgba(30,122,181,.95);
  box-shadow:0 0 0 10px rgba(30,122,181,.20),0 0 28px rgba(30,122,181,.3),0 4px 14px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;
  animation:hsp-b 2.5s ease-in-out infinite;cursor:pointer}
.hs-nav:hover,.hs-cross:hover{transform:scale(1.1)}
@keyframes hsp{0%,100%{box-shadow:0 0 0 10px rgba(45,142,80,.22),0 0 28px rgba(45,142,80,.35),0 4px 14px rgba(0,0,0,.3)}50%{box-shadow:0 0 0 20px rgba(45,142,80,.07),0 0 44px rgba(45,142,80,.15),0 4px 14px rgba(0,0,0,.3)}}
@keyframes hsp-b{0%,100%{box-shadow:0 0 0 10px rgba(30,122,181,.20),0 0 28px rgba(30,122,181,.3),0 4px 14px rgba(0,0,0,.3)}50%{box-shadow:0 0 0 19px rgba(30,122,181,.06),0 0 42px rgba(30,122,181,.12),0 4px 14px rgba(0,0,0,.3)}}

/* AR hotspot base — transparent wrapper */
.hs-ar-base{background:transparent!important;border:none!important;width:auto!important;height:auto!important;overflow:visible!important}

/* AR hotspots */
.hs-ar-plant{width:52px;height:52px;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,.95);border:2px solid rgba(45,142,80,.6);
  box-shadow:0 0 0 6px rgba(45,142,80,.15),0 4px 16px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;
  animation:arp-g 3s ease-in-out infinite}
.hs-ar-sensor{width:52px;height:52px;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,.95);border:2px solid rgba(14,165,233,.6);
  box-shadow:0 0 0 6px rgba(14,165,233,.15),0 4px 16px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;
  animation:arp-b 3s ease-in-out infinite}
.hs-ar-system{width:52px;height:52px;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,.95);border:2px solid rgba(139,92,246,.6);
  box-shadow:0 0 0 6px rgba(139,92,246,.15),0 4px 16px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;
  animation:arp-p 3s ease-in-out infinite}
.hs-ar-plant:hover,.hs-ar-sensor:hover,.hs-ar-system:hover{transform:scale(1.1)}
@keyframes arp-g{0%,100%{box-shadow:0 0 0 6px rgba(45,142,80,.15),0 4px 16px rgba(0,0,0,.25)}50%{box-shadow:0 0 0 12px rgba(45,142,80,.05),0 4px 16px rgba(0,0,0,.25)}}
@keyframes arp-b{0%,100%{box-shadow:0 0 0 6px rgba(14,165,233,.15),0 4px 16px rgba(0,0,0,.25)}50%{box-shadow:0 0 0 12px rgba(14,165,233,.05),0 4px 16px rgba(0,0,0,.25)}}
@keyframes arp-p{0%,100%{box-shadow:0 0 0 6px rgba(139,92,246,.15),0 4px 16px rgba(0,0,0,.25)}50%{box-shadow:0 0 0 12px rgba(139,92,246,.05),0 4px 16px rgba(0,0,0,.25)}}

/* IoT overlay */
.iot-overlay{position:fixed;bottom:20px;left:20px;z-index:150;
  width:260px;background:rgba(255,255,255,.15);backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:14px 16px;
  color:white;transition:opacity .3s}
.iot-overlay:hover{background:rgba(255,255,255,.22)}
.iot-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.iot-title{font-size:12px;font-weight:600;color:rgba(255,255,255,.9)}
.iot-live{display:flex;align-items:center;gap:4px;font-size:10px;color:#4ade80;font-weight:600}
.iot-live-dot{width:6px;height:6px;border-radius:50%;background:#4ade80;animation:livepulse 2s infinite}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.4}}
.iot-section-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;
  color:rgba(255,255,255,.45);margin-bottom:6px;margin-top:10px}
.iot-section-lbl:first-child{margin-top:0}
.iot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.iot-grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.iot-cell{background:rgba(255,255,255,.1);border-radius:8px;padding:6px 8px;text-align:center}
.iot-cell-lbl{font-size:9px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.4px;margin-bottom:2px}
.iot-cell-val{font-size:15px;font-weight:700;color:white;line-height:1}
.iot-cell-val.blue{color:#60a5fa}
.iot-cell-unit{font-size:9px;color:rgba(255,255,255,.45);margin-top:1px}
  background:rgba(255,255,255,.15);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.25);
  cursor:pointer;color:white;font-size:20px;font-weight:300;
  display:flex;align-items:center;justify-content:center;transition:background .15s}
.arrow:hover{background:rgba(255,255,255,.28)}
.arrow.L{left:14px}.arrow.R{right:14px}
.arrow.off{opacity:0;pointer-events:none}

/* Zone flash */
.zf{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:300;
  background:rgba(255,255,255,.95);border-radius:16px;padding:18px 28px;text-align:center;
  box-shadow:0 8px 40px rgba(0,0,0,.18);opacity:0;pointer-events:none;transition:opacity .3s}
.zf.show{opacity:1}
.zf-name{font-size:17px;font-weight:600;color:#1a2e1a}
.zf-unit{font-size:11px;color:#6b736b;margin-top:3px}

/* AR popup */
.ar-overlay{position:fixed;inset:0;z-index:400;pointer-events:none;
  display:flex;align-items:center;justify-content:flex-end;padding:20px}
.ar-card{width:380px;max-height:calc(100vh - 40px);background:rgba(255,255,255,.98);
  border-radius:20px;border:1px solid rgba(0,0,0,.08);box-shadow:0 20px 60px rgba(0,0,0,.2);
  display:flex;flex-direction:column;overflow:hidden;pointer-events:all;
  transform:translateX(420px);transition:transform .35s cubic-bezier(.34,1.2,.64,1)}
.ar-card.open{transform:translateX(0)}
.ar-card-header{padding:16px 18px 0;display:flex;align-items:flex-start;justify-content:space-between}
.ar-card-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ar-card-title{flex:1;margin-left:12px}
.ar-card-title h3{font-size:16px;font-weight:700;color:#111827;line-height:1.2;margin-bottom:2px}
.ar-card-title p{font-size:11px;color:#6b7280;font-style:italic}
.ar-close{width:30px;height:30px;border-radius:50%;border:none;background:#f3f4f6;cursor:pointer;
  display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:16px;
  flex-shrink:0;transition:background .15s;font-family:inherit}
.ar-close:hover{background:#e5e7eb}
.ar-tabs{display:flex;gap:2px;padding:12px 18px 0;border-bottom:1px solid #f3f4f6}
.ar-tab{padding:7px 12px;border-radius:8px 8px 0 0;font-size:12px;font-weight:500;
  color:#6b7280;cursor:pointer;border:none;background:transparent;font-family:inherit;
  border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s}
.ar-tab:hover{color:#111827}
.ar-tab.active{color:#059669;border-bottom-color:#059669;background:#f0fdf4}
.ar-content{flex:1;overflow-y:auto;padding:16px 18px}
.ar-content::-webkit-scrollbar{width:3px}
.ar-content::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:99px}
.ar-section-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#9ca3af;margin-bottom:8px;margin-top:14px}
.ar-section-title:first-child{margin-top:0}
.ar-info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f9fafb;font-size:13px}
.ar-info-row:last-child{border-bottom:none}
.ar-info-label{color:#6b7280}
.ar-info-value{font-weight:600;color:#111827}
.ar-badge{display:inline-block;padding:3px 8px;border-radius:999px;font-size:11px;font-weight:500}
.ar-bullets{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.ar-bullet{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:#374151;line-height:1.4}
.ar-bullet-dot{width:6px;height:6px;border-radius:50%;margin-top:5px;flex-shrink:0}
.iot-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.iot-card{background:#f9fafb;border-radius:12px;padding:12px 14px;border:1px solid #f3f4f6}
.iot-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#9ca3af;margin-bottom:4px}
.iot-value{font-size:24px;font-weight:700;color:#111827;line-height:1}
.iot-unit{font-size:12px;color:#6b7280;margin-top:2px}
.iot-status{display:flex;align-items:center;gap:4px;margin-top:6px;font-size:10px}
.iot-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.iot-dot.ok{background:#22c55e}.iot-dot.warn{background:#f59e0b}.iot-dot.err{background:#ef4444}
.iot-refresh{font-size:11px;color:#9ca3af;text-align:right;margin-top:8px;cursor:pointer}
.iot-refresh:hover{color:#6b7280}
.iot-loading{text-align:center;padding:24px;color:#9ca3af;font-size:13px}
.photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.photo-item{border-radius:10px;overflow:hidden;aspect-ratio:1;background:#f3f4f6;cursor:pointer}
.photo-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .2s}
.photo-item:hover img{transform:scale(1.05)}
.photo-empty{text-align:center;padding:32px 16px;color:#9ca3af;font-size:13px}
.video-wrap{border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#111827;margin-bottom:12px}
.video-wrap iframe{width:100%;height:100%;border:none}
.video-desc{font-size:12px;color:#6b7280;line-height:1.55}
</style>
</head>
<body>

<div class="iot-overlay" id="iot-overlay">
  <div class="iot-header">
    <div class="iot-title">Hydroponie & Systèmes Innovants</div>
    <div class="iot-live"><div class="iot-live-dot"></div>Live</div>
  </div>
  <div class="iot-section-lbl">Environnement</div>
  <div class="iot-grid">
    <div class="iot-cell"><div class="iot-cell-lbl">Temp.</div><div class="iot-cell-val" id="iot-temp">—</div><div class="iot-cell-unit">°C</div></div>
    <div class="iot-cell"><div class="iot-cell-lbl">Humid.</div><div class="iot-cell-val" id="iot-hum">—</div><div class="iot-cell-unit">%</div></div>
    <div class="iot-cell"><div class="iot-cell-lbl">VPD</div><div class="iot-cell-val" id="iot-vpd">—</div><div class="iot-cell-unit">kPa</div></div>
  </div>
  <div class="iot-section-lbl">Irrigation</div>

    <div class="iot-cell"><div class="iot-cell-lbl">pH</div><div class="iot-cell-val blue" id="iot-ph">—</div></div>

  </div>
</div>

<div id="pano"></div>
<button class="arrow L off" id="prev" onclick="stepScene(-1)">‹</button>
<button class="arrow R" id="next" onclick="stepScene(1)">›</button>
<div class="zf" id="zf"><div class="zf-name" id="zfn">—</div><div class="zf-unit" id="zfu"></div></div>

<div class="ar-overlay">

      <div class="ar-card-icon" id="ar-icon-wrap"></div>
      <div class="ar-card-title"><h3 id="ar-title">—</h3><p id="ar-subtitle">—</p></div>
      <button class="ar-close" onclick="closeAR()">✕</button>
    </div>
    <div class="ar-tabs" id="ar-tabs"></div>
    <div class="ar-content" id="ar-content"></div>
  </div>
</div>

// Map arDesc → AR_CONTENT key (lowercase match)
function getARDef(desc){
  if(!desc) return null;
  const key = desc.toLowerCase().trim();
  return AR_CONTENT[key] || null;
}

function getIcon(arKey){
  if(arKey==='strawberry') return ICONS.plant;
  if(arKey==='sensor_irr') return ICONS.probe;
  if(arKey==='sensor_env') return ICONS.sensor;
  return ICONS.system;
}
function getCssClass(arKey){
  const t = AR_CONTENT[arKey]?.type;
  return t==='plant'?'hs-ar-plant':t==='sensor'?'hs-ar-sensor':'hs-ar-system';
}

window.addEventListener('load', async ()=>{
  const r = await fetch('images/manifest.json');
  manifest = await r.json();
  manifest.zones.forEach(z=>zones[z.id]=z);
  hotspots = manifest.hotspots||{};
  const p = new URLSearchParams(location.search);
  const z = p.get('zone')||START_ZONE;
  const s = p.get('scene')||zones[z]?.scenes[0]?.id;
  load(z,s);
  fetchIoT(); setInterval(fetchIoT,60000);
  document.addEventListener('keydown',e=>{
    if(e.code==='ArrowRight') stepScene(1);
    if(e.code==='ArrowLeft')  stepScene(-1);
    if(e.code==='Escape')     closeAR();
  });
});

async function fetchIoT(){
  try{
    const d = await fetch(`${API}/api/iot/live`).then(r=>r.json());
    iotData = (d.serres||[]).find(s=>s.code==='S04')||null;
    if(iotData) updateIoTOverlay();
  }catch(e){}
}

function updateIoTOverlay(){
  if(!iotData) return;
  const env=iotData.env||{}, irr=iotData.irr||{};
  const set=(id,val,dec=1)=>{ const el=document.getElementById(id); if(el) el.textContent=val!=null?Number(val).toFixed(dec):'—'; };
  set('iot-temp',  env.temperature);
  set('iot-hum',   env.humidite, 1);
  set('iot-vpd',   env.vpd, 2);
  set('iot-ph',    irr.ph, 2);
  set('iot-ec',    irr.ec, 2);
  set('iot-twater',irr.temp_eau);
  set('iot-level', irr.niveau_eau);
}

function goTo(zid,sid){
  if(RESTRICT_ZONES&&!RESTRICT_ZONES.includes(zid)) return;
  if(curZone&&curScene) navHistory.push({zoneId:curZone,sceneId:curScene});
  if(navHistory.length>50) navHistory.shift();
  closeAR();
  setTimeout(()=>load(zid,sid),80);
}

function load(zid,sid){
  const zone=zones[zid], scene=zone?.scenes.find(s=>s.id===sid);
  if(!zone||!scene) return;
  curZone=zid; curScene=sid;
  const idx=zone.scenes.indexOf(scene);

  document.getElementById('prev').className='arrow L'+(idx===0?' off':'');
  document.getElementById('next').className='arrow R'+(idx===zone.scenes.length-1?' off':'');

  if(zid!==lastZoneId){
    lastZoneId=zid;
    document.getElementById('zfn').textContent=zone.label;
    document.getElementById('zfu').textContent=zone.unit!=='—'?`Unité ${zone.unit}`:'';
    const zf=document.getElementById('zf');
    zf.classList.add('show'); clearTimeout(flashT);
    flashT=setTimeout(()=>zf.classList.remove('show'),2000);
  }

  // Build hotspot list: nav from manifest + AR from manifest + AR from local editor
  const shs=(hotspots[zid]?.[sid]||[]).slice();

  // Add locally placed AR hotspots (from ar-editor)
  const localAR = arPositions[sid]||[];
  localAR.forEach(l=>{
    if(!shs.some(s=>s.type==='ar'&&s.arKey===l.arKey))
      shs.push({type:'ar',pitch:l.pitch,yaw:l.yaw,arKey:l.arKey});
  });

  // Auto back nav
  const fwdNav=shs.find(h=>h.type==='nav'&&h.targetSceneId!==sid&&h.targetZoneId===zid);
  const hasBack=shs.some(h=>zones[h.targetZoneId]?.scenes.findIndex(s=>s.id===h.targetSceneId)===idx-1);

    const by=((fwdNav.yaw+180)+360)%360;

      targetZoneId:zid,targetSceneId:zone.scenes[idx-1].id,auto:true});

            <circle cx="12" cy="20" r="1.8" fill="rgba(255,255,255,.75)"/>
            <circle cx="21" cy="21" r="1.5" fill="rgba(255,255,255,.75)"/>
            <path d="M14 4c-2-3 0-5 3-4" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>
            <path d="M17 3c0-2 3-3 5-2" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>
            <path d="M11 5c-3-1-3-4 0-4" stroke="#15803d" stroke-width="2" stroke-linecap="round"/>
            <defs><radialGradient id="shine" cx="25%" cy="20%" r="60%"><stop offset="0%" stop-color="white"/><stop offset="100%" stop-color="transparent"/></radialGradient></defs>
          </svg>`,
          anim:'@keyframes hs-straw{0%,100%{box-shadow:0 0 0 9px rgba(244,63,94,.18),0 0 28px rgba(244,63,94,.35),0 6px 18px rgba(0,0,0,.3);transform:translateY(0)}50%{box-shadow:0 0 0 16px rgba(244,63,94,.06),0 0 44px rgba(244,63,94,.18),0 6px 18px rgba(0,0,0,.3);transform:translateY(-4px)}}'
        },
        'truc qui lache co2':{
          style:'width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#ecfdf5,#d1fae5);border:2px solid rgba(5,150,105,.7);box-shadow:0 0 0 7px rgba(5,150,105,.15),0 4px 16px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;animation:hs-float 3s ease-in-out infinite;cursor:pointer',

            <path d="M11 8c0-2.5 8-2.5 8 0" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
            <line x1="15" y1="8" x2="15" y2="5" stroke="#059669" stroke-width="1.8" stroke-linecap="round"/>
          </svg>`,
        },
        'ventilation':{
          style:'width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#eff6ff,#dbeafe);border:2px solid rgba(37,99,235,.7);box-shadow:0 0 0 7px rgba(37,99,235,.15),0 4px 16px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;animation:hs-spin 5s linear infinite;cursor:pointer',
          html:`<svg width="30" height="30" viewBox="0 0 30 30" fill="none">
            <circle cx="15" cy="15" r="3.5" fill="#2563eb"/>

            <path d="M12 16.5c0 0-4.5 1.2-4.5 5s3.5 3.5 5 0" fill="#bfdbfe" stroke="#2563eb" stroke-width="1.5" stroke-linejoin="round"/>
          </svg>`,
          anim:'@keyframes hs-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}'
        },
        'capteurs':{
          style:'width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,#faf5ff,#ede9fe);border:2px solid rgba(124,58,237,.7);box-shadow:0 0 0 7px rgba(124,58,237,.15),0 4px 16px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;animation:hs-float 2.5s ease-in-out infinite;cursor:pointer',

        },
        'fertigation automatique':{

            <path d="M8 17h14" stroke="#0284c7" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="2.5 2"/>
            <path d="M11 22c0 1.5 1.2 2.5 2.5 2.5h3c1.3 0 2.5-1 2.5-2.5" stroke="#0284c7" stroke-width="1.6"/>
          </svg>`,
        },
        'brumisateur':{
          style:'width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,#f0fdfa,#99f6e4);border:2px solid rgba(13,148,136,.7);box-shadow:0 0 0 7px rgba(13,148,136,.15),0 4px 16px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;animation:hs-float 2.8s ease-in-out infinite;cursor:pointer',
          html:`<svg width="30" height="30" viewBox="0 0 30 30" fill="none">
            <path d="M15 25c0 0-9-7.5-9-14a9 9 0 0 1 18 0c0 6.5-9 14-9 14z" fill="#99f6e4" stroke="#0d9488" stroke-width="1.8"/>
            <circle cx="20" cy="5"  r="1.3" fill="#0d9488" opacity=".7"/>
            <circle cx="23" cy="10" r="1.3" fill="#0d9488" opacity=".7"/>
            <circle cx="23" cy="17" r="1.3" fill="#0d9488" opacity=".7"/>
          </svg>`,
        },
      };

      // Inject animations once
      const animId = 'anim-hs-global';
      if(!document.getElementById(animId)){
        const s=document.createElement('style');s.id=animId;
        s.textContent=`
          @keyframes hs-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
          @keyframes hs-straw{0%,100%{box-shadow:0 0 0 9px rgba(244,63,94,.18),0 0 28px rgba(244,63,94,.35),0 6px 18px rgba(0,0,0,.3);transform:translateY(0)}50%{box-shadow:0 0 0 16px rgba(244,63,94,.06),0 0 44px rgba(244,63,94,.18),0 6px 18px rgba(0,0,0,.3);transform:translateY(-4px)}}
          @keyframes hs-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}

      const def = HS_DEFS[key] || HS_DEFS['capteurs'];

      return {
        pitch:hs.pitch, yaw:hs.yaw, type:'custom', cssClass:'hs-ar-base',
        createTooltipFunc:function(div){
          // Don't style the div Pannellum gives us — wrap in a child instead
          div.style.cssText = 'background:transparent;border:none;width:auto;height:auto';
          const inner = document.createElement('div');
          inner.style.cssText = def.style;
          inner.innerHTML = def.html;
          inner.addEventListener('mouseenter',()=>inner.style.transform=(def.style.includes('translateY')?'':'')+'scale(1.1)');
          inner.addEventListener('mouseleave',()=>inner.style.transform='');
          div.appendChild(inner);
          div.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();});

    autoLoad:true,autoRotate:0,hfov:100,minHfov:50,maxHfov:130,
    pitch:sp,yaw:sy,hotSpots:phs
  });

      const sc=zone.scenes[idx+d];
      if(sc&&!preloaded.has(sc.file)){preloaded.add(sc.file);new Image().src=sc.file;}
    });
  });
}

function stepScene(d){
  const zone=zones[curZone];
  const idx=zone?.scenes.findIndex(s=>s.id===curScene);
  const next=zone?.scenes[idx+d];
  if(next) goTo(curZone,next.id);
}

function openSimpleAR(desc){
  const def = getARDef(desc);
  if(!def){ console.warn('No AR content for:', desc); return; }
  activeAR = desc; activeTab = 0;

  // Header
  const iw = document.getElementById('ar-icon-wrap');
  iw.style.background = def.iconBg || '#f3f4f6';
  iw.innerHTML = def.icon;
  document.getElementById('ar-title').textContent    = def.title;
  document.getElementById('ar-subtitle').textContent = def.subtitle;

  // Tabs
  document.getElementById('ar-tabs').innerHTML = def.tabs.map((t,i)=>
    `<button class="ar-tab${i===0?' active':''}" onclick="switchTab(${i},true)">${t}</button>`
  ).join('');

  renderARTab(0, def);
  document.getElementById('ar-card').classList.add('open');
}

function switchTab(i, isAR){
  activeTab=i;
  document.querySelectorAll('.ar-tab').forEach((t,ti)=>t.classList.toggle('active',ti===i));
  if(activeAR) {
    const def = getARDef(activeAR);
    if(def) renderARTab(i, def);
  }
}

function renderARTab(i, def){
  const tab = def.tabs[i];
  const el  = document.getElementById('ar-content');

  if(tab === 'Info'){
    el.innerHTML = def.sections.map(sec => {
      const color = def.color || '#16a34a';
      let html = `<div class="ar-section-title" style="color:${color}">${sec.label}</div>`;

      if(sec.items) {
        html += sec.items.map(item => {
          const tagColors = {
            green:'background:#dcfce7;color:#16a34a',
            blue:'background:#dbeafe;color:#1d4ed8',
            purple:'background:#ede9fe;color:#7c3aed',
            teal:'background:#ccfbf1;color:#0d9488',
            amber:'background:#fef3c7;color:#d97706',
          };
          const tagStyle = tagColors[item.tag] || '';
          return `<div class="ar-info-row">
            <span class="ar-info-label">${item.k}</span>
            ${item.tag
              ? `<span class="ar-badge" style="${tagStyle}">${item.v}</span>`
              : `<span class="ar-info-value">${item.v}</span>`}
          </div>`;
        }).join('');
      }

      if(sec.bullets) {
        html += `<div class="ar-bullets">${sec.bullets.map(b=>
          `<div class="ar-bullet"><div class="ar-bullet-dot" style="background:${def.color||'#16a34a'}"></div><span>${b}</span></div>`
        ).join('')}</div>`;
      }

      return html;
    }).join('');
  }

  else if(tab === 'IoT'){
    if(!iotData){el.innerHTML='<div class="iot-loading">Chargement des données…</div>';return;}
    const env=iotData.env||{}, irr=iotData.irr||{};
    const cards=[
      {label:'Température',value:env.temperature,unit:'°C',ok:env.temperature>15&&env.temperature<30},
      {label:'Humidité',value:env.humidite,unit:'%',ok:env.humidite>50&&env.humidite<85},
      {label:'pH',value:irr.ph,unit:'',ok:irr.ph>5.5&&irr.ph<6.5},
      {label:'EC',value:irr.ec,unit:'mS/cm',ok:irr.ec>1.0&&irr.ec<2.0},
    ];
    el.innerHTML=`<div class="iot-grid">${cards.map(c=>`
      <div class="iot-card">
        <div class="iot-label">${c.label}</div>
        <div class="iot-value">${c.value!=null?Number(c.value).toFixed(1):'—'}</div>
        <div class="iot-unit">${c.unit}</div>
        <div class="iot-status"><div class="iot-dot ${c.value==null?'err':c.ok?'ok':'warn'}"></div>
        <span style="font-size:10px;color:#9ca3af">${c.value==null?'N/A':c.ok?'Normal':'Attention'}</span></div>
      </div>`).join('')}</div>
      <div class="iot-refresh" onclick="fetchIoT()">↻ Actualiser</div>`;
  }

  else if(tab === 'Vidéo'){
    const v = def.video;
    if(!v){el.innerHTML='<div class="photo-empty">Aucune vidéo.</div>';return;}
    el.innerHTML=`<div class="video-wrap"><iframe src="https://www.youtube.com/embed/${v.id}?rel=0&autoplay=0" allowfullscreen></iframe></div><p class="video-desc">${v.desc}</p>`;
  }
}

function openAR(key, defOverride){ openSimpleAR(key); }

function closeAR(){
  document.getElementById('ar-card').classList.remove('open');
  activeAR=null;
}
