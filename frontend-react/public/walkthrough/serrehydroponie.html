<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroBioTech — Hydroponie</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans',system-ui,sans-serif}
#pano-a,#pano-b{position:fixed;inset:0;width:100%;height:100%}
#pano-a{opacity:1}
#pano-b{opacity:0;pointer-events:none}
#flash{position:fixed;inset:0;z-index:200;pointer-events:none;
  background:rgba(255,255,255,0);transition:background .08s ease}
#flash.on{background:rgba(255,255,255,.04)}
.pnlm-about-msg,.pnlm-panorama-info,.pnlm-controls-container,
.pnlm-load-box,.pnlm-lbar,.pnlm-lbar-fill,.pnlm-load-button,
.pnlm-loading,.pnlm-compass{display:none!important}
.pnlm-hotspot-base{background:transparent!important;border:none!important;
  width:auto!important;height:auto!important;overflow:visible!important}
.pnlm-hotspot-base .pnlm-sprite{display:none!important}

/* NAV hotspots — match viewer.html style */
.hs-nav{
  width:58px;height:58px;border-radius:50%;cursor:pointer;
  background:rgba(255,255,255,.13);
  border:1px solid rgba(255,255,255,.38);
  box-shadow:0 2px 20px rgba(0,0,0,.22),0 0 0 6px rgba(255,255,255,.05);
  display:flex;align-items:center;justify-content:center;
  transition:transform .25s}
.hs-cross{
  width:58px;height:58px;border-radius:50%;cursor:pointer;
  background:rgba(147,197,253,.13);
  border:1px solid rgba(147,197,253,.4);
  box-shadow:0 2px 20px rgba(30,80,200,.18),0 0 0 6px rgba(147,197,253,.06);
  display:flex;align-items:center;justify-content:center;
  transition:transform .25s}
.hs-nav:hover{transform:scale(1.12)}
.hs-cross:hover{transform:scale(1.12)}

/* AR hotspot base — transparent wrapper */
.hs-ar-base{background:transparent!important;border:none!important;width:auto!important;height:auto!important;overflow:visible!important}

/* AR hotspots */
.hs-ar-plant{width:52px;height:52px;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,.95);border:2px solid rgba(45,142,80,.6);
  box-shadow:0 0 0 6px rgba(45,142,80,.15),0 4px 16px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;
  animation:arp-g 3s ease-in-out infinite}
.hs-ar-sensor{width:52px;height:52px;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,.95);border:2px solid rgba(14,165,233,.6);
  box-shadow:0 0 0 6px rgba(14,165,233,.15),0 4px 16px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;
  animation:arp-b 3s ease-in-out infinite}
.hs-ar-system{width:52px;height:52px;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,.95);border:2px solid rgba(139,92,246,.6);
  box-shadow:0 0 0 6px rgba(139,92,246,.15),0 4px 16px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:center;
  animation:arp-p 3s ease-in-out infinite}
.hs-ar-plant:hover,.hs-ar-sensor:hover,.hs-ar-system:hover{transform:scale(1.1)}
@keyframes arp-g{0%,100%{box-shadow:0 0 0 6px rgba(45,142,80,.15),0 4px 16px rgba(0,0,0,.25)}50%{box-shadow:0 0 0 12px rgba(45,142,80,.05),0 4px 16px rgba(0,0,0,.25)}}
@keyframes arp-b{0%,100%{box-shadow:0 0 0 6px rgba(14,165,233,.15),0 4px 16px rgba(0,0,0,.25)}50%{box-shadow:0 0 0 12px rgba(14,165,233,.05),0 4px 16px rgba(0,0,0,.25)}}
@keyframes arp-p{0%,100%{box-shadow:0 0 0 6px rgba(139,92,246,.15),0 4px 16px rgba(0,0,0,.25)}50%{box-shadow:0 0 0 12px rgba(139,92,246,.05),0 4px 16px rgba(0,0,0,.25)}}

/* IoT HUD bubbles */
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');
.iot-hud{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:150;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
.iot-group{display:flex;align-items:stretch;gap:5px;padding:6px 7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:22px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow:visible;box-shadow:0 2px 16px rgba(0,0,0,.12)}
.iot-divider{width:1px;align-self:stretch;margin:4px 3px;flex-shrink:0;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.2) 30%,rgba(255,255,255,.2) 70%,transparent)}
.iot-pill{position:relative;width:70px;padding:11px 6px 10px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:default;pointer-events:all;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(16px) saturate(130%);-webkit-backdrop-filter:blur(16px) saturate(130%);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 -1px 0 rgba(0,0,0,.06) inset,0 3px 14px rgba(0,0,0,.14);transition:transform .28s cubic-bezier(.34,1.35,.64,1),box-shadow .28s ease,background .28s ease,border-color .28s ease;overflow:visible}
.iot-pill.env::after{content:'';position:absolute;top:0;left:18%;right:18%;height:1px;border-radius:1px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(120,200,155,.55),transparent)}
.iot-pill.irr::after{content:'';position:absolute;top:0;left:18%;right:18%;height:1px;border-radius:1px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(100,175,225,.55),transparent)}
.iot-pill:hover{transform:scale(1.12) translateY(-4px);background:rgba(255,255,255,.19);border-color:rgba(255,255,255,.34);box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 12px 30px rgba(0,0,0,.18)}
.iot-icon{width:17px;height:17px;flex-shrink:0;opacity:.7}
.iot-pill.env .iot-icon{color:rgba(140,215,170,1)}
.iot-pill.irr .iot-icon{color:rgba(120,195,235,1)}
.iot-pill:hover .iot-icon{opacity:.9}
.iot-val{font-family:'DM Sans',system-ui,sans-serif;font-size:16px;font-weight:500;line-height:1;color:rgba(255,255,255,.88);letter-spacing:-.3px}
.iot-unit{font-family:'DM Sans',system-ui,sans-serif;font-size:8px;font-weight:400;color:rgba(255,255,255,.42);letter-spacing:.8px;text-transform:uppercase}
.iot-tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(5px);background:rgba(255,255,255,.14);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(255,255,255,.24);color:rgba(255,255,255,.86);font-family:'DM Sans',system-ui,sans-serif;font-size:10px;font-weight:400;letter-spacing:.2px;white-space:nowrap;padding:5px 11px;border-radius:9px;pointer-events:none;opacity:0;z-index:10;transition:opacity .18s ease,transform .18s ease;box-shadow:0 4px 18px rgba(0,0,0,.16),0 1px 0 rgba(255,255,255,.14) inset}
.iot-pill:hover .iot-tip{opacity:1;transform:translateX(-50%) translateY(0)}
.iot-pip{position:absolute;top:7px;right:7px;width:5px;height:5px;border-radius:50%;background:rgba(140,230,170,.9);box-shadow:0 0 5px rgba(140,230,170,.45);animation:pip-pulse 2.8s ease-in-out infinite}
@keyframes pip-pulse{0%,100%{opacity:.88;transform:scale(1)}50%{opacity:.22;transform:scale(.72)}}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.35}}
/* Nav arrows */
.arrow{position:fixed;top:50%;z-index:201;transform:translateY(-50%);
  width:40px;height:40px;border-radius:50%;
  background:rgba(255,255,255,.1);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.2);
  cursor:pointer;color:rgba(255,255,255,.7);font-size:18px;
  display:flex;align-items:center;justify-content:center;transition:.2s}
.arrow:hover{background:rgba(255,255,255,.2);color:white}
.arrow.L{left:14px}.arrow.R{right:14px}
.arrow.off{opacity:0;pointer-events:none}

/* Zone flash */
.zf{position:fixed;bottom:24px;right:24px;z-index:300;
  background:rgba(15,15,15,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
  border:1px solid rgba(255,255,255,.12);border-radius:14px;
  padding:10px 18px;text-align:left;
  box-shadow:0 8px 32px rgba(0,0,0,.25);
  opacity:0;pointer-events:none;
  transform:translateY(8px);
  transition:opacity .3s ease,transform .3s ease}
.zf.show{opacity:1;transform:translateY(0)}
.zf-name{font-size:13px;font-weight:600;color:rgba(255,255,255,.92);letter-spacing:.01em}
.zf-unit{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px}

/* ── AR Popup — dark glassmorphism premium ── */
.ar-overlay{position:fixed;inset:0;z-index:400;pointer-events:none;
  display:flex;align-items:center;justify-content:flex-end;padding:20px}

.ar-card{
  width:320px;max-height:calc(100vh - 48px);
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid rgba(255,255,255,.9);
  border-radius:24px;
  box-shadow:0 8px 40px rgba(0,20,60,.13),0 2px 8px rgba(0,20,60,.07),0 1px 0 rgba(255,255,255,.95) inset;
  display:flex;flex-direction:column;overflow:hidden;pointer-events:all;
  transform:translateX(360px) scale(.96);opacity:0;
  transition:transform .38s cubic-bezier(.34,1.08,.64,1),opacity .28s ease}
.ar-card.open{transform:translateX(0) scale(1);opacity:1}

/* ── HERO ── */
.ar-hero{
  position:relative;height:130px;flex-shrink:0;overflow:hidden;
  display:flex;align-items:flex-end;padding-bottom:18px}
.ar-hero-bg{position:absolute;inset:0;opacity:.7}
.ar-hero::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:50px;
  background:linear-gradient(to bottom,transparent,rgba(0,0,0,.12));
  pointer-events:none}
.ar-hero-anim{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.ar-hero-content{
  position:relative;z-index:1;
  display:flex;align-items:flex-end;gap:12px;padding:0 16px;width:100%}
.ar-hero-icon{
  width:44px;height:44px;border-radius:13px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.25);
  border:1px solid rgba(255,255,255,.45);
  box-shadow:0 2px 8px rgba(0,0,0,.12),0 1px 0 rgba(255,255,255,.8) inset;
  margin-bottom:2px}
.ar-hero-text{flex:1;min-width:0}
.ar-hero-label{
  font-family:'DM Sans',system-ui,sans-serif;
  font-size:8.5px;font-weight:500;text-transform:uppercase;letter-spacing:1.1px;
  color:rgba(255,255,255,.55);margin-bottom:3px}
.ar-hero-text h3{
  font-family:'DM Sans',system-ui,sans-serif;
  font-size:16px;font-weight:700;color:#fff;
  line-height:1.15;margin:0 0 8px;
  text-shadow:0 1px 8px rgba(0,0,0,.22)}
/* ── BIG STATE BADGE in hero ── */
.ar-state-pill{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 12px;border-radius:99px;
  font-family:'DM Sans',system-ui,sans-serif;
  font-size:11.5px;font-weight:700;letter-spacing:.3px;
  border:1.5px solid rgba(255,255,255,.4);
  backdrop-filter:blur(8px);
  box-shadow:0 2px 8px rgba(0,0,0,.15)}
.ar-state-pill.on{background:rgba(34,197,94,.28);color:#fff}
.ar-state-pill.off{background:rgba(0,0,0,.22);color:rgba(255,255,255,.8)}
.ar-state-pill.unknown{background:rgba(255,255,255,.15);color:rgba(255,255,255,.6)}
.ar-state-pill-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ar-state-pill.on .ar-state-pill-dot{background:#4ade80;box-shadow:0 0 6px #4ade80}
.ar-state-pill.off .ar-state-pill-dot{background:#f87171;box-shadow:0 0 6px #f87171}
.ar-state-pill.unknown .ar-state-pill-dot{background:rgba(255,255,255,.4)}

/* ── CLOSE ── */
.ar-close{
  position:absolute;top:10px;right:10px;z-index:10;
  width:26px;height:26px;border-radius:50%;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(0,0,0,.15);
  cursor:pointer;color:rgba(255,255,255,.85);font-size:11px;
  display:flex;align-items:center;justify-content:center;
  transition:background .15s}
.ar-close:hover{background:rgba(0,0,0,.3)}

/* ── REASON STRIP ── */
.ar-reason-strip{
  flex-shrink:0;
  padding:10px 16px;
  background:rgba(0,0,0,.025);
  border-bottom:1px solid rgba(0,0,0,.055)}
.ar-reason-text{
  font-family:'DM Sans',system-ui,sans-serif;
  font-size:11px;color:rgba(0,0,0,.45);line-height:1.45;font-style:italic}

/* ── CONTENT ── */
.ar-content{
  flex:1;overflow-y:auto;padding:16px 16px 20px;
  scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.07) transparent}
.ar-content::-webkit-scrollbar{width:3px}
.ar-content::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);border-radius:99px}

/* ── SECTION HEADERS ── */
.ar-section-title{
  font-family:'DM Mono','JetBrains Mono',monospace;
  font-size:8px;font-weight:600;text-transform:uppercase;
  letter-spacing:1.1px;color:var(--accent,#059669);
  margin:18px 0 8px;opacity:.75}
.ar-section-title:first-child{margin-top:0}

/* ── SENSOR ROW (value vs threshold) ── */
.ar-sensor-row{
  display:flex;align-items:center;gap:10px;
  padding:9px 0;border-bottom:1px solid rgba(0,0,0,.045)}
.ar-sensor-row:last-child{border-bottom:none}
.ar-sensor-label{
  font-family:'DM Sans',system-ui,sans-serif;
  font-size:11.5px;color:rgba(0,0,0,.42);flex:1}
.ar-sensor-val{
  font-family:'DM Mono','JetBrains Mono',monospace;
  font-size:14px;font-weight:600;color:rgba(0,0,0,.78);min-width:52px;text-align:right}
.ar-sensor-unit{
  font-family:'DM Sans',system-ui,sans-serif;
  font-size:10px;color:rgba(0,0,0,.3);min-width:30px}
.ar-sensor-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.ar-sensor-dot.ok{background:#22c55e}.ar-sensor-dot.warn{background:#f59e0b}.ar-sensor-dot.err{background:#ef4444}.ar-sensor-dot.na{background:rgba(0,0,0,.15)}

/* ── INFO ROWS ── */
.ar-info-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid rgba(0,0,0,.04)}
.ar-info-row:last-child{border-bottom:none}
.ar-info-label{font-family:'DM Sans',system-ui,sans-serif;font-size:12px;color:rgba(0,0,0,.4)}
.ar-info-value{font-family:'DM Sans',system-ui,sans-serif;font-size:12px;color:rgba(0,0,0,.75);font-weight:500;text-align:right}
.ar-badge{
  display:inline-block;padding:2px 9px;border-radius:7px;
  font-family:'DM Sans',system-ui,sans-serif;
  font-size:10.5px;font-weight:600;border:1px solid transparent}

/* ── BULLETS ── */
.ar-bullets{display:flex;flex-direction:column;gap:7px;margin-top:2px}
.ar-bullet{display:flex;align-items:flex-start;gap:8px;
  font-family:'DM Sans',system-ui,sans-serif;font-size:13px;color:rgba(0,0,0,.52);line-height:1.6}
.ar-bullet-dot{width:4px;height:4px;border-radius:50%;margin-top:7px;flex-shrink:0;
  background:var(--accent,#059669);opacity:.65}

/* ── IOT GRID ── */
.iot-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.iot-card{background:rgba(0,0,0,.025);border:1px solid rgba(0,0,0,.055);border-radius:12px;padding:10px 11px}
.iot-label{font-family:'DM Mono','JetBrains Mono',monospace;font-size:7.5px;font-weight:500;
  text-transform:uppercase;letter-spacing:.6px;color:rgba(0,0,0,.3);margin-bottom:3px}
.iot-value{font-family:'DM Mono','JetBrains Mono',monospace;font-size:20px;font-weight:600;color:rgba(0,0,0,.8);line-height:1}
.iot-unit{font-size:9.5px;color:rgba(0,0,0,.32);margin-top:2px;font-family:'DM Sans',system-ui,sans-serif}
.iot-status{display:flex;align-items:center;gap:3px;margin-top:5px;
  font-size:9px;color:rgba(0,0,0,.32);font-family:'DM Sans',system-ui,sans-serif}
.iot-dot{width:4px;height:4px;border-radius:50%;flex-shrink:0}
.iot-dot.ok{background:#22c55e}.iot-dot.warn{background:#f59e0b}.iot-dot.err{background:#ef4444}
.iot-refresh{font-family:'DM Mono','JetBrains Mono',monospace;font-size:9px;
  color:rgba(0,0,0,.22);text-align:right;margin-top:8px;cursor:pointer;transition:color .15s}
.iot-refresh:hover{color:rgba(0,0,0,.5)}
.iot-loading{text-align:center;padding:22px;color:rgba(0,0,0,.28);font-size:11.5px;font-family:'DM Sans',system-ui,sans-serif}

/* ── VIDEO ── */
.video-wrap{border-radius:10px;overflow:hidden;aspect-ratio:16/9;
  background:rgba(0,0,0,.04);margin-bottom:8px;border:1px solid rgba(0,0,0,.06)}
.video-wrap iframe{width:100%;height:100%;border:none}
.video-desc{font-size:11px;color:rgba(0,0,0,.38);line-height:1.55;font-family:'DM Sans',system-ui,sans-serif}

/* ── ANIMATIONS ── */
@keyframes ar-fade-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.ar-stagger-1{animation:ar-fade-up .28s ease .04s both}
.ar-stagger-2{animation:ar-fade-up .28s ease .10s both}
.ar-stagger-3{animation:ar-fade-up .28s ease .16s both}
@keyframes hero-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes hero-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes hero-drop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px) scaleY(1.1)}}
@keyframes hero-pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.85;transform:scale(1.08)}}
@keyframes hero-wave{0%,100%{d:path('M0 20 Q80 8 160 20 Q240 32 320 20')}50%{d:path('M0 20 Q60 32 120 20 Q180 8 240 20 Q300 32 360 20')}}
@keyframes hero-bubble{0%{transform:translateY(30px);opacity:0}50%{opacity:.7}100%{transform:translateY(-10px);opacity:0}}

.ar-thresh-block{margin-bottom:4px}
.ar-thresh-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}
.ar-thresh-label{font-family:'DM Sans',system-ui,sans-serif;font-size:11.5px;color:rgba(0,0,0,.42)}
.ar-thresh-val{font-family:'DM Mono','JetBrains Mono',monospace;font-size:13px;font-weight:600;color:rgba(0,0,0,.75)}
.ar-thresh-unit{font-family:'DM Sans',system-ui,sans-serif;font-size:10px;color:rgba(0,0,0,.32)}
.ar-thresh-bar-wrap{height:5px;background:rgba(0,0,0,.07);border-radius:99px;overflow:hidden;margin-bottom:10px}
.ar-thresh-bar{height:100%;border-radius:99px;transition:width .5s ease;min-width:3px}
.ar-thresh-reason{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;
  font-family:'DM Sans',system-ui,sans-serif;font-size:11px;font-style:italic;margin-top:2px}
.ar-thresh-reason.on{background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.15);color:#15803d}
.ar-thresh-reason.off{background:rgba(0,0,0,.025);border:1px solid rgba(0,0,0,.07);color:rgba(0,0,0,.42)}
.ar-thresh-reason.unknown{background:rgba(0,0,0,.02);border:1px solid rgba(0,0,0,.05);color:rgba(0,0,0,.3)}
.ar-thresh-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* ── AR TOGGLE BUTTON ── */
#ar-toggle{
  position:fixed;bottom:28px;left:28px;z-index:500;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border:1px solid rgba(255,255,255,.22);
  border-radius:12px;padding:10px 16px;
  box-shadow:0 4px 24px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.18);
  cursor:pointer;display:flex;align-items:center;gap:8px;
  font-family:inherit;font-size:11px;font-weight:500;
  color:rgba(255,255,255,.7);letter-spacing:.04em;
  transition:background .2s,border-color .2s,color .2s}
#ar-toggle:hover{background:rgba(255,255,255,.18);color:white}
#ar-toggle.ar-on{border-color:rgba(140,255,190,.35);color:rgba(140,255,190,.9)}
#ar-toggle.ar-on:hover{background:rgba(140,255,190,.1)}
#ar-toggle-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;
  background:rgba(255,255,255,.3);transition:background .2s,box-shadow .2s}

function toggleAR(){
  arEnabled = !arEnabled;
  const btn = document.getElementById('ar-toggle');
  const lbl = document.getElementById('ar-toggle-label');
  if(arEnabled){ btn.classList.add('ar-on'); lbl.textContent='AR ON'; }

  applyARState();
}

function getARDef(desc){
  if(!desc) return null;
  return AR_CONTENT[desc.toLowerCase().trim()]||null;
}

function getIcon(arKey){
  if(arKey==='strawberry') return ICONS.plant;
  if(arKey==='sensor_irr') return ICONS.probe;
  if(arKey==='sensor_env') return ICONS.sensor;
  return ICONS.system;
}
function getCssClass(arKey){
  const t = AR_CONTENT[arKey]?.type;
  return t==='plant'?'hs-ar-plant':t==='sensor'?'hs-ar-sensor':'hs-ar-system';
}

window.addEventListener('load', async ()=>{
  const r = await fetch('images/manifest.json');
  manifest = await r.json();
  manifest.zones.forEach(z=>zones[z.id]=z);
  hotspots = manifest.hotspots||{};
  const p = new URLSearchParams(location.search);
  const z = p.get('zone')||START_ZONE;
  const s = p.get('scene')||zones[z]?.scenes[0]?.id;
  load(z,s);
  fetchThresholds();
  fetchOutsideTemp(); setInterval(fetchOutsideTemp,600000);
  fetchIoT(); setInterval(fetchIoT,60000);
  document.addEventListener('keydown',e=>{
    if(e.code==='ArrowRight') stepScene(1);
    if(e.code==='ArrowLeft')  stepScene(-1);
    if(e.code==='Escape')     closeAR();
  });
});

async function fetchIoT(){
  try{
    const d = await fetch(`${API}/api/iot/live`).then(r=>r.json());
    iotData = (d.serres||[]).find(s=>s.code==='S04')||null;
    if(iotData){ updateIoTOverlay(); window._iotData=iotData; updateHotspotDots(); }
  }catch(e){}
}

function updateHotspotDots(){
  document.querySelectorAll('[data-state-dot]').forEach(dot=>{
    const key = dot.getAttribute('data-state-dot');
    const state = hsGetState(key);
    if(state === null) return;
    const on = state === 'on';
    dot.style.background = on ? '#22c55e' : '#ef4444';
    dot.style.boxShadow = on ? '0 0 4px rgba(34,197,94,.6)' : '0 0 4px rgba(239,68,68,.5)';
    dot.style.display = 'block';
  });
}

async function fetchThresholds(){
  try{
    const r = await fetch(`${API}/api/dashboard/thresholds/4/public`);
    if(!r.ok) throw new Error(r.status);
    const data = await r.json();
    thresholds = {};
    (data||[]).forEach(t=>{ if(t.actif!==false) thresholds[t.capteur]=t; });
    window._thresholds = thresholds;
  }catch(e){ console.warn('Thresholds: using defaults',e.message); }
}

async function fetchOutsideTemp(){
  try{
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.0209&longitude=-6.8416&current_weather=true');
    const d = await r.json();
    outsideTemp = d?.current_weather?.temperature ?? null;
    window._outsideTemp = outsideTemp;
  }catch(e){ outsideTemp=null; }
}

function getThresh(key){
  const DEFAULTS={
    temperature:{valeur_min:18,valeur_max:28},
    humidite:   {valeur_min:55,valeur_max:85},
    vpd:        {valeur_min:0.4,valeur_max:1.2},
    ph:         {valeur_min:5.5,valeur_max:6.5},
    ec:         {valeur_min:1.0,valeur_max:2.2},
    niveau_eau: {valeur_min:0.3,valeur_max:1.5},
  };
  return thresholds[key] || DEFAULTS[key] || {valeur_min:null,valeur_max:null};
}

// Returns 'on' | 'off' | null (null = no state for this equipment)
function hsGetState(key){
  const env = iotData?.env||{};
  const tT  = getThresh('temperature');
  const hT  = getThresh('humidite');
  const vT  = getThresh('vpd');
  switch(key){
    case 'ventilation':
    case 'ventilation dehors':
      if(env.temperature==null) return null;
      return (env.temperature > tT.valeur_max-2 || (env.humidite!=null && env.humidite > hT.valeur_max)) ? 'on' : 'off';
    case 'brumisateur':
      if(env.temperature==null) return null;
      return (env.temperature > tT.valeur_max || (env.humidite!=null && env.humidite < hT.valeur_min)) ? 'on' : 'off';
    case 'co2':
      if(env.vpd==null) return null;
      return env.vpd > vT.valeur_min ? 'on' : 'off';
    case 'système de refroidissement':
      if(env.temperature==null) return null;
      return env.temperature > tT.valeur_max ? 'on' : 'off';
    case 'fenetre auto':
      if(env.temperature==null || outsideTemp==null) return null;
      return (env.temperature > tT.valeur_max && outsideTemp < env.temperature-2) ? 'on' : 'off';
    case 'rideaux auto':
      if(outsideTemp==null) return null;
      return (outsideTemp > 10 && outsideTemp < 32) ? 'on' : 'off';
    default: return null;
  }
}

function updateIoTOverlay(){
  if(!iotData) return;
  const env=iotData.env||{}, irr=iotData.irr||{};
  const set=(id,val,dec=1)=>{ const el=document.getElementById(id); if(el) el.textContent=val!=null?Number(val).toFixed(dec):'—'; };
  set('iot-temp',  env.temperature, 1);
  set('iot-hum',   env.humidite,    1);
  set('iot-vpd',   env.vpd,         2);
  set('iot-ph',    irr.ph,          2);
  set('iot-ec',    irr.ec,          2);
  set('iot-twater',irr.temp_eau,    1);
  set('iot-level', irr.niveau_eau,  2);
}

function goTo(zid,sid){
  if(RESTRICT_ZONES&&!RESTRICT_ZONES.includes(zid)) return;
  if(curZone&&curScene) navHistory.push({zoneId:curZone,sceneId:curScene});
  if(navHistory.length>50) navHistory.shift();
  closeAR();
  setTimeout(()=>load(zid,sid),80);
}

            // Inject animations once — in global CSS order matters for Pannellum

          @keyframes hs-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
          @keyframes hs-drop{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-3px) scaleY(1.08)}}
          @keyframes dot-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}
          @keyframes hs-mist{0%{opacity:.9;transform:translateY(0) scale(1)}60%{opacity:.4;transform:translateY(-8px) scale(1.15)}100%{opacity:0;transform:translateY(-14px) scale(.8)}}
          @keyframes hs-airflow{0%{opacity:0;transform:translateX(-4px)}40%{opacity:1}100%{opacity:0;transform:translateX(6px)}}
          @keyframes hs-particle-l{0%{opacity:.8;transform:translateX(0)}50%{opacity:.3;transform:translateX(-7px)}100%{opacity:0;transform:translateX(-12px)}}
          @keyframes hs-curtain{0%,100%{d:path('M4 8C5 12 5 20 7 26C8 30 6 34 8 39L4 39Z')}50%{d:path('M4 8C6 13 4 21 8 26C9 30 5 34 7 39L4 39Z')}}
        `;
        document.head.appendChild(s);
      }

      const stateKey = hsGetState(key);
      const def = HS_DEFS[key] || HS_DEFS['sensors'];

      return {
        pitch:hs.pitch, yaw:hs.yaw, type:'custom', cssClass:'hs-ar-base',
        createTooltipFunc:function(div){
          div.style.cssText = 'background:transparent;border:none;width:auto;height:auto';
          const inner = document.createElement('div');
          inner.style.cssText = def.style + ';position:relative';
          inner.innerHTML = def.html;
          // ── Status dot: green=on, red=off ──
          if(stateKey !== null){
            const dot = document.createElement('div');
            const dotColor = stateKey==='on' ? '#22c55e' : '#ef4444';
            const glowColor = stateKey==='on' ? 'rgba(34,197,94,.6)' : 'rgba(239,68,68,.5)';
            dot.setAttribute('data-state-dot', key);
            dot.style.cssText = [
              'position:absolute','bottom:4px','right:4px',
              'width:7px','height:7px','border-radius:50%',
              `background:${dotColor}`,
              'border:1.5px solid rgba(255,255,255,.85)',
              `box-shadow:0 0 5px ${glowColor}`,
              'animation:dot-pulse 2.4s ease-in-out infinite',
            ].join(';');
            inner.appendChild(dot);
          }
          inner.addEventListener('mouseenter',()=>{ inner.style.transform='scale(1.12)'; });
          inner.addEventListener('mouseleave',()=>{ inner.style.transform=''; });
          div.appendChild(inner);
          div.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();});
          div.addEventListener('touchstart',e=>{e.stopPropagation();},{passive:false});
        },
        createTooltipArgs:{},
        clickHandlerFunc:function(){ openSimpleAR(desc); }
      };
    }
    const color=hs.type==='cross'?'rgba(200,225,255,.95)':'rgba(255,255,255,.95)';
    return {
      pitch:hs.pitch,yaw:hs.yaw,type:'custom',
      cssClass:hs.type==='cross'?'hs-cross':'hs-nav',
      createTooltipFunc:function(div){
        div.innerHTML='<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="'+color+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/><\/svg>';
      },
      createTooltipArgs:{},
      clickHandlerFunc:function(){goTo(hs.targetZoneId,hs.targetSceneId);}
    };
  }).filter(Boolean);

  // Dual-buffer crossfade
  const instant = false;
  const nextSlot = activeSlot===0?1:0;
  const nextId   = nextSlot===0?'pano-a':'pano-b';
  const curId    = activeSlot===0?'pano-a':'pano-b';
  const nextEl   = document.getElementById(nextId);
  const curEl    = document.getElementById(curId);

  if(window._fadeTimer){clearTimeout(window._fadeTimer);window._fadeTimer=null;}
  if(viewers[nextSlot]){try{viewers[nextSlot].destroy();}catch(e){}viewers[nextSlot]=null;}
  nextEl.innerHTML='';
  nextEl.style.transition='none';
  nextEl.style.opacity='0';
  nextEl.style.pointerEvents='none';

  const fl=document.getElementById('flash');
  if(fl){fl.classList.add('on');setTimeout(()=>fl.classList.remove('on'),80);}

  const v=pannellum.viewer(nextId,{
    type:'equirectangular', panorama:scene.file,
    autoLoad:true, autoRotate:0,
    hfov:100, minHfov:50, maxHfov:130,
    pitch:sp, yaw:sy, hotSpots:phs
  });
  viewers[nextSlot]=v;

  v.on('load',()=>{
    if(viewers[nextSlot]!==v) return;

    requestAnimationFrame(()=>{
      nextEl.style.transition='opacity .55s cubic-bezier(.4,0,.2,1)';
      nextEl.style.opacity='1';
      nextEl.style.pointerEvents='all';
      curEl.style.transition='opacity .55s cubic-bezier(.4,0,.2,1)';
      curEl.style.opacity='0';
      curEl.style.pointerEvents='none';
    });
    const slotToClean=activeSlot;
    activeSlot=nextSlot;
    window._fadeTimer=setTimeout(()=>{
      if(viewers[slotToClean]){try{viewers[slotToClean].destroy();}catch(e){}viewers[slotToClean]=null;}
      document.getElementById(slotToClean===0?'pano-a':'pano-b').innerHTML='';
      window._fadeTimer=null;
    },600);

    setTimeout(updateHotspotDots,200);
    [-1,1,2].forEach(d=>{
      const sc=zone.scenes[idx+d];
      if(sc&&!preloaded.has(sc.file)){preloaded.add(sc.file);new Image().src=sc.file;}
    });
  });
}

function stepScene(d){
  const zone=zones[curZone];
  const idx=zone?.scenes.findIndex(s=>s.id===curScene);
  const next=zone?.scenes[idx+d];
  if(next) goTo(curZone,next.id);
}

function openSimpleAR(desc){
  const def = getARDef(desc);
  if(!def){ console.warn('No AR content for:', desc); return; }
  activeAR = desc; activeTab = 0;

  // ── Hero background gradient ──
  const bg = document.getElementById('ar-hero-bg');
  const c = def.color || '#059669';
  bg.style.background = `linear-gradient(135deg, ${c}cc 0%, ${c}88 100%)`;
  const hero = document.getElementById('ar-hero');
  hero.style.background = def.heroGradient
    ? `linear-gradient(135deg, ${c}bb 0%, ${c}77 100%), ${def.heroGradient}`
    : `linear-gradient(135deg, ${c}bb 0%, ${c}55 100%)`;

  // ── Hero animated SVG ──
  const anim = document.getElementById('ar-hero-anim');
  anim.innerHTML = def.heroAnim || '';

  // ── Icon ──
  const iw = document.getElementById('ar-icon-wrap');
  iw.style.background = 'rgba(255,255,255,.25)';
  iw.style.borderColor = 'rgba(255,255,255,.5)';
  iw.innerHTML = def.icon;

  // ── Category label + title ──
  const catMap = {
    fraise:'SYSTÈME BIOLOGIQUE', co2:'CONTRÔLE CLIMATIQUE',
    brumisateur:'CONTRÔLE CLIMATIQUE', ventilation:'CONTRÔLE CLIMATIQUE',
    'système de refroidissement':'CONTRÔLE CLIMATIQUE',
    fertigation:'SYSTÈME HYDROPONIQUE', sensors:'TÉLÉMÉTRIE IOT',
    'ventilation dehors':'CONTRÔLE CLIMATIQUE',
    'rideaux auto':'CONTRÔLE CLIMATIQUE', 'fenetre auto':'CONTRÔLE CLIMATIQUE'
  };
  document.getElementById('ar-category-label').textContent = catMap[desc] || 'DIGITAL TWIN';
  document.getElementById('ar-title').textContent = def.title;


  // ── Big state pill ──
  const _pill = document.getElementById('ar-state-pill');
  const _pillTxt = document.getElementById('ar-state-pill-text');
  const _reasonStrip = document.getElementById('ar-reason-strip');
  const _reasonTxt = document.getElementById('ar-reason-text');
  const _state = def.stateKey ? hsGetState(def.stateKey) : null;
  if(_state === null){
    _pill.className = 'ar-state-pill unknown';
    _pillTxt.textContent = def.statusText || '—';
    _reasonStrip.style.display = 'none';
  } else {
    const _on = _state === 'on';
    _pill.className = 'ar-state-pill ' + (_on ? 'on' : 'off');
    _pillTxt.textContent = _on ? 'ACTIF' : 'INACTIF';
    const _reason = def.thresholds?.length
      ? (_on ? def.thresholds[0].onWhen : def.thresholds[0].offWhen)
      : (_on ? 'Système en fonctionnement' : 'Système en veille');
    _reasonStrip.style.display = 'block';
    _reasonTxt.textContent = _reason;
  }

  // ── Tab accent color via CSS var ──
  document.getElementById('ar-card').style.setProperty('--accent', def.color || '#059669');

  // ── Render first tab directly (no tab bar) ──
  renderARTab(0, def);

  // ── Stagger reset (replay animation on each open) ──
  ['ar-stagger-1','ar-stagger-2','ar-stagger-3'].forEach(cls=>{
    document.querySelectorAll('.'+cls).forEach(el=>{
      el.style.animation='none';
      requestAnimationFrame(()=>{ el.style.animation=''; });
    });
  });

  renderARTab(0, def);
  document.getElementById('ar-card').classList.add('open');
}

function switchTab(i, isAR){
  activeTab=i;
  document.querySelectorAll('.ar-tab').forEach((t,ti)=>t.classList.toggle('active',ti===i));
  if(activeAR) {
    const def = getARDef(activeAR);
    if(def) renderARTab(i, def);
  }
}

function renderARTab(i, def){
  const el = document.getElementById('ar-content');
  el.style.animation='none';
  requestAnimationFrame(()=>{ el.style.animation='ar-fade-up .22s ease both'; });

  const tagColors = {
    green:'background:#f0fdf4;border-color:#86efac;color:#15803d',
    blue:'background:#eff6ff;border-color:#93c5fd;color:#1d4ed8',
    purple:'background:#f5f3ff;border-color:#c4b5fd;color:#6d28d9',
    teal:'background:#f0fdfa;border-color:#5eead4;color:#0f766e',
    amber:'background:#fffbeb;border-color:#fcd34d;color:#b45309',
  };

  let html = '';

  // ── Live sensor readings section (if IoT tab exists) ──
  if(def.tabs.includes('IoT')){
    if(!iotData){
      html += `<div class="ar-section-title">DONNÉES EN DIRECT</div>
        <div class="iot-loading">Interrogation capteurs…</div>`;
    } else {
      const env=iotData.env||{}, irr=iotData.irr||{};
      const fmt = v => v!=null ? Number(v).toFixed(1) : '—';
      const rows=[
        {label:'Température',val:env.temperature,unit:'°C',ok:env.temperature>15&&env.temperature<30},
        {label:'Humidité',val:env.humidite,unit:'%',ok:env.humidite>50&&env.humidite<85},
        {label:'pH solution',val:irr.ph,unit:'pH',ok:irr.ph>5.5&&irr.ph<6.5},
        {label:'Conductivité EC',val:irr.ec,unit:'mS/cm',ok:irr.ec>1.0&&irr.ec<2.0},
      ];
      html += `<div class="ar-section-title">DONNÉES EN DIRECT</div>`;
      html += rows.map(r=>`
        <div class="ar-sensor-row">
          <span class="ar-sensor-label">${r.label}</span>
          <span class="ar-sensor-val">${fmt(r.val)}</span>
          <span class="ar-sensor-unit">${r.unit}</span>
          <div class="ar-sensor-dot ${r.val==null?'na':r.ok?'ok':'warn'}"></div>
        </div>`).join('');
      html += `<div class="iot-refresh" onclick="fetchIoT().then(()=>renderARTab(0,getARDef(activeAR)))">⟳ &nbsp;Actualiser</div>`;
    }
  }

  // ── État du système: threshold bars (for state-aware cards) ──
  if(def.thresholds && def.thresholds.length && iotData){
    const env = iotData.env||{};
    html += `<div class="ar-section-title">ÉTAT DU SYSTÈME</div>
      <div class="ar-thresh-block">`;
    def.thresholds.forEach(t => {
      let val = t.key === 'outsideTemp' ? outsideTemp : env[t.key];
      const fmt = val != null ? Number(val).toFixed(1) : '—';
      const pct = val != null ? Math.min(100,Math.max(0,((val-t.min)/(t.max-t.min))*100)) : 0;
      const state = hsGetState(def.stateKey);
      const barColor = state==='on' ? 'var(--accent,#059669)' : 'rgba(0,0,0,.18)';
      html += `<div class="ar-thresh-row">
        <span class="ar-thresh-label">${t.label}</span>
        <span><span class="ar-thresh-val">${fmt}</span><span class="ar-thresh-unit"> ${t.unit}</span></span>
      </div>
      <div class="ar-thresh-bar-wrap">
        <div class="ar-thresh-bar" style="width:${pct}%;background:${barColor}"></div>
      </div>`;
    });
    // Reason
    const _st = hsGetState(def.stateKey);
    const _reason = _st === null ? 'En attente des données…'
      : _st === 'on' ? def.thresholds[0].onWhen : def.thresholds[0].offWhen;
    const _rc = _st === 'on' ? 'on' : _st === null ? 'unknown' : 'off';
    html += `<div class="ar-thresh-reason ${_rc}">
      <span class="ar-thresh-dot" style="background:${_st==='on'?'#22c55e':_st===null?'rgba(0,0,0,.2)':'#f59e0b'}"></span>
      ${_reason}
    </div></div>`;
  }

  // ── Static info sections ──
  html += def.sections.map(sec => {
    let s = `<div class="ar-section-title">${sec.label}</div>`;
    if(sec.items) s += sec.items.map(item=>`
      <div class="ar-info-row">
        <span class="ar-info-label">${item.k}</span>
        ${item.tag
          ? `<span class="ar-badge" style="${tagColors[item.tag]||''}">${item.v}</span>`
          : `<span class="ar-info-value">${item.v}</span>`}
      </div>`).join('');
    if(sec.bullets) s += `<div class="ar-bullets">${sec.bullets.map(b=>
      `<div class="ar-bullet"><div class="ar-bullet-dot"></div><span>${b}</span></div>`).join('')}</div>`;
    return s;
  }).join('');

  // ── Video if present ──
  if(def.video){
    html += `<div class="ar-section-title">RESSOURCE</div>
      <div class="video-wrap">
        <iframe src="https://www.youtube.com/embed/${def.video.id}?rel=0" allowfullscreen></iframe>
      </div>
      <p class="video-desc">${def.video.desc}</p>`;
  }

  el.innerHTML = html;
}


function openAR(key, defOverride){ openSimpleAR(key); }

function closeAR(){
  document.getElementById('ar-card').classList.remove('open');
  activeAR=null;
}
