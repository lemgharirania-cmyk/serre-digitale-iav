<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AgroBioTech — Visite Immersive VR</title>

<!-- A-Frame 1.5.0 : WebXR engine, fully Meta Quest 2 compatible.
     (You can bump the version later; 1.5.0 is a known-good stable build.) -->
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>
  html,body{margin:0;height:100%;background:#EAF4EF;overflow:hidden;font-family:'DM Sans',system-ui,sans-serif;}
  a-scene{width:100%;height:100%;}

  /* light frosted-glass surface used across the 2D overlay */
  /* 2D DOM overlay — shown on flat screens, AUTO-HIDDEN in immersive VR */
  #overlay{position:fixed;inset:0;pointer-events:none;z-index:10;
    transition:opacity .3s ease;}
  body.in-vr #overlay{opacity:0;pointer-events:none!important;}

  .zf{position:absolute;top:18px;left:18px;pointer-events:none;
    background:rgba(255,255,255,.62);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid rgba(255,255,255,.85);border-radius:16px;padding:12px 18px;
    box-shadow:0 8px 30px rgba(15,40,30,.12);
    color:#0F172A;opacity:0;transform:translateY(-8px);transition:all .4s ease;}
  .zf.show{opacity:1;transform:none;}
  .zf b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em;}
  .zf span{font-size:11px;color:#475569;}

  .scene-ctr{position:absolute;top:18px;left:50%;transform:translateX(-50%);
    pointer-events:none;background:rgba(255,255,255,.62);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid rgba(255,255,255,.85);border-radius:100px;padding:6px 16px;
    box-shadow:0 8px 30px rgba(15,40,30,.12);
    color:#334155;font-size:12px;font-family:'DM Mono',monospace;}

  .arrow{position:absolute;top:50%;transform:translateY(-50%);pointer-events:auto;
    width:48px;height:48px;cursor:pointer;border-radius:50%;
    background:rgba(255,255,255,.62);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid rgba(255,255,255,.85);color:#0F172A;font-size:26px;line-height:1;
    box-shadow:0 8px 30px rgba(15,40,30,.12);
    display:flex;align-items:center;justify-content:center;transition:all .2s;}
  .arrow:hover{background:rgba(34,197,94,.20);border-color:rgba(34,197,94,.5);color:#15803D;}
  .arrow.L{left:18px;} .arrow.R{right:18px;}
  .arrow.off{opacity:0;pointer-events:none;}

  /* VR entry hint (A-Frame draws its own Enter-VR button bottom-right; this is just guidance) */
  #vrhint{position:absolute;bottom:74px;right:18px;pointer-events:none;
    background:rgba(255,255,255,.62);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);
    border:1px solid rgba(34,197,94,.45);
    color:#15803D;border-radius:10px;padding:8px 14px;font-size:12px;font-weight:600;
    box-shadow:0 8px 24px rgba(15,40,30,.14);}

  #err{position:absolute;bottom:18px;left:18px;right:18px;pointer-events:none;
    background:rgba(254,226,226,.85);backdrop-filter:blur(12px);border:1px solid rgba(239,68,68,.5);color:#B91C1C;
    border-radius:12px;padding:12px 16px;font-size:13px;display:none;}

  #dbg{position:absolute;bottom:18px;left:18px;pointer-events:none;display:none;
    background:rgba(255,255,255,.7);backdrop-filter:blur(12px);border:1px solid rgba(15,40,30,.15);
    color:#0F172A;border-radius:10px;padding:7px 12px;font-size:11px;font-family:'DM Mono',monospace;
    box-shadow:0 6px 20px rgba(15,40,30,.12);}

  /* Calibration readout — only visible with ?debug=1, for aligning hotspots on PC */
  #cal{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
    pointer-events:auto;background:rgba(255,255,255,.78);backdrop-filter:blur(16px);border:1px solid rgba(6,182,212,.4);
    color:#0E7490;border-radius:12px;padding:10px 16px;font-size:12px;
    font-family:'DM Mono',monospace;display:none;gap:10px;align-items:center;}
  #cal button{pointer-events:auto;background:rgba(6,182,212,.15);border:1px solid rgba(6,182,212,.5);
    color:#0E7490;border-radius:8px;padding:4px 10px;cursor:pointer;font-family:inherit;}
</style>
</head>
<body>

<a-scene
  loading-screen="dotsColor:#22C55E; backgroundColor:#EAF4EF"
  vr-mode-ui="enabled:true"
  device-orientation-permission-ui="enabled:true"
  renderer="colorManagement:true; antialias:true; foveationLevel:0; highRefreshRate:true; sortTransparentObjects:true"
  background="color:#EAF4EF">

  <a-assets timeout="60000"></a-assets>

  <!-- Two panorama spheres that crossfade: the old image stays visible until the
       new one is fully loaded, so there is never a black frame between scenes.
       Different radii (front=490, back=500) avoid z-fighting; front opacity is animated. -->
  <a-sky id="sky-back"  radius="500" rotation="0 -90 0" material="shader:flat; npot:true"></a-sky>
  <a-sky id="sky-front" radius="490" rotation="0 -90 0" material="shader:flat; npot:true; transparent:true; opacity:0"></a-sky>

  <!-- All nav / cross / ar hotspots get appended here -->
  <a-entity id="hotspots"></a-entity>

  <!-- In-world AR info card: one canvas-textured plane, billboarded, click anywhere to close.
       Positioned in front of the user at open time (see openAR). -->
  <a-plane id="arpanel" class="clickable" data-action="closeAR" visible="false"
    width="1.6" height="1.0" position="0 1.6 -2.2"
    material="shader:flat; transparent:true; side:double" billboard></a-plane>

  <!-- Camera rig: stays at origin (360 photo = rotate-only). 6DoF head tracking on Quest still works. -->
  <a-entity id="rig" position="0 1.6 0">
    <a-camera id="cam" wasd-controls-enabled="false" position="0 0 0"
      look-controls="reverseMouseDrag:false; touchEnabled:true; magicWindowTrackingEnabled:true">
      <!-- Mouse cursor: desktop click support (no dwell). Quest uses the controllers below. -->
      <a-entity id="mcursor" cursor="rayOrigin:mouse" raycaster="objects:.clickable; far:30"></a-entity>
    </a-camera>

    <!-- Quest 2 Touch controllers: laser pointer + trigger click -->
    <a-entity id="lh" laser-controls="hand:left"  raycaster="objects:.clickable; far:30; lineColor:#06B6D4; lineOpacity:0.85"
      cursor="rayOrigin:entity; fuse:false; downEvents:triggerdown; upEvents:triggerup"></a-entity>
    <a-entity id="rh" laser-controls="hand:right" raycaster="objects:.clickable; far:30; lineColor:#22C55E; lineOpacity:0.85"
      cursor="rayOrigin:entity; fuse:false; downEvents:triggerdown; upEvents:triggerup"></a-entity>
  </a-entity>
</a-scene>

<!-- ===================== 2D OVERLAY (flat screens only) ===================== -->
<div id="overlay">
  <div class="zf" id="zf"><b id="zfn">—</b><span id="zfu"></span></div>
  <div class="scene-ctr" id="scene-ctr">— / —</div>
  <button class="arrow L off" id="prev" onclick="stepScene(-1)">&#8249;</button>
  <button class="arrow R off" id="next" onclick="stepScene(1)">&#8250;</button>
  <div id="vrhint">Cliquez « Enter VR » ↘</div>
  <div id="err"></div>
  <div id="dbg"></div>
  <div id="cal">
    yaw offset: <b id="cal-val">0</b>°
    <button onclick="nudgeOffset(-5)">−5</button>
    <button onclick="nudgeOffset(5)">+5</button>
    <button onclick="nudgeOffset(-1)">−1</button>
    <button onclick="nudgeOffset(1)">+1</button>
    <button onclick="logOffset()">copy</button>
  </div>
</div>

<script>
/* ============================================================================
   AgroBioTech — A-Frame WebXR tour
   Reads the SAME images/manifest.json + same panoramas as the Pannellum version.
   Schema (reconstructed from the original loader):
     manifest.zones[]  = { id, label, unit, scenes:[ {id, file} ] }
     manifest.hotspots = { [zoneId]: { [sceneId]: [ {type, pitch, yaw, targetZoneId, targetSceneId, arDesc?, label?} ] } }
   ============================================================================ */

const START_ZONE   = new URLSearchParams(location.search).get('zone') || window.UNIT_ZONE || 'exterieur';
const SCENE_RADIUS = 8;          // sphere radius hotspots sit on
let   YAW_OFFSET   = 0;          // global calibration; tune once on PC, then bake in (see notes)
const VR_SUPERSAMPLE = 1.3;     // headset render scale: >1 sharpens (1.5 sharper, costs GPU; 1.0 = off)
let   AR_PITCH_OFFSET = 6;       // raises ONLY the AR info hotspots, in degrees. Increase = higher.

let manifest, zones = {}, hotspots = {};
let curZone = null, curScene = null, lastZoneId = null;
const navHistory = [];
let busy = false;
let frontActive = false;   // is #sky-front the sphere currently showing the active image?

const $ = id => document.getElementById(id);

/* ---- Pannellum (yaw,pitch in degrees) -> A-Frame world position on the sphere ----
   yaw 0  => forward (-Z) ; yaw + => right (+X) ; pitch + => up. Matches Pannellum. */
function yawPitchToXYZ(yaw, pitch, r = SCENE_RADIUS) {
  const y = (yaw + YAW_OFFSET) * Math.PI / 180;
  const p = pitch * Math.PI / 180;
  return {
    x:  r * Math.cos(p) * Math.sin(y),
    y:  r * Math.sin(p),
    z: -r * Math.cos(p) * Math.cos(y)
  };
}

/* ---- billboard: keep a hotspot facing the camera (handles 6DoF head movement) ---- */
AFRAME.registerComponent('billboard', {
  init(){ this._v = new THREE.Vector3(); },
  tick(){
    const cam = this.el.sceneEl.camera;
    if (!cam) return;
    cam.getWorldPosition(this._v);
    this.el.object3D.lookAt(this._v);
  }
});

/* ---- preload an image so the sky never shows a half-loaded texture ---- */
function preload(url){
  return new Promise((res, rej) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => res(url);
    img.onerror = () => rej(new Error('Image introuvable : ' + url));
    img.src = url;
  });
}

/* ============================ canvas-textured UI ============================
   Rendering markers and cards to a canvas gives crisp icons, rounded corners,
   gradients and glow — far cleaner than stacked flat planes. */

function applyCanvasTexture(planeEl, canvas){
  const set = () => {
    const mesh = planeEl.getObject3D('mesh');
    if (!mesh) return;
    const tex = new THREE.CanvasTexture(canvas);
    if ('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 8; tex.needsUpdate = true;
    mesh.material.map = tex;
    mesh.material.color.set('#ffffff');   // show texture colours, not a white tint
    mesh.material.transparent = true;
    mesh.material.needsUpdate = true;
  };
  // wait until ALL components (incl. material) have initialised, else the
  // material component can replace the material and wipe out our texture.
  if (planeEl.hasLoaded) set();
  else planeEl.addEventListener('loaded', set, { once:true });
}

function hexA(hex, a){
  const n = parseInt(hex.replace('#',''), 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x+r, y);
  c.arcTo(x+w, y,   x+w, y+h, r);
  c.arcTo(x+w, y+h, x,   y+h, r);
  c.arcTo(x,   y+h, x,   y,   r);
  c.arcTo(x,   y,   x+w, y,   r);
  c.closePath();
}

function chevron(c, x, y, s){   // points UP (^)
  c.beginPath();
  c.moveTo(x - s*0.6, y + s*0.4);
  c.lineTo(x,          y - s*0.5);
  c.lineTo(x + s*0.6,  y + s*0.4);
  c.stroke();
}

// circular light-glass badge with a crisp icon (nav / cross / ar)
function drawBadge(type, color){
  const S = 256, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const c = cv.getContext('2d'), cx = S/2, cy = S/2;

  // soft accent glow
  const g = c.createRadialGradient(cx, cy, 24, cx, cy, S/2);
  g.addColorStop(0, hexA(color, 0.45)); g.addColorStop(1, hexA(color, 0));
  c.fillStyle = g; c.fillRect(0, 0, S, S);

  // frosted light-glass disc + accent ring
  c.beginPath(); c.arc(cx, cy, 76, 0, Math.PI*2);
  c.fillStyle = 'rgba(255,255,255,0.80)'; c.fill();
  c.lineWidth = 9; c.strokeStyle = color; c.stroke();

  // icon (accent colour)
  c.strokeStyle = color; c.fillStyle = color;
  c.lineWidth = 17; c.lineCap = 'round'; c.lineJoin = 'round';
  if (type === 'ar'){
    c.beginPath(); c.arc(cx, cy - 34, 11, 0, Math.PI*2); c.fill();          // info dot
    c.beginPath(); c.moveTo(cx, cy - 4); c.lineTo(cx, cy + 46); c.stroke(); // info stem
  } else if (type === 'cross'){
    chevron(c, cx, cy - 17, 28); chevron(c, cx, cy + 17, 28);              // double up-chevron
  } else {
    chevron(c, cx, cy, 44);                                                // single up-chevron
  }
  return cv;
}

function wrapText(c, text, x, y, maxW, lh, maxLines){
  const words = String(text).split(/\s+/);
  let line = '', count = 0;
  for (const w of words){
    const test = line ? line + ' ' + w : w;
    if (c.measureText(test).width > maxW && line){
      c.fillText(line, x, y); y += lh; line = w; count++;
      if (maxLines && count >= maxLines) return;
    } else line = test;
  }
  if (!maxLines || count < maxLines) c.fillText(line, x, y);
}

// light-glass info card with accent title, dark body text and footer hint
function drawCard(title, body){
  const W = 1024, H = 640, cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d');
  const pad = 46, r = 44, x0 = pad + 54;

  // frosted light panel + soft neutral shadow
  c.shadowColor = 'rgba(15,23,42,0.28)'; c.shadowBlur = 55;
  const g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, 'rgba(255,255,255,0.88)'); g.addColorStop(1, 'rgba(236,250,243,0.88)');
  roundRect(c, pad, pad, W - 2*pad, H - 2*pad, r); c.fillStyle = g; c.fill();
  c.shadowBlur = 0;

  // light glass border
  roundRect(c, pad, pad, W - 2*pad, H - 2*pad, r);
  c.lineWidth = 2.5; c.strokeStyle = 'rgba(255,255,255,0.95)'; c.stroke();

  // title (readable green)
  c.fillStyle = '#15803D'; c.textBaseline = 'alphabetic';
  c.font = '700 56px "DM Sans", system-ui, sans-serif';
  wrapText(c, title || 'Info', x0, pad + 108, W - 2*x0 + 2*pad, 60, 1);

  // accent bar green -> cyan
  const ay = pad + 150;
  const ag = c.createLinearGradient(x0, 0, x0 + 150, 0);
  ag.addColorStop(0, '#22C55E'); ag.addColorStop(1, '#06B6D4');
  c.fillStyle = ag; c.fillRect(x0, ay, 150, 6);

  // body (dark slate, readable on light)
  c.fillStyle = '#1E293B'; c.font = '400 34px "DM Sans", system-ui, sans-serif';
  wrapText(c, body || '', x0, ay + 66, W - 2*x0 + 2*pad, 46, 8);

  c.fillStyle = '#64748B'; c.font = '500 26px "DM Sans", system-ui, sans-serif';
  c.fillText('Touchez pour fermer', x0, H - pad - 34);
  return cv;
}

/* ---- build one hotspot entity ----
   wrap = positioned container (billboarded).
   hit  = the actual clickable target — it MUST carry its own geometry so the
          controller laser / mouse ray has a mesh to intersect (this was the bug). */
function makeHotspot(hs){
  const isAR = hs.type === 'ar';
  const pitch = hs.pitch + (isAR ? AR_PITCH_OFFSET : 0);   // nudge AR info icons up
  const pos = yawPitchToXYZ(hs.yaw, pitch);
  const wrap = document.createElement('a-entity');
  wrap.setAttribute('position', `${pos.x} ${pos.y} ${pos.z}`);
  wrap.setAttribute('billboard', '');

  const color = isAR ? '#F59E0B' : (hs.type === 'cross' ? '#06B6D4' : '#22C55E');

  // --- transparent hit area: this is the .clickable element with real geometry ---
  const hit = document.createElement('a-circle');
  hit.setAttribute('radius', 0.36);
  hit.setAttribute('material', 'shader:flat; color:#000; opacity:0.001; transparent:true; side:double');
  hit.classList.add('clickable');
  // store the action on the element; a delegated handler reads it (robust vs which
  // child mesh the laser actually hits)
  hit.dataset.hs = isAR ? 'ar' : 'nav';
  if (isAR){
    hit.dataset.arTitle = hs.label || hs.arDesc || '';
    hit.dataset.arBody  = hs.arDesc || '';
  } else {
    hit.dataset.tz = hs.targetZoneId != null ? String(hs.targetZoneId) : '';
    hit.dataset.ts = hs.targetSceneId != null ? String(hs.targetSceneId) : '';
  }
  wrap.appendChild(hit);

  // --- visual badge: canvas-textured plane (crisp icon + glow), child of hit ---
  const badge = document.createElement('a-plane');
  badge.setAttribute('width', 0.64);
  badge.setAttribute('height', 0.64);
  badge.setAttribute('material', 'shader:flat; transparent:true; side:double');
  badge.setAttribute('animation__pulse',
    'property:scale; dir:alternate; loop:true; dur:1600; from:1 1 1; to:1.08 1.08 1');
  hit.appendChild(badge);
  applyCanvasTexture(badge, drawBadge(hs.type, color));

  // hover feedback on the hit element
  hit.addEventListener('mouseenter', () => hit.object3D.scale.set(1.25,1.25,1.25));
  hit.addEventListener('mouseleave', () => hit.object3D.scale.set(1,1,1));
  return wrap;
}

/* ---- AR in-world panel ---- */
function openAR(title, body){
  const card = $('arpanel');
  applyCanvasTexture(card, drawCard(title, body));
  placeInFront(card, 2.2);          // float ~2.2 m in front of current gaze
  card.setAttribute('visible', true);
}
function closeAR(){ $('arpanel').setAttribute('visible', false); }

// position an element a given distance in front of where the camera is looking
function placeInFront(el, dist){
  const cam = el.sceneEl && el.sceneEl.camera;
  if (!cam) return;
  const camPos = new THREE.Vector3(), camDir = new THREE.Vector3();
  cam.getWorldPosition(camPos);
  cam.getWorldDirection(camDir);
  el.object3D.position.copy(camPos).add(camDir.multiplyScalar(dist));
}

/* re-scan every raycaster (controllers + mouse) for clickable hotspots.
   Runs a couple of frames late so the freshly-created hotspot meshes exist. */
function refreshRaycasters(){
  const scan = () => document.querySelectorAll('[raycaster]').forEach(el => {
    const rc = el.components && el.components.raycaster;
    if (rc) rc.refreshObjects();
  });
  requestAnimationFrame(() => requestAnimationFrame(scan));
  setTimeout(scan, 200);
}

/* Delegated click handler. A-Frame clicks bubble up the DOM, and the laser may
   land on the badge or the hit circle — so we walk UP from whatever was clicked
   to find the element carrying the action. Robust regardless of which mesh is hit. */
document.querySelector('a-scene').addEventListener('click', e => {
  let el = e.target;
  while (el && el.tagName){
    const d = el.dataset;
    if (d){
      if (d.action === 'closeAR'){ dbg('close card'); closeAR(); return; }
      if (d.hs === 'ar'){ dbg('AR: ' + (d.arTitle || '')); openAR(d.arTitle, d.arBody); return; }
      if (d.hs === 'nav'){ dbg('nav -> ' + d.tz + '/' + d.ts + (busy ? ' [BUSY]' : '')); goTo(d.tz, d.ts); return; }
    }
    el = el.parentElement;
  }
});

/* ---- core scene loader (mirrors the original load(), minus Pannellum) ---- */
async function load(zid, sid, instant){
  const zone = zones[zid];
  const scene = zone && zone.scenes.find(s => s.id === sid);
  if (!zone || !scene){ showErr('Scène introuvable : ' + zid + '/' + sid); return; }
  if (busy) return; busy = true;

  // clear current hotspots + panel during the transition
  const host = $('hotspots');
  while (host.firstChild) host.removeChild(host.firstChild);
  closeAR();

  // everything except the panorama swap (hotspots, labels, counters)
  const finish = () => {
    try {
      curZone = zid; curScene = sid;
      const list = (hotspots[zid] && hotspots[zid][sid]) || [];
      list.forEach(hs => host.appendChild(makeHotspot(hs)));
      refreshRaycasters();   // controllers/mouse must re-scan for the new clickable hotspots

      const idx = zone.scenes.indexOf(scene);
      $('prev').className = 'arrow L' + (idx === 0 ? ' off' : '');
      $('next').className = 'arrow R' + (idx === zone.scenes.length - 1 ? ' off' : '');
      $('scene-ctr').textContent = (idx + 1) + ' / ' + zone.scenes.length;

      if (zid !== lastZoneId){
        lastZoneId = zid;
        $('zfn').textContent = zone.label;
        $('zfu').textContent = (zone.unit && zone.unit !== '\u2014') ? ('Unité ' + zone.unit) : '';
        const zf = $('zf'); zf.classList.remove('show');
        requestAnimationFrame(() => zf.classList.add('show'));
        clearTimeout(window._zfT);
        window._zfT = setTimeout(() => zf.classList.remove('show'), 3000);
      }
      dbg('scène: ' + zid + '/' + sid + '  (' + list.length + ' hotspots)');
    } catch (e){ showErr('finish: ' + e.message); }
    finally { busy = false; }   // the lock MUST always release
  };

  // FIRST load: put image on the back sphere, keep front hidden
  if (instant){
    try { await setSky($('sky-back'), scene.file); }
    catch (e){ showErr(e.message); }
    setOpacity($('sky-front'), 0);
    frontActive = false;
    finish();
    return;
  }

  // TRANSITION: load the new image onto whichever sphere is currently hidden,
  // wait until its texture is ready, THEN crossfade. The old image never blanks.
  try {
    const hidden = frontActive ? $('sky-back') : $('sky-front');
    await setSky(hidden, scene.file);
    const front = $('sky-front');
    const target = frontActive ? 0 : 1;   // front visible -> fade out to reveal back; else fade in to cover back
    fadeSky(front, target, 420, () => { frontActive = !frontActive; finish(); });
  } catch (e){
    showErr('load: ' + e.message);
    finish();   // still rebuild + release the lock so the tour isn't stuck
  }
}

/* ---- sky helpers (manual opacity tween = reliable, no animation-component quirks) ---- */
function skyMat(el){ const m = el.getObject3D('mesh'); return m ? m.material : null; }

function setOpacity(el, v){
  const m = skyMat(el);
  if (m){ m.transparent = true; m.opacity = v; m.needsUpdate = true; }
}

function fadeSky(el, to, dur, done){
  const m = skyMat(el);
  if (!m){ done && done(); return; }
  m.transparent = true;
  const from = m.opacity, t0 = performance.now();
  (function step(now){
    const k = Math.min((now - t0) / dur, 1);
    const e = k < 0.5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2) / 2;   // easeInOutQuad
    m.opacity = from + (to - from) * e; m.needsUpdate = true;
    if (k < 1) requestAnimationFrame(step); else { m.opacity = to; done && done(); }
  })(performance.now());
}

// set a sky's panorama and resolve once its texture is actually decoded
function setSky(el, url){
  return new Promise((res) => {
    let done = false;
    const ok = () => {
      if (done) return; done = true;
      el.removeEventListener('materialtextureloaded', ok);
      try {
        // sharpen the panorama at oblique angles with anisotropic filtering
        const mesh = el.getObject3D('mesh');
        const r = el.sceneEl && el.sceneEl.renderer;
        if (mesh && mesh.material.map && r && r.capabilities){
          mesh.material.map.anisotropy = r.capabilities.getMaxAnisotropy();
          mesh.material.map.needsUpdate = true;
        }
      } catch (e){ /* never let this block the promise */ }
      res();
    };
    el.addEventListener('materialtextureloaded', ok);
    el.setAttribute('material', 'src', url);
    setTimeout(ok, 1800);   // fallback if the event doesn't fire (e.g. cached texture)
  });
}

function goTo(zid, sid){
  if (busy) return;
  if (curZone && curScene) navHistory.push({ zoneId: curZone, sceneId: curScene });
  if (navHistory.length > 50) navHistory.shift();
  load(zid, sid);
}

/* prev / next within the current zone (2D arrows + could be mapped to controller later) */
function stepScene(dir){
  const zone = zones[curZone]; if (!zone) return;
  const idx = zone.scenes.findIndex(s => s.id === curScene);
  const ni = idx + dir;
  if (ni < 0 || ni >= zone.scenes.length) return;
  goTo(curZone, zone.scenes[ni].id);
}

function showErr(msg){
  const e = $('err'); e.textContent = msg; e.style.display = 'block';
  console.error('[VR-TOUR]', msg);
}

// lightweight status line (visible on desktop/emulator; logs to console always)
function dbg(msg){
  console.log('[VR-TOUR]', msg);
  const el = $('dbg'); if (el){ el.textContent = msg; el.style.display = 'block'; }
}

/* ---- calibration helpers (?debug=1) ---- */
function nudgeOffset(d){
  YAW_OFFSET += d; $('cal-val').textContent = YAW_OFFSET;
  if (curZone && curScene) load(curZone, curScene, true);   // re-place hotspots instantly
}
function logOffset(){
  console.log('%cYAW_OFFSET =', 'color:#22C55E;font-weight:bold', YAW_OFFSET,
    '\n→ paste this number into the YAW_OFFSET constant at the top of the file.');
  alert('YAW_OFFSET = ' + YAW_OFFSET + '\nCheck the console, then hard-code it at the top of the file.');
}

/* ---- boot ---- */
window.addEventListener('load', async () => {
  try {
    const r = await fetch('images/manifest.json');
    if (!r.ok) throw new Error('manifest.json HTTP ' + r.status);
    manifest = await r.json();
  } catch (e){
    showErr('Impossible de charger images/manifest.json — vérifiez le chemin. (' + e.message + ')');
    return;
  }
  (manifest.zones || []).forEach(z => zones[z.id] = z);
  hotspots = manifest.hotspots || {};

  const p = new URLSearchParams(location.search);
  const z = p.get('zone') || START_ZONE;
  const s = p.get('scene') || (zones[z] && zones[z].scenes[0] && zones[z].scenes[0].id);
  if (!zones[z] || !s){ showErr('Zone de départ invalide : ' + z); return; }

  load(z, s, true);

  if (p.get('debug') === '1') $('cal').style.display = 'flex';
});

/* hide 2D overlay while inside immersive VR */
const sc = document.querySelector('a-scene');
sc.addEventListener('enter-vr', () => {
  document.body.classList.add('in-vr');
  try { sc.renderer.xr.setFramebufferScaleFactor(VR_SUPERSAMPLE); } catch(e){}
});
sc.addEventListener('exit-vr',  () => document.body.classList.remove('in-vr'));
</script>
