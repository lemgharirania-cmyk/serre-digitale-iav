<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AgroBioTech — Cardboard VR</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Inter',system-ui,sans-serif}

/* ═══════════════════════════════════
   NORMAL MODE — pannellum plein écran
   ═══════════════════════════════════ */
#normal-view{position:fixed;inset:0;z-index:1}
#pano-a,#pano-b{position:absolute;inset:0;width:100%;height:100%}
#pano-a{opacity:1}
#pano-b{opacity:0;pointer-events:none}

/* ═══════════════════════════════════
   CARDBOARD MODE — split left / right
   ═══════════════════════════════════ */
#cardboard-view{
  position:fixed;inset:0;z-index:2;
  display:none;
  flex-direction:row;
  background:#000;
}
/* Chaque œil occupe 50% de la largeur */
#eye-left,#eye-right{
  position:relative;
  width:50%;height:100%;
  overflow:hidden;
}
/* Ligne de séparation centrale */
#eye-divider{
  position:absolute;left:50%;top:0;bottom:0;
  width:3px;background:#000;z-index:10;
  transform:translateX(-50%);
}
/* Les slots pannellum dans chaque œil */
#pano-left-a,#pano-left-b,
#pano-right-a,#pano-right-b{
  position:absolute;inset:0;width:100%;height:100%;
}
#pano-left-a,#pano-right-a{opacity:1}
#pano-left-b,#pano-right-b{opacity:0;pointer-events:none}

/* Cacher tout le chrome Pannellum */
.pnlm-about-msg,.pnlm-panorama-info,.pnlm-controls-container,
.pnlm-load-box,.pnlm-lbar,.pnlm-lbar-fill,.pnlm-load-button,
.pnlm-loading,.pnlm-compass{display:none!important}
.pnlm-hotspot-base{background:transparent!important;border:none!important;
  width:auto!important;height:auto!important;overflow:visible!important}
.pnlm-hotspot-base .pnlm-sprite{display:none!important}

/* Hotspots */
.hs-nav{width:68px;height:68px;border-radius:50%;cursor:pointer;
  background:rgba(255,255,255,.15);border:2px solid rgba(255,255,255,.5);
  box-shadow:0 2px 20px rgba(0,0,0,.3);
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s,background .2s}
.hs-nav:hover{transform:scale(1.1);background:rgba(255,255,255,.25)}
.hs-cross{width:68px;height:68px;border-radius:50%;cursor:pointer;
  background:rgba(147,197,253,.15);border:2px solid rgba(147,197,253,.5);
  box-shadow:0 2px 20px rgba(30,80,200,.2);
  display:flex;align-items:center;justify-content:center;
  transition:transform .2s,background .2s}
.hs-cross:hover{transform:scale(1.1);background:rgba(147,197,253,.25)}

/* Atmosphère subtile */
#atmo-l,#atmo-r{
  position:absolute;inset:0;z-index:5;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.08) 0%,transparent 30%,transparent 70%,rgba(0,0,0,.15) 100%);
}
/* Lens distortion effect cardboard (barrel) */
#eye-left,#eye-right{
  clip-path:ellipse(48% 48% at 50% 50%);
}

/* Flash transition */
#flash{position:fixed;inset:0;z-index:100;background:#fff;opacity:0;pointer-events:none;transition:opacity .08s}
#flash.on{opacity:.35}

/* ═══════════════════════════════════
   BOUTON CARDBOARD
   ═══════════════════════════════════ */
#cb-btn{
  position:fixed;bottom:24px;right:24px;z-index:9999;
  display:flex;align-items:center;gap:10px;
  padding:0 22px;height:52px;border-radius:100px;
  background:rgba(255,255,255,.14);
  border:1.5px solid rgba(255,255,255,.4);
  backdrop-filter:blur(20px);
  color:rgba(255,255,255,.92);
  font-size:13px;font-weight:700;letter-spacing:.05em;
  cursor:pointer;white-space:nowrap;
  font-family:'Inter',system-ui,sans-serif;
  animation:cbPulse 3s ease-in-out infinite;
  transition:all .2s;
}
#cb-btn:hover{
  background:rgba(34,197,94,.5);
  border-color:rgba(34,197,94,.8);
  box-shadow:0 0 24px rgba(34,197,94,.5);
}
@keyframes cbPulse{
  0%,100%{box-shadow:0 8px 32px rgba(0,0,0,.35),0 0 0 0 rgba(34,197,94,0)}
  50%{box-shadow:0 8px 32px rgba(0,0,0,.35),0 0 0 8px rgba(34,197,94,.12)}
}

/* Bouton quitter */
#cb-exit{
  display:none;
  position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:9999;
  padding:10px 22px;border-radius:100px;
  background:rgba(0,0,0,.6);
  border:1px solid rgba(255,255,255,.3);
  color:rgba(255,255,255,.9);
  font-size:13px;font-weight:600;cursor:pointer;
  font-family:'Inter',system-ui;
  backdrop-filter:blur(12px);
  transition:opacity 1s;
}

/* Zone flash UI */
.zf{
  position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
  z-index:50;pointer-events:none;
  background:rgba(0,0,0,.6);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.15);border-radius:12px;
  padding:10px 20px;text-align:center;
  opacity:0;transition:opacity .4s;
}
.zf.show{opacity:1}
.zf-label{font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:2px}
.zf-name{font-size:15px;font-weight:600;color:#fff}
.zf-unit{font-size:11px;color:rgba(255,255,255,.5);margin-top:1px}

/* Arrows nav normal mode */
.arrow{
  position:fixed;top:50%;transform:translateY(-50%);
  z-index:20;background:rgba(255,255,255,.12);
  border:1px solid rgba(255,255,255,.25);
  border-radius:50%;width:46px;height:46px;
  display:flex;align-items:center;justify-content:center;
  font-size:22px;color:rgba(255,255,255,.8);cursor:pointer;
  transition:all .2s;backdrop-filter:blur(8px);
}
.arrow:hover{background:rgba(255,255,255,.22);color:#fff}
.arrow.L{left:16px}
.arrow.R{right:16px}
.arrow.off{opacity:.2;pointer-events:none}

/* Scene counter */
.scene-ctr{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  z-index:20;background:rgba(0,0,0,.5);backdrop-filter:blur(8px);
  border:1px solid rgba(255,255,255,.12);border-radius:20px;
  padding:5px 14px;font-size:12px;font-weight:500;color:rgba(255,255,255,.65);
  opacity:0;transition:opacity .5s;
}
.scene-ctr.show{opacity:1}

/* IPD indicator pill (cardboard mode) */
#ipd-pill{
  display:none;
  position:fixed;top:12px;left:50%;transform:translateX(-50%);
  z-index:9999;
  background:rgba(0,0,0,.55);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.18);border-radius:100px;
  padding:5px 16px;color:rgba(255,255,255,.7);font-size:11px;font-weight:600;
  letter-spacing:.08em;text-transform:uppercase;
  font-family:'Inter',system-ui;pointer-events:none;
}
</style>
</head>
<body>

<!-- ── NORMAL VIEW ── -->
<div id="normal-view">
  <div id="pano-a"></div>
  <div id="pano-b"></div>
</div>

<!-- ── CARDBOARD VIEW ── -->
<div id="cardboard-view">
  <div id="eye-left">
    <div id="pano-left-a"></div>
    <div id="pano-left-b"></div>
    <div id="atmo-l"></div>
  </div>
  <div id="eye-divider"></div>
  <div id="eye-right">
    <div id="pano-right-a"></div>
    <div id="pano-right-b"></div>
    <div id="atmo-r"></div>
  </div>
</div>

<div id="flash"></div>
<div id="atmo"></div>

<!-- Navigation normale -->
<button class="arrow L off" id="prev" onclick="stepScene(-1)">&#8249;</button>
<button class="arrow R off" id="next" onclick="stepScene(1)">&#8250;</button>

<div class="zf" id="zf">
  <div class="zf-label">Zone active</div>
  <div class="zf-name" id="zfn">—</div>
  <div class="zf-unit" id="zfu"></div>
</div>
<div class="scene-ctr" id="scene-ctr">— / —</div>

<!-- Bouton Cardboard -->
<button id="cb-btn" onclick="enterCardboard()">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 8a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V8z"/>
    <circle cx="8.5" cy="12" r="1.5"/><circle cx="15.5" cy="12" r="1.5"/>
    <path d="M10 12h4"/>
  </svg>
  Mode Cardboard
</button>
<button id="cb-exit" onclick="exitCardboard()">&#10005; Quitter</button>
<div id="ipd-pill">Cardboard VR — IPD 63mm</div>

<script>
/* ══════════════════════════════════════════════
   STATE
   ══════════════════════════════════════════════ */
const START_ZONE = null; // will use manifest first zone
let manifest, zones={}, hotspots={};
let curZone, curScene;
const preloaded=new Set();
let lastZoneId=null, sceneT;
const navHistory=[];

// Normal mode viewers
let viewers=[null,null], activeSlot=0;

// Cardboard mode viewers (4 slots: left-a, left-b, right-a, right-b)
let cbViewers=[null,null,null,null], cbActiveSlot=0;
let cbMode=false;

// Gyro state
let lastAlpha=null, lastBeta=null, lastGamma=null;
let gyroTimer=null;

/* ══════════════════════════════════════════════
   MANIFEST LOAD
   ══════════════════════════════════════════════ */
window.addEventListener('load', async ()=>{
  const r=await fetch('images/manifest.json');
  manifest=await r.json();
  manifest.zones.forEach(z=>zones[z.id]=z);
  hotspots=manifest.hotspots||{};
  const p=new URLSearchParams(location.search);
  const firstZone=manifest.zones[0]?.id;
  const z=p.get('zone')||firstZone;
  const s=p.get('scene')||zones[z]?.scenes[0]?.id;
  load(z,s,true);

  document.addEventListener('keydown',e=>{
    if(e.code==='ArrowRight') stepScene(1);
    if(e.code==='ArrowLeft')  stepScene(-1);
    if(e.code==='Escape'&&cbMode) exitCardboard();
  });
  setTimeout(()=>document.getElementById('scene-ctr').classList.add('show'),800);
});

/* ══════════════════════════════════════════════
   NAVIGATION HELPERS
   ══════════════════════════════════════════════ */
function goTo(zid,sid){
  if(curZone&&curScene) navHistory.push({zoneId:curZone,sceneId:curScene});
  if(navHistory.length>50) navHistory.shift();
  load(zid,sid,false);
}

function stepScene(d){
  const zone=zones[curZone];
  const idx=zone?.scenes.findIndex(s=>s.id===curScene);
  const next=zone?.scenes[idx+d];
  if(next) goTo(curZone,next.id);
}

/* ══════════════════════════════════════════════
   BUILD HOTSPOT LIST
   ══════════════════════════════════════════════ */
function buildHotspots(zid,sid,clickHandler){
  const zone=zones[zid];
  const scene=zone?.scenes.find(s=>s.id===sid);
  if(!zone||!scene) return [];
  const idx=zone.scenes.indexOf(scene);

  const shs=(hotspots[zid]?.[sid]||[]).filter(h=>h.type!=='ar').slice();

  // Auto back
  const fwdNav=shs.find(h=>h.type==='nav'&&h.targetSceneId!==sid&&h.targetZoneId===zid);
  const hasAnyBack=shs.some(h=>zones[h.targetZoneId]?.scenes.findIndex(s=>s.id===h.targetSceneId)===idx-1);
  if(fwdNav&&idx>0&&!hasAnyBack){
    const by=((fwdNav.yaw+180)+360)%360;
    shs.push({type:'nav',pitch:fwdNav.pitch,yaw:by>180?by-360:by,
      targetZoneId:zid,targetSceneId:zone.scenes[idx-1].id,auto:true});
  }
  // Cross-zone back
  const prev=navHistory.length>0?navHistory[navHistory.length-1]:null;
  const hasAnyCross=shs.some(h=>h.type==='cross');
  const hasForward=shs.some(h=>!h.auto&&h.targetSceneId!==sid);
  if(prev&&!hasAnyCross&&!hasForward){
    const pz=zones[prev.zoneId];
    if(pz){
      const refYaw=fwdNav?.yaw??(shs[0]?.yaw??0);
      const by=((refYaw+180)+360)%360;
      shs.push({type:'cross',pitch:fwdNav?.pitch??-20,yaw:by>180?by-360:by,
        targetZoneId:prev.zoneId,targetSceneId:prev.sceneId,auto:true});
    }
  }

  return shs.map(hs=>{
    const isX=hs.type==='cross';
    const color=isX?'rgba(200,225,255,.9)':'rgba(255,255,255,.9)';
    return {
      pitch:hs.pitch, yaw:hs.yaw, type:'custom',
      cssClass:isX?'hs-cross':'hs-nav',
      createTooltipFunc:function(div){
        const inner=document.createElement('div');
        inner.style.cssText='width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;';
        inner.innerHTML=`<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>`;
        inner.addEventListener('mouseenter',()=>{inner.style.transform='scale(1.1)';});
        inner.addEventListener('mouseleave',()=>{inner.style.transform='';});
        div.appendChild(inner);
        div.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();});
      },
      createTooltipArgs:{},
      clickHandlerFunc:function(){ clickHandler(hs.targetZoneId,hs.targetSceneId); }
    };
  });
}

/* ══════════════════════════════════════════════
   NORMAL MODE LOAD
   ══════════════════════════════════════════════ */
function load(zid,sid,instant){
  const zone=zones[zid];
  const scene=zone?.scenes.find(s=>s.id===sid);
  if(!zone||!scene) return;
  curZone=zid; curScene=sid;
  const idx=zone.scenes.indexOf(scene);

  document.getElementById('prev').className='arrow L'+(idx===0?' off':'');
  document.getElementById('next').className='arrow R'+(idx===zone.scenes.length-1?' off':'');
  document.getElementById('scene-ctr').textContent=`${idx+1} / ${zone.scenes.length}`;

  if(zid!==lastZoneId){
    lastZoneId=zid;
    document.getElementById('zfn').textContent=zone.label;
    document.getElementById('zfu').textContent=zone.unit!=='—'?`Unité ${zone.unit}`:'';
    const zf=document.getElementById('zf');
    zf.classList.remove('show');
    requestAnimationFrame(()=>zf.classList.add('show'));
    clearTimeout(sceneT);
    sceneT=setTimeout(()=>zf.classList.remove('show'),3000);
  }

  if(cbMode){
    loadCardboardScene(zid,sid,instant);
    return;
  }

  // Flash
  if(!instant){
    const fl=document.getElementById('flash');
    fl.classList.add('on');
    setTimeout(()=>fl.classList.remove('on'),80);
  }

  const phs=buildHotspots(zid,sid,goTo);
  const fst=phs[0];
  const sy=fst?.yaw??0;
  const sp=fst?Math.min((fst.pitch||0)+20,5):0;

  const nextSlot=instant?activeSlot:(activeSlot===0?1:0);
  const nextId=nextSlot===0?'pano-a':'pano-b';
  const curId=activeSlot===0?'pano-a':'pano-b';
  const nextEl=document.getElementById(nextId);
  const curEl=document.getElementById(curId);

  if(window._fadeTimer){clearTimeout(window._fadeTimer);window._fadeTimer=null;}
  if(viewers[nextSlot]){try{viewers[nextSlot].destroy();}catch(e){}viewers[nextSlot]=null;}
  nextEl.innerHTML='';
  nextEl.style.cssText='position:absolute;inset:0;width:100%;height:100%;opacity:0;pointer-events:none';

  const v=pannellum.viewer(nextId,{
    type:'equirectangular', panorama:scene.file,
    autoLoad:true, autoRotate:0,
    hfov:100, minHfov:60, maxHfov:120,
    pitch:sp, yaw:sy, hotSpots:phs,
    orientationOnByDefault:/Oculus|Quest|VR|Android|iPhone|iPad/i.test(navigator.userAgent)
  });
  viewers[nextSlot]=v;

  v.on('load',()=>{
    if(viewers[nextSlot]!==v) return;
    if(instant){
      nextEl.style.opacity='1';
      nextEl.style.pointerEvents='all';
      activeSlot=nextSlot;
    } else {
      requestAnimationFrame(()=>{
        nextEl.style.transition='opacity .55s cubic-bezier(.4,0,.2,1)';
        nextEl.style.opacity='1';
        nextEl.style.pointerEvents='all';
        curEl.style.transition='opacity .55s cubic-bezier(.4,0,.2,1)';
        curEl.style.opacity='0';
        curEl.style.pointerEvents='none';
      });
      const slotToClean=activeSlot;
      activeSlot=nextSlot;
      window._fadeTimer=setTimeout(()=>{
        if(viewers[slotToClean]){try{viewers[slotToClean].destroy();}catch(e){}viewers[slotToClean]=null;}
        document.getElementById(slotToClean===0?'pano-a':'pano-b').innerHTML='';
        window._fadeTimer=null;
      },600);
    }
    // Preload
    [-1,1,2].forEach(d=>{
      const sc=zone.scenes[idx+d];
      if(sc&&!preloaded.has(sc.file)){preloaded.add(sc.file);new Image().src=sc.file;}
    });
  });
}

/* ══════════════════════════════════════════════
   CARDBOARD MODE
   ══════════════════════════════════════════════ */

// IPD offset en degrés (63mm équivalent en FOV à ~2.5°)
const IPD_YAW_DEG = 2.5;

let cbCurrentYaw=0, cbCurrentPitch=0;
let cbViewerLeft=null, cbViewerRight=null;
let cbViewerLeftB=null, cbViewerRightB=null;
let cbActiveLeft=0, cbActiveRight=0; // 0=A, 1=B

function enterCardboard(){
  cbMode=true;

  // Plein écran
  const el=document.documentElement;
  const req=el.requestFullscreen||el.webkitRequestFullscreen||el.mozRequestFullScreen||el.msRequestFullscreen;
  if(req) req.call(el).catch(()=>{});
  // Landscape
  if(screen.orientation&&screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});

  document.getElementById('normal-view').style.display='none';
  document.getElementById('cardboard-view').style.display='flex';
  document.getElementById('cb-btn').style.display='none';
  document.getElementById('ipd-pill').style.display='block';
  document.getElementById('atmo').style.display='none';

  // Bouton exit au centre après 2s
  setTimeout(()=>{
    const ex=document.getElementById('cb-exit');
    ex.style.display='block';
    // Disparait après 4s
    setTimeout(()=>ex.style.opacity='0',4000);
    setTimeout(()=>{ex.style.display='none';ex.style.opacity='1';},4500);
  },2000);

  // Activer le gyroscope
  startGyro();

  // Charger la scène courante en cardboard
  loadCardboardScene(curZone,curScene,true);
}

function exitCardboard(){
  cbMode=false;
  stopGyro();

  // Détruire les viewers cardboard
  [cbViewerLeft,cbViewerRight,cbViewerLeftB,cbViewerRightB].forEach(v=>{
    if(v){try{v.destroy();}catch(e){}}
  });
  cbViewerLeft=cbViewerRight=cbViewerLeftB=cbViewerRightB=null;

  ['pano-left-a','pano-left-b','pano-right-a','pano-right-b'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.innerHTML='';
  });

  document.getElementById('cardboard-view').style.display='none';
  document.getElementById('normal-view').style.display='block';
  document.getElementById('cb-btn').style.display='flex';
  document.getElementById('ipd-pill').style.display='none';
  document.getElementById('atmo').style.display='block';
  document.getElementById('cb-exit').style.display='none';

  if(document.fullscreenElement&&document.exitFullscreen) document.exitFullscreen().catch(()=>{});

  // Recharger la scène courante en mode normal
  load(curZone,curScene,true);
}

document.addEventListener('fullscreenchange',()=>{
  if(!document.fullscreenElement&&cbMode) exitCardboard();
});

/* Crée un viewer Pannellum cardboard dans le slot donné */
function makeCBViewer(containerId, yawOffset, panoFile, initYaw, initPitch, phs){
  const el=document.getElementById(containerId);
  if(!el) return null;
  el.innerHTML='';
  try{
    return pannellum.viewer(containerId,{
      type:'equirectangular',
      panorama: panoFile,
      autoLoad: true,
      autoRotate: 0,
      hfov: 90,          // FOV réduit pour cardboard
      minHfov: 50,
      maxHfov: 100,
      pitch: initPitch,
      yaw: initYaw + yawOffset,
      hotSpots: containerId.includes('left') ? phs : [],  // hotspots seulement à gauche
      orientationOnByDefault: true,
      showControls: false,  // pas de contrôles visuels
      mouseZoom: false,
    });
  }catch(e){console.error('CB viewer error:',e);return null;}
}

function loadCardboardScene(zid,sid,instant){
  const zone=zones[zid];
  const scene=zone?.scenes.find(s=>s.id===sid);
  if(!zone||!scene) return;

  const phs=buildHotspots(zid,sid,goTo);
  const fst=phs[0];
  const sy=fst?.yaw??cbCurrentYaw??0;
  const sp=fst?Math.min((fst.pitch||0)+20,5):(cbCurrentPitch??0);

  cbCurrentYaw=sy;
  cbCurrentPitch=sp;

  // Détruire les anciens
  [cbViewerLeft,cbViewerRight,cbViewerLeftB,cbViewerRightB].forEach(v=>{
    if(v){try{v.destroy();}catch(e){}}
  });
  ['pano-left-a','pano-left-b','pano-right-a','pano-right-b'].forEach(id=>{
    const el=document.getElementById(id);
    if(el){el.innerHTML='';el.style.opacity='0';}
  });

  // Créer les viewers gauche et droit
  cbViewerLeft  = makeCBViewer('pano-left-a',  -IPD_YAW_DEG, scene.file, sy, sp, phs);
  cbViewerRight = makeCBViewer('pano-right-a',  IPD_YAW_DEG, scene.file, sy, sp, []);

  document.getElementById('pano-left-a').style.opacity='1';
  document.getElementById('pano-right-a').style.opacity='1';

  // Synchroniser le regard quand les deux sont chargés
  let leftLoaded=false, rightLoaded=false;
  function trySync(){
    if(!leftLoaded||!rightLoaded) return;
    startGazeSync();
  }
  if(cbViewerLeft)  cbViewerLeft.on('load',()=>{leftLoaded=true;trySync();});
  if(cbViewerRight) cbViewerRight.on('load',()=>{rightLoaded=true;trySync();});
}

/* ══════════════════════════════════════════════
   GAZE SYNC — synchronise yaw/pitch entre les 2 viewers
   ══════════════════════════════════════════════ */
let syncRAF=null;
function startGazeSync(){
  if(syncRAF) cancelAnimationFrame(syncRAF);
  function sync(){
    if(!cbMode||!cbViewerLeft||!cbViewerRight){
      syncRAF=null; return;
    }
    try{
      const pitch=cbViewerLeft.getPitch();
      const yaw=cbViewerLeft.getYaw();
      // Appliquer au viewer droit avec offset IPD
      cbViewerRight.setPitch(pitch);
      cbViewerRight.setYaw(yaw+IPD_YAW_DEG*2);
      cbCurrentYaw=yaw;
      cbCurrentPitch=pitch;
    }catch(e){}
    syncRAF=requestAnimationFrame(sync);
  }
  syncRAF=requestAnimationFrame(sync);
}

/* ══════════════════════════════════════════════
   GYROSCOPE (DeviceOrientation)
   ══════════════════════════════════════════════ */
function startGyro(){
  if(typeof DeviceOrientationEvent==='undefined') return;

  function onOrientation(e){
    if(e.alpha==null) return;
    // Cliquer le bouton orientation de Pannellum si dispo
    const ob=document.querySelector('.pnlm-orientation-button');
    if(ob&&!ob._clicked){ob.click();ob._clicked=true;}
  }

  // Demander permission iOS 13+
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission()
      .then(r=>{ if(r==='granted') window.addEventListener('deviceorientation',onOrientation); })
      .catch(()=>{});
  } else {
    window.addEventListener('deviceorientation',onOrientation);
  }
}

function stopGyro(){
  // Les viewers Pannellum gèrent leur propre deviceorientation
  if(syncRAF){cancelAnimationFrame(syncRAF);syncRAF=null;}
}

/* ══════════════════════════════════════════════
   ATMO (normal mode)
   ══════════════════════════════════════════════ */
</script>
