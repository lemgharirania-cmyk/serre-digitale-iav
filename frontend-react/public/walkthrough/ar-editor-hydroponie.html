<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>AR Editor — Hydroponie</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g50:#edf7f0;--g100:#c6e9d0;--g300:#6dbc85;--g500:#2d8e50;--g700:#1a5c33;
  --n50:#f8faf9;--n100:#eef1ee;--n200:#d8ddd8;--n400:#9aa09a;--n500:#6b736b;--n800:#2a2e2a;
  --white:#fff;
}
body{font-family:'DM Sans',sans-serif;background:var(--n50);color:var(--n800);
  height:100vh;overflow:hidden;display:grid;grid-template-rows:50px 1fr;grid-template-columns:1fr 280px}

/* TOPBAR */
.topbar{grid-column:1/-1;background:var(--white);border-bottom:1px solid var(--n200);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px;
  box-shadow:0 1px 4px rgba(0,0,0,.06)}
.logo{font-size:14px;font-weight:600;color:var(--n800)}
.logo span{color:var(--g500)}
.status{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--n500)}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--n200)}
.sdot.ready{background:var(--g300)}.sdot.loading{background:#f0a030;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.tbtn{padding:6px 13px;border-radius:7px;font-size:12px;font-weight:500;border:none;
  cursor:pointer;font-family:'DM Sans',sans-serif;transition:.13s}
.tbtn.ghost{background:var(--n100);color:var(--n800);border:1px solid var(--n200)}.tbtn.ghost:hover{background:var(--n200)}
.tbtn.green{background:var(--g500);color:white}.tbtn.green:hover{background:var(--g700)}
.tbtn.green.ok{background:#16a34a}

/* SCENE NAV */
.scene-nav{display:flex;align-items:center;gap:6px;background:var(--n100);border-radius:8px;padding:3px 6px}
.snav{width:26px;height:26px;border-radius:5px;background:transparent;border:none;
  color:var(--n800);cursor:pointer;font-size:16px;font-weight:600;
  display:flex;align-items:center;justify-content:center;transition:.12s}
.snav:hover{background:var(--white)}
.snav:disabled{opacity:.3;pointer-events:none}
.scene-info{text-align:center;min-width:100px}
.scene-num{font-size:12px;font-weight:600}
.scene-name{font-size:10px;color:var(--n500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100px}

/* VIEWER */
#pano{grid-row:2;grid-column:1;position:relative;cursor:crosshair}
#pano-inner{width:100%;height:100%}
.pnlm-about-msg,.pnlm-panorama-info,.pnlm-controls-container,
.pnlm-load-box,.pnlm-lbar,.pnlm-load-button,.pnlm-loading{display:none!important}
.pnlm-hotspot-base{background:transparent!important;border:none!important;width:auto!important;height:auto!important;overflow:visible!important}
.pnlm-hotspot-base .pnlm-sprite{display:none!important}

.coords-hud{position:absolute;bottom:12px;left:12px;z-index:50;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);
  border:1px solid var(--n200);border-radius:8px;padding:7px 13px;
  font-family:'DM Mono',monospace;font-size:12px;color:var(--g700);
  pointer-events:none;line-height:1.8}
.coords-hud .lbl{color:var(--n400);font-size:10px}

.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--g500);color:white;border-radius:999px;padding:6px 18px;
  font-size:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1}

.ring{position:absolute;width:22px;height:22px;border-radius:50%;
  border:2.5px solid var(--g500);background:rgba(45,142,80,.2);
  transform:translate(-50%,-50%);pointer-events:none;z-index:60;
  animation:ringPop .35s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes ringPop{from{transform:translate(-50%,-50%) scale(0);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}

/* AR dot preview in editor */
.hs-ar-preview{width:44px;height:44px;border-radius:12px;cursor:default;
  background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center}
.hs-ar-preview.plant{border:2px solid rgba(45,142,80,.6);box-shadow:0 0 0 5px rgba(45,142,80,.15)}
.hs-ar-preview.sensor{border:2px solid rgba(14,165,233,.6);box-shadow:0 0 0 5px rgba(14,165,233,.15)}
.hs-ar-preview.system{border:2px solid rgba(139,92,246,.6);box-shadow:0 0 0 5px rgba(139,92,246,.15)}

/* PANEL */
.panel{grid-row:2;grid-column:2;background:var(--white);border-left:1px solid var(--n200);
  display:flex;flex-direction:column;overflow:hidden}
.p-block{padding:12px 14px;border-bottom:1px solid var(--n100)}
.p-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--n400);margin-bottom:8px}

.mode-row{display:flex;flex-direction:column;gap:6px}
.ar-type-opt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;
  border:1.5px solid var(--n200);cursor:pointer;transition:.13s;font-size:12px;font-weight:500;color:var(--n500)}
.ar-type-opt:hover{border-color:var(--g300);background:var(--g50)}
.ar-type-opt.active{border-color:var(--g500);background:var(--g50);color:var(--g700)}
.ar-type-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

.click-status{margin-top:10px;padding:8px 10px;border-radius:7px;background:var(--n50);
  border:1px solid var(--n200);font-family:'DM Mono',monospace;font-size:11px;color:var(--n500);text-align:center}
.click-status.has{background:var(--g50);border-color:var(--g100);color:var(--g700)}

/* Hotspot list */
.list-hdr{padding:8px 14px 4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--n400)}
.hs-scroll{flex:1;overflow-y:auto;padding:4px 8px 8px}
.hs-scroll::-webkit-scrollbar{width:3px}.hs-scroll::-webkit-scrollbar-thumb{background:var(--n200);border-radius:99px}
.hs-row{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;
  border:1px solid var(--n100);background:var(--n50);margin-bottom:4px}
.hs-row:hover{border-color:var(--n200);background:var(--white)}
.hs-badge{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.hs-badge.plant{background:#16a34a}.hs-badge.sensor{background:#0ea5e9}.hs-badge.system{background:#7c3aed}
.hs-txt{flex:1;min-width:0}
.hs-mono{font-family:'DM Mono',monospace;font-size:11px;color:var(--g700);font-weight:500}
.hs-sub{font-size:10px;color:var(--n500);margin-top:1px}
.hs-del{width:20px;height:20px;border-radius:4px;background:transparent;border:none;
  color:var(--n300);cursor:pointer;font-size:12px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;transition:.13s}
.hs-del:hover{background:#fef2f2;color:#dc2626}
.empty{text-align:center;padding:24px 12px;color:var(--n400);font-size:12px;line-height:1.7}

.export-wrap{padding:10px 14px;border-top:1px solid var(--n100)}
</style>
</head>
<body>

<div class="topbar">
  <div style="display:flex;align-items:center;gap:14px">
    <div class="logo">Agro<span>Bio</span>Tech <span style="color:var(--n400);font-weight:400;font-size:11px">/ AR Editor — Hydroponie</span></div>
    <div class="scene-nav">
      <button class="snav" id="btn-prev" onclick="changeScene(-1)">‹</button>
      <div class="scene-info">
        <div class="scene-num" id="scene-num">1 / —</div>
        <div class="scene-name" id="scene-name">—</div>
      </div>
      <button class="snav" id="btn-next" onclick="changeScene(1)">›</button>
    </div>
    <div class="status"><div class="sdot loading" id="sdot"></div><span id="stxt">Chargement…</span></div>
  </div>
  <div style="display:flex;gap:8px">
    <button class="tbtn ghost" onclick="clearScene()">🗑 Vider scène</button>
    <button class="tbtn green" id="save-btn" onclick="saveAll()">💾 Sauvegarder</button>
  </div>
</div>

<div id="pano">
  <div id="pano-inner"></div>
  <div class="coords-hud"><span class="lbl">pitch</span> <b id="lp">—</b> &nbsp;<span class="lbl">yaw</span> <b id="ly">—</b></div>
  <div class="toast" id="toast"></div>
</div>

<div class="panel">
  <div class="p-block">
    <div class="p-label">Type AR à placer</div>
    <div class="mode-row" id="type-list"></div>
    <div class="click-status" id="click-status">Cliquez sur la scène pour placer</div>
  </div>
  <div class="list-hdr">Hotspots AR — scène <span id="hs-snum">1</span></div>
  <div class="hs-scroll" id="hs-list"><div class="empty">Aucun hotspot AR<br>sur cette scène</div></div>
  <div class="export-wrap">
    <button class="tbtn green" style="width:100%;padding:9px;font-size:13px" onclick="saveAll()">💾 Sauvegarder tout</button>
  </div>
</div>

<script>
const ZONE = 'hydroponie';
const STORAGE_KEY = 'ar_positions_hydro';

const AR_TYPES = [
  { key:'strawberry', label:'Fraisier Hydro',   type:'plant',  icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22V12"/><path d="M12 12C12 12 8 9 8 5a4 4 0 0 1 8 0c0 4-4 7-4 7z"/></svg>', bg:'#dcfce7' },
  { key:'sensor_env', label:'Capteur ENV',       type:'sensor', icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>', bg:'#dbeafe' },
  { key:'sensor_irr', label:'Sonde IRR (pH/EC)', type:'sensor', icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>', bg:'#ede9fe' },
  { key:'nft_system', label:'Système NFT',       type:'system', icon:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#d97706" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l3-9 4 18 3-9h6"/></svg>', bg:'#fef3c7' },
];

let manifest, zones={};
let scenes=[]; // hydroponie scenes
let currentIdx=0;
let viewer=null, ready=false;
let selectedType = AR_TYPES[0].key;
let arPositions = JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}');
let lastPitch=0, lastYaw=0;

window.addEventListener('load', async()=>{
  // Build type selector
  const list = document.getElementById('type-list');
  AR_TYPES.forEach(t=>{
    const el=document.createElement('div');
    el.className='ar-type-opt'+(t.key===selectedType?' active':'');
    el.dataset.key=t.key;
    el.innerHTML=`<div class="ar-type-icon" style="background:${t.bg}">${t.icon}</div><span>${t.label}</span>`;
    el.onclick=()=>{
      selectedType=t.key;
      document.querySelectorAll('.ar-type-opt').forEach(e=>e.classList.remove('active'));
      el.classList.add('active');
    };
    list.appendChild(el);
  });

  const r = await fetch('images/manifest.json');
  manifest = await r.json();
  manifest.zones.forEach(z=>zones[z.id]=z);
  scenes = zones[ZONE]?.scenes||[];
  loadScene(0);

  document.addEventListener('keydown',e=>{
    if(['SELECT','INPUT'].includes(e.target.tagName)) return;
    if(e.code==='ArrowRight'||e.code==='Space'){e.preventDefault();changeScene(1);}
    if(e.code==='ArrowLeft'){e.preventDefault();changeScene(-1);}
    if(e.code==='KeyZ') undoLast();
  });
});

function loadScene(idx){
  currentIdx=idx; ready=false;
  const sc=scenes[idx];
  document.getElementById('scene-num').textContent=`${idx+1} / ${scenes.length}`;
  document.getElementById('scene-name').textContent=sc.id;
  document.getElementById('hs-snum').textContent=idx+1;
  document.getElementById('btn-prev').disabled=idx===0;
  document.getElementById('btn-next').disabled=idx===scenes.length-1;
  document.getElementById('click-status').textContent='Cliquez sur la scène pour placer';
  document.getElementById('click-status').classList.remove('has');
  setStatus('loading','Chargement…');
  renderList(); reloadViewer();
}

function reloadViewer(){
  if(viewer){viewer.destroy();viewer=null;}
  const sc=scenes[currentIdx];
  const phs=buildVisuHS();
  viewer=pannellum.viewer('pano-inner',{
    type:'equirectangular',panorama:sc.file,
    autoLoad:true,autoRotate:0,hfov:100,pitch:-10,yaw:0,
    minHfov:50,maxHfov:130,compass:false,showControls:true,showFullscreenCtrl:false,
    hotSpots:phs
  });
  viewer.on('load',()=>{
    ready=true;
    setStatus('ready',`Scène ${currentIdx+1} — ${scenes[currentIdx].id}`);
    const el=document.getElementById('pano-inner');
    el.onmousemove=e=>{
      if(!ready||!viewer) return;
      try{const c=viewer.mouseEventToCoords(e);if(c){document.getElementById('lp').textContent=c[0].toFixed(1);document.getElementById('ly').textContent=c[1].toFixed(1);}}catch(_){}
    };
    el.onclick=e=>{
      if(!ready||!viewer||e.target.closest('.pnlm-hotspot-base')) return;
      try{
        const c=viewer.mouseEventToCoords(e);
        if(!c) return;
        lastPitch=parseFloat(c[0].toFixed(1));
        lastYaw=parseFloat(c[1].toFixed(1));
        placeHotspot(lastPitch,lastYaw,e.clientX,e.clientY);
      }catch(_){}
    };
  });
}

function buildVisuHS(){
  const sid=scenes[currentIdx]?.id;
  const arr=arPositions[sid]||[];
  return arr.map(hs=>{
    const t=AR_TYPES.find(a=>a.key===hs.arKey);
    const cls=`hs-ar-preview ${t?.type||'plant'}`;
    return {
      pitch:hs.pitch,yaw:hs.yaw,type:'custom',cssClass:cls,
      createTooltipFunc:function(div){div.innerHTML=t?.icon||'';},
      createTooltipArgs:{},clickHandlerFunc:function(){}
    };
  });
}

function placeHotspot(pitch,yaw,cx,cy){
  const sid=scenes[currentIdx]?.id; if(!sid) return;
  if(!arPositions[sid]) arPositions[sid]=[];
  const existing=arPositions[sid].findIndex(p=>p.arKey===selectedType);
  const entry={arKey:selectedType,pitch,yaw};
  if(existing>=0) arPositions[sid][existing]=entry;
  else arPositions[sid].push(entry);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(arPositions));
  showRing(cx,cy);
  showToast(`✓ ${AR_TYPES.find(t=>t.key===selectedType)?.label} placé`);
  document.getElementById('click-status').textContent=`pitch ${pitch}  ·  yaw ${yaw}`;
  document.getElementById('click-status').classList.add('has');
  renderList(); reloadViewer();
}

function undoLast(){
  const sid=scenes[currentIdx]?.id;
  const arr=arPositions[sid];
  if(!arr?.length) return;
  arr.pop();
  localStorage.setItem(STORAGE_KEY,JSON.stringify(arPositions));
  showToast('↩ Annulé'); renderList(); reloadViewer();
}

function deleteHS(idx){
  const sid=scenes[currentIdx]?.id;
  arPositions[sid]?.splice(idx,1);
  localStorage.setItem(STORAGE_KEY,JSON.stringify(arPositions));
  renderList(); reloadViewer();
}

function clearScene(){
  const sid=scenes[currentIdx]?.id;
  if(!arPositions[sid]?.length) return;
  arPositions[sid]=[];
  localStorage.setItem(STORAGE_KEY,JSON.stringify(arPositions));
  showToast('🗑 Scène vidée'); renderList(); reloadViewer();
}

function renderList(){
  const sid=scenes[currentIdx]?.id;
  const arr=arPositions[sid]||[];
  const el=document.getElementById('hs-list');
  if(!arr.length){el.innerHTML='<div class="empty">Aucun hotspot AR<br>sur cette scène</div>';return;}
  el.innerHTML=arr.map((hs,i)=>{
    const t=AR_TYPES.find(a=>a.key===hs.arKey);
    return `<div class="hs-row">
      <div class="hs-badge ${t?.type||'plant'}"></div>
      <div class="hs-txt">
        <div class="hs-mono">p ${hs.pitch} · y ${hs.yaw}</div>
        <div class="hs-sub">${t?.label||hs.arKey}</div>
      </div>
      <button class="hs-del" onclick="deleteHS(${i})">✕</button>
    </div>`;
  }).join('');
}

function saveAll(){
  localStorage.setItem(STORAGE_KEY,JSON.stringify(arPositions));
  const btn=document.getElementById('save-btn');
  btn.textContent='✓ Sauvegardé!'; btn.classList.add('ok');
  setTimeout(()=>{btn.textContent='💾 Sauvegarder';btn.classList.remove('ok');},2000);
  showToast('💾 Sauvegardé dans localStorage');
}

function changeScene(d){const n=currentIdx+d;if(n>=0&&n<scenes.length)loadScene(n);}

function showRing(x,y){
  const pano=document.getElementById('pano');
  const rect=pano.getBoundingClientRect();
  const r=document.createElement('div');r.className='ring';
  r.style.left=(x-rect.left)+'px';r.style.top=(y-rect.top)+'px';
  pano.appendChild(r);setTimeout(()=>r.remove(),500);
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1600);
}
function setStatus(s,txt){
  document.getElementById('sdot').className='sdot '+s;
  document.getElementById('stxt').textContent=txt;
}
</script>
</body>
</html>
