<!DOCTYPE html>



<html lang="fr">



<head>



<meta charset="UTF-8">



<meta name="viewport" content="width=device-width, initial-scale=1.0">



<title>AgroBioTech — Visite Virtuelle</title>



<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>



<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>



<link rel="preconnect" href="https://fonts.googleapis.com">



<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&family=Noto+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">



<style>



*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}



html,body{width:100%;height:100%;overflow:hidden;font-family:'DM Sans','Inter',system-ui,sans-serif;background:#000}



#pano-a,#pano-b{position:fixed;inset:0;width:100%;height:100%}



#pano-a{opacity:1}



#pano-b{opacity:0;pointer-events:none}



.pnlm-about-msg,.pnlm-panorama-info,.pnlm-controls-container,



.pnlm-load-box,.pnlm-lbar,.pnlm-lbar-fill,.pnlm-load-button,



.pnlm-loading,.pnlm-compass{display:none!important}



.pnlm-hotspot-base{background:transparent!important;border:none!important;



  width:auto!important;height:auto!important;overflow:visible!important}



.pnlm-hotspot-base .pnlm-sprite{display:none!important}



#atmo{position:fixed;inset:0;z-index:9;pointer-events:none;



  background:linear-gradient(to bottom,rgba(0,0,0,.08) 0%,transparent 30%,transparent 70%,rgba(0,0,0,.15) 100%)}



.hs-nav{width:58px;height:58px;border-radius:50%;cursor:pointer;



  background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.38);



  box-shadow:0 2px 20px rgba(0,0,0,.22),0 0 0 6px rgba(255,255,255,.05);



  display:flex;align-items:center;justify-content:center;



  animation:nav-breathe 3.5s ease-in-out infinite;



  transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s}



.hs-cross{width:58px;height:58px;border-radius:50%;cursor:pointer;



  background:rgba(147,197,253,.13);border:1px solid rgba(147,197,253,.4);



  box-shadow:0 2px 20px rgba(30,80,200,.18),0 0 0 6px rgba(147,197,253,.06);



  display:flex;align-items:center;justify-content:center;



  animation:nav-breathe 3.5s ease-in-out infinite;



  transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s}



.hs-nav:hover{transform:scale(1.12);background:rgba(255,255,255,.22)}



.hs-cross:hover{transform:scale(1.12);background:rgba(147,197,253,.24)}



@keyframes nav-breathe{



  0%,100%{box-shadow:0 2px 20px rgba(0,0,0,.22),0 0 0 6px rgba(255,255,255,.05)}



  50%{box-shadow:0 2px 20px rgba(0,0,0,.22),0 0 0 14px rgba(255,255,255,.0)}}



.hs-ar-base{background:transparent!important;border:none!important;width:auto!important;height:auto!important;overflow:visible!important}



.arrow{position:fixed;top:50%;z-index:201;transform:translateY(-50%);



  width:40px;height:40px;border-radius:50%;



  background:rgba(255,255,255,.1);backdrop-filter:blur(8px);



  border:1px solid rgba(255,255,255,.2);



  cursor:pointer;color:rgba(255,255,255,.7);font-size:18px;



  display:flex;align-items:center;justify-content:center;transition:all .2s}



.arrow:hover{background:rgba(255,255,255,.2);color:white;border-color:rgba(255,255,255,.4)}



.arrow.L{left:16px}.arrow.R{right:16px}



.arrow.off{opacity:0;pointer-events:none}



.zf{position:fixed;bottom:90px;right:28px;z-index:200;



  background:rgba(15,15,15,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);



  border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:10px 18px;



  box-shadow:0 8px 32px rgba(0,0,0,.25);opacity:0;pointer-events:none;



  transform:translateY(8px);transition:opacity .3s ease,transform .3s ease}



.zf.show{opacity:1;transform:translateY(0)}



.zf-label{font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;



  color:rgba(255,255,255,.35);margin-bottom:3px}



.zf-name{font-size:13px;font-weight:600;color:rgba(255,255,255,.92);letter-spacing:.01em}



.zf-unit{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;font-weight:300}



.scene-ctr{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:200;



  background:rgba(255,255,255,.1);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);



  border:1px solid rgba(255,255,255,.18);border-radius:999px;



  padding:5px 14px;font-size:11px;font-weight:500;color:rgba(255,255,255,.55);



  letter-spacing:.04em;opacity:0;transition:opacity .4s}



.scene-ctr.show{opacity:1}



#flash{position:fixed;inset:0;z-index:300;pointer-events:none;



  background:rgba(255,255,255,0);transition:background .08s ease}



#flash.on{background:rgba(255,255,255,.04)}



/* IoT HUD */



.iot-hud{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:150;display:flex;align-items:flex-end;gap:6px;pointer-events:none;display:none}



.iot-hud.visible{display:flex}
:fullscreen #iot-hud,
:-webkit-full-screen #iot-hud,
:-moz-full-screen #iot-hud {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  pointer-events: none;
  opacity: 1 !important;
  display: flex !important;
}




.iot-group{display:flex;align-items:stretch;gap:5px;padding:6px 7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:22px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);box-shadow:0 2px 16px rgba(0,0,0,.12)}



.iot-divider{width:1px;align-self:stretch;margin:4px 3px;flex-shrink:0;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.2) 30%,rgba(255,255,255,.2) 70%,transparent)}



.iot-pill{position:relative;width:70px;padding:11px 6px 10px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:default;pointer-events:all;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(16px) saturate(130%);-webkit-backdrop-filter:blur(16px) saturate(130%);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 3px 14px rgba(0,0,0,.14);transition:transform .28s cubic-bezier(.34,1.35,.64,1),background .28s;overflow:visible}



.iot-pill.env::after{content:'';position:absolute;top:0;left:18%;right:18%;height:1px;border-radius:1px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(120,200,155,.55),transparent)}



.iot-pill.irr::after{content:'';position:absolute;top:0;left:18%;right:18%;height:1px;border-radius:1px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(100,175,225,.55),transparent)}



.iot-pill:hover{transform:scale(1.12) translateY(-4px);background:rgba(255,255,255,.19)}



.iot-icon{width:17px;height:17px;flex-shrink:0;opacity:.7}



.iot-pill.env .iot-icon{color:rgba(140,215,170,1)}



.iot-pill.irr .iot-icon{color:rgba(120,195,235,1)}



.iot-val{font-size:16px;font-weight:500;line-height:1;color:rgba(255,255,255,.88);letter-spacing:-.3px}



.iot-unit{font-size:8px;font-weight:400;color:rgba(255,255,255,.42);letter-spacing:.8px;text-transform:uppercase}



.iot-tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(5px);background:rgba(255,255,255,.14);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.24);color:rgba(255,255,255,.86);font-size:10px;white-space:nowrap;padding:5px 11px;border-radius:9px;pointer-events:none;opacity:0;z-index:10;transition:opacity .18s ease,transform .18s ease}



.iot-pill:hover .iot-tip{opacity:1;transform:translateX(-50%) translateY(0)}



.iot-pip{position:absolute;top:7px;right:7px;width:5px;height:5px;border-radius:50%;background:rgba(140,230,170,.9);box-shadow:0 0 5px rgba(140,230,170,.45);animation:pip-pulse 2.8s ease-in-out infinite}



@keyframes pip-pulse{0%,100%{opacity:.88;transform:scale(1)}50%{opacity:.22;transform:scale(.72)}}



/* AR Card */



.ar-overlay{position:fixed;inset:0;z-index:400;pointer-events:none;display:flex;align-items:center;justify-content:flex-end;padding:20px}



.ar-card{width:320px;max-height:calc(100vh - 48px);background:rgba(255,255,255,.82);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid rgba(255,255,255,.9);border-radius:24px;box-shadow:0 8px 40px rgba(0,20,60,.13),0 1px 0 rgba(255,255,255,.95) inset;display:flex;flex-direction:column;overflow:hidden;pointer-events:all;transform:translateX(360px) scale(.96);opacity:0;transition:transform .38s cubic-bezier(.34,1.08,.64,1),opacity .28s ease}



.ar-card.open{transform:translateX(0) scale(1);opacity:1}



.ar-hero{position:relative;height:130px;flex-shrink:0;overflow:hidden;display:flex;align-items:flex-end;padding-bottom:18px}



.ar-hero-bg{position:absolute;inset:0;opacity:.7}



.ar-hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:50px;background:linear-gradient(to bottom,transparent,rgba(0,0,0,.12));pointer-events:none}



.ar-hero-anim{position:absolute;inset:0;overflow:hidden;pointer-events:none}



.ar-hero-content{position:relative;z-index:1;display:flex;align-items:flex-end;gap:12px;padding:0 16px;width:100%}



.ar-hero-icon{width:44px;height:44px;border-radius:13px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.45);box-shadow:0 2px 8px rgba(0,0,0,.12),0 1px 0 rgba(255,255,255,.8) inset;margin-bottom:2px}



.ar-hero-text{flex:1;min-width:0}



.ar-hero-label{font-size:8.5px;font-weight:500;text-transform:uppercase;letter-spacing:1.1px;color:rgba(255,255,255,.55);margin-bottom:3px}



.ar-hero-text h3{font-size:16px;font-weight:700;color:#fff;line-height:1.15;margin:0 0 8px;text-shadow:0 1px 8px rgba(0,0,0,.22)}



.ar-state-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:99px;font-size:11.5px;font-weight:700;letter-spacing:.3px;border:1.5px solid rgba(255,255,255,.4);backdrop-filter:blur(8px);box-shadow:0 2px 8px rgba(0,0,0,.15)}



.ar-state-pill.on{background:rgba(34,197,94,.28);color:#fff}



.ar-state-pill.off{background:rgba(0,0,0,.22);color:rgba(255,255,255,.8)}



.ar-state-pill.unknown{background:rgba(255,255,255,.15);color:rgba(255,255,255,.6)}



.ar-state-pill-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}



.ar-state-pill.on .ar-state-pill-dot{background:#4ade80;box-shadow:0 0 6px #4ade80}



.ar-state-pill.off .ar-state-pill-dot{background:#f87171;box-shadow:0 0 6px #f87171}



.ar-state-pill.unknown .ar-state-pill-dot{background:rgba(255,255,255,.4)}



.ar-close{position:absolute;top:10px;right:10px;z-index:10;width:26px;height:26px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.15);cursor:pointer;color:rgba(255,255,255,.85);font-size:11px;display:flex;align-items:center;justify-content:center;transition:background .15s}



.ar-close:hover{background:rgba(0,0,0,.3)}



.ar-reason-strip{flex-shrink:0;padding:10px 16px;background:rgba(0,0,0,.025);border-bottom:1px solid rgba(0,0,0,.055)}



.ar-reason-text{font-size:11px;color:rgba(0,0,0,.45);line-height:1.45;font-style:italic}



.ar-content{flex:1;overflow-y:auto;padding:16px 16px 20px;scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.07) transparent}



.ar-content::-webkit-scrollbar{width:3px}



.ar-content::-webkit-scrollbar-thumb{background:rgba(0,0,0,.1);border-radius:99px}



.ar-section-title{font-family:'DM Mono',monospace;font-size:8px;font-weight:600;text-transform:uppercase;letter-spacing:1.1px;color:var(--accent,#059669);margin:18px 0 8px;opacity:.75}



.ar-section-title:first-child{margin-top:0}



.ar-sensor-row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(0,0,0,.045)}



.ar-sensor-row:last-child{border-bottom:none}



.ar-sensor-label{font-size:11.5px;color:rgba(0,0,0,.42);flex:1}



.ar-sensor-val{font-family:'DM Mono',monospace;font-size:14px;font-weight:600;color:rgba(0,0,0,.78);min-width:52px;text-align:right}



.ar-sensor-unit{font-size:10px;color:rgba(0,0,0,.3);min-width:30px}



.ar-sensor-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}



.ar-sensor-dot.ok{background:#22c55e}.ar-sensor-dot.warn{background:#f59e0b}.ar-sensor-dot.na{background:rgba(0,0,0,.15)}



.ar-info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(0,0,0,.04)}



.ar-info-row:last-child{border-bottom:none}



.ar-info-label{font-size:12px;color:rgba(0,0,0,.4)}



.ar-info-value{font-size:12px;color:rgba(0,0,0,.75);font-weight:500;text-align:right}



.ar-badge{display:inline-block;padding:2px 9px;border-radius:7px;font-size:10.5px;font-weight:600;border:1px solid transparent}



.ar-bullets{display:flex;flex-direction:column;gap:7px;margin-top:2px}



.ar-bullet{display:flex;align-items:flex-start;gap:8px;font-size:13px;color:rgba(0,0,0,.52);line-height:1.6}



.ar-bullet-dot{width:4px;height:4px;border-radius:50%;margin-top:7px;flex-shrink:0;background:var(--accent,#059669);opacity:.65}



.ar-thresh-block{margin-bottom:4px}



.ar-thresh-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px}



.ar-thresh-label{font-size:11.5px;color:rgba(0,0,0,.42)}



.ar-thresh-val{font-family:'DM Mono',monospace;font-size:13px;font-weight:600;color:rgba(0,0,0,.75)}



.ar-thresh-unit{font-size:10px;color:rgba(0,0,0,.32)}



.ar-thresh-bar-wrap{height:5px;background:rgba(0,0,0,.07);border-radius:99px;overflow:hidden;margin-bottom:10px}



.ar-thresh-bar{height:100%;border-radius:99px;transition:width .5s ease;min-width:3px}



.ar-thresh-reason{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:8px;font-size:11px;font-style:italic;margin-top:2px}



.ar-thresh-reason.on{background:rgba(34,197,94,.07);border:1px solid rgba(34,197,94,.15);color:#15803d}



.ar-thresh-reason.off{background:rgba(0,0,0,.025);border:1px solid rgba(0,0,0,.07);color:rgba(0,0,0,.42)}



.ar-thresh-reason.unknown{background:rgba(0,0,0,.02);border:1px solid rgba(0,0,0,.05);color:rgba(0,0,0,.3)}



.ar-thresh-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}



.iot-loading{text-align:center;padding:22px;color:rgba(0,0,0,.28);font-size:11.5px}



.iot-refresh{font-family:'DM Mono',monospace;font-size:9px;color:rgba(0,0,0,.22);text-align:right;margin-top:8px;cursor:pointer;transition:color .15s}



.iot-refresh:hover{color:rgba(0,0,0,.5)}



.video-wrap{border-radius:10px;overflow:hidden;aspect-ratio:16/9;background:rgba(0,0,0,.04);margin-bottom:8px;border:1px solid rgba(0,0,0,.06)}



.video-wrap iframe{width:100%;height:100%;border:none}



.video-desc{font-size:11px;color:rgba(0,0,0,.38);line-height:1.55}



@keyframes ar-fade-up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}



.ar-stagger-1{animation:ar-fade-up .28s ease .04s both}



.ar-stagger-2{animation:ar-fade-up .28s ease .10s both}



.ar-stagger-3{animation:ar-fade-up .28s ease .16s both}



@keyframes hero-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}



@keyframes hero-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}



@keyframes hero-pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:.85;transform:scale(1.08)}}



@keyframes hero-bubble{0%{transform:translateY(30px);opacity:0}50%{opacity:.7}100%{transform:translateY(-10px);opacity:0}}



body.ar-hidden .hs-ar-base{visibility:hidden!important;pointer-events:none!important;opacity:0!important}



body.ar-hidden .ar-overlay{pointer-events:none!important}



body.ar-hidden .ar-card{transform:translateX(360px) scale(.96)!important;opacity:0!important;pointer-events:none!important;transition:none!important}







/* ── AR TOGGLE BUTTON ── */



#ar-toggle{



  position:fixed;bottom:28px;left:28px;z-index:500;



  background:rgba(255,255,255,.12);



  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);



  border:1px solid rgba(255,255,255,.22);



  border-radius:12px;padding:10px 16px;



  box-shadow:0 4px 24px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.18);



  cursor:pointer;display:flex;align-items:center;gap:8px;



  font-family:inherit;font-size:11px;font-weight:500;



  color:rgba(255,255,255,.7);letter-spacing:.04em;



  transition:background .2s,border-color .2s,color .2s}



#ar-toggle:hover{background:rgba(255,255,255,.18);color:white}



#ar-toggle.ar-on{border-color:rgba(140,255,190,.35);color:rgba(140,255,190,.9)}



#ar-toggle.ar-on:hover{background:rgba(140,255,190,.1)}



#ar-toggle-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;



  background:rgba(255,255,255,.3);transition:background .2s,box-shadow .2s}



#ar-toggle.ar-on #ar-toggle-dot{background:#4ade80;box-shadow:0 0 6px #4ade80}







/* ── VR button override ── */



.pnlm-vr-button {



  display: flex !important;



  position: fixed !important;



  bottom: 16px !important;



  right: 16px !important;



  z-index: 9999 !important;



  width: 44px !important;



  height: 44px !important;



  border-radius: 12px !important;



  background: rgba(139,92,246,0.85) !important;



  border: 1.5px solid rgba(139,92,246,0.5) !important;



  box-shadow: 0 0 20px rgba(139,92,246,0.5), 0 4px 12px rgba(0,0,0,0.3) !important;



  cursor: pointer !important;



  align-items: center !important;



  justify-content: center !important;



  transition: all 0.2s !important;



  backdrop-filter: blur(8px) !important;



}



.pnlm-vr-button:hover {



  background: rgba(139,92,246,1) !important;



  transform: scale(1.08) !important;



  box-shadow: 0 0 32px rgba(139,92,246,0.8), 0 4px 16px rgba(0,0,0,0.4) !important;



}







/* ════════════════════════════════════════



   VR ENTRY BUTTON — Quest-compatible



   ════════════════════════════════════════ */







#vr-enter-btn {



  position: fixed;



  bottom: 24px;



  right: 24px;



  z-index: 99999;







  /* Quest-friendly large tap target */



  min-width: 160px;



  height: 52px;



  padding: 0 22px;



  border-radius: 100px;







  /* Glassmorphism pill */



  background: rgba(255, 255, 255, 0.14);



  border: 1.5px solid rgba(255, 255, 255, 0.35);



  backdrop-filter: blur(20px) saturate(160%);



  -webkit-backdrop-filter: blur(20px) saturate(160%);



  box-shadow:



    0 0 0 1px rgba(255,255,255,0.08) inset,



    0 8px 32px rgba(0, 0, 0, 0.35),



    0 2px 8px rgba(0, 0, 0, 0.2);







  /* Text */



  display: flex;



  align-items: center;



  justify-content: center;



  gap: 9px;



  font-family: 'Outfit', 'Inter', system-ui, sans-serif;



  font-size: 13px;



  font-weight: 700;



  letter-spacing: 0.05em;



  color: rgba(255, 255, 255, 0.92);



  white-space: nowrap;



  cursor: pointer;







  /* Pulse animation to attract attention */



  animation: vrBtnPulse 3s ease-in-out infinite;



  transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);



}







#vr-enter-btn:hover,



#vr-enter-btn:focus {



  background: rgba(139, 92, 246, 0.55);



  border-color: rgba(139, 92, 246, 0.75);



  box-shadow:



    0 0 0 1px rgba(139,92,246,0.3) inset,



    0 0 24px rgba(139, 92, 246, 0.55),



    0 8px 32px rgba(0, 0, 0, 0.4);



  transform: translateY(-2px) scale(1.03);



  color: #fff;



}







#vr-enter-btn:active {



  transform: scale(0.97);



}







/* Quest device — larger button */



@media (hover: none) and (pointer: coarse) {



  #vr-enter-btn {



    min-width: 190px;



    height: 60px;



    font-size: 15px;



    bottom: 32px;



    right: 32px;



  }



}







@keyframes vrBtnPulse {



  0%, 100% { box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 8px 32px rgba(0,0,0,0.35), 0 0 0 0 rgba(139,92,246,0); }



  50%       { box-shadow: 0 0 0 1px rgba(255,255,255,0.08) inset, 0 8px 32px rgba(0,0,0,0.35), 0 0 0 8px rgba(139,92,246,0.12); }



}







/* ── VR MODE — body.vr-mode ── */



body.vr-mode #vr-enter-btn { display: none; }







/* Hide heavy UI in VR mode */



body.vr-mode #iot-hud,



body.vr-mode #minimap,



body.vr-mode #scene-title,



body.vr-mode #ar-popup,



body.vr-mode #info-panel,

// ── IoT functions ──



async function fetchAllIoT(){



  try{



    const d = await fetch(`${API}/api/iot/live`).then(r=>r.json());



    return d.serres||[];



  }catch(e){ return []; }



}







function setIoTZone(zoneId){



  const hud = document.getElementById('iot-hud');



  const code = IOT_ZONES[zoneId];



  if(!code){ iotData=null; updateIoTOverlay(); hud.classList.remove('visible'); return; }



  fetchAllIoT().then(serres=>{



    iotData = serres.find(s=>s.code===code)||null;



    if(iotData){ hud.classList.add('visible'); updateIoTOverlay(); updateHotspotDots(); }



    else { hud.classList.remove('visible'); }



  });



  fetchThresholds(code);



}







function updateIoTOverlay(){



  if(!iotData){ return; }



  const env=iotData.env||{}, irr=iotData.irr||{};



  const set=(id,val,dec=1)=>{ const el=document.getElementById(id); if(el) el.textContent=val!=null?Number(val).toFixed(dec):'—'; };



  set('iot-temp',env.temperature,1);



  set('iot-hum',env.humidite,1);



  set('iot-vpd',env.vpd,2);

  set('iot-lum',env.luminosite,0);

  set('iot-co2',env.co2,0);



  set('iot-ph',irr.ph,2);



  set('iot-ec',irr.ec,2);



  set('iot-twater',irr.temp_eau,1);



  set('iot-level',irr.niveau_eau,2);



}







async function fetchThresholds(serreId){



  if(!serreId) return;



  const idMap={S01:1,S02:2,S03:3,S04:4,S05:5};



  const n=idMap[serreId];



  if(!n) return;



  try{



    const r=await fetch(`${API}/api/dashboard/thresholds/${n}/public`);



    if(!r.ok) throw new Error(r.status);



    const data=await r.json();



    thresholds={};



    (data||[]).forEach(t=>{ if(t.actif!==false) thresholds[t.capteur]=t; });



    window._thresholds=thresholds;



  }catch(e){ console.warn('Thresholds: defaults',e.message); }



}







async function fetchOutsideTemp(){



  try{



    const r=await fetch('https://api.open-meteo.com/v1/forecast?latitude=34.0209&longitude=-6.8416&current_weather=true');



    const d=await r.json();



    outsideTemp=d?.current_weather?.temperature??null;



    window._outsideTemp=outsideTemp;



  }catch(e){ outsideTemp=null; }



}







function getThresh(key){



  const DEFAULTS={



    temperature:{valeur_min:18,valeur_max:28},



    humidite:{valeur_min:55,valeur_max:85},



    vpd:{valeur_min:0.4,valeur_max:1.2},



    ph:{valeur_min:5.5,valeur_max:6.5},



    ec:{valeur_min:1.0,valeur_max:2.2},



    niveau_eau:{valeur_min:0.3,valeur_max:1.5},



  };



  return thresholds[key]||DEFAULTS[key]||{valeur_min:null,valeur_max:null};



}







function hsGetState(key){



  const env=iotData?.env||{};



  const tT=getThresh('temperature');



  const hT=getThresh('humidite');



  const vT=getThresh('vpd');



  switch(key){



    case 'ventilation':



    case 'ventilation dehors':



      if(env.temperature==null) return null;



      return (env.temperature>tT.valeur_max-2||(env.humidite!=null&&env.humidite>hT.valeur_max))?'on':'off';



    case 'brumisateur':



      if(env.temperature==null) return null;



      return (env.temperature>tT.valeur_max||(env.humidite!=null&&env.humidite<hT.valeur_min))?'on':'off';



    case 'co2':



      if(env.vpd==null) return null;



      return env.vpd>vT.valeur_min?'on':'off';



    case 'système de refroidissement':



      if(env.temperature==null) return null;



      return env.temperature>tT.valeur_max?'on':'off';



    case 'fenetre auto':



      if(env.temperature==null||outsideTemp==null) return null;



      return (env.temperature>tT.valeur_max&&outsideTemp<env.temperature-2)?'on':'off';



    case 'rideaux auto':



      if(outsideTemp==null) return null;



      return (outsideTemp>10&&outsideTemp<32)?'on':'off';



    default: return null;



  }



}

function goTo(zid, sid){



  if(RESTRICT_ZONES&&!RESTRICT_ZONES.includes(zid)) return;



  if(curZone&&curScene) navHistory.push({zoneId:curZone,sceneId:curScene});



  if(navHistory.length>50) navHistory.shift();



  closeAR();



  setTimeout(()=>load(zid,sid),80);



}







function load(zid, sid, instant){



  const zone=zones[zid];



  const scene=zone?.scenes.find(s=>s.id===sid);



  if(!zone||!scene) return;



  curZone=zid; curScene=sid;



  const idx=zone.scenes.indexOf(scene);







  document.getElementById('prev').className='arrow L'+(idx===0?' off':'');



  document.getElementById('next').className='arrow R'+(idx===zone.scenes.length-1?' off':'');



  document.getElementById('scene-ctr').textContent=`${idx+1} / ${zone.scenes.length}`;







  if(zid!==lastZoneId){



    lastZoneId=zid;



    document.getElementById('zfn').textContent=zone.label;



    document.getElementById('zfu').textContent=zone.unit!=='—'?`Unité ${zone.unit}`:'';



    const zf=document.getElementById('zf');



    zf.classList.remove('show');



    requestAnimationFrame(()=>zf.classList.add('show'));



    clearTimeout(sceneT);



    sceneT=setTimeout(()=>zf.classList.remove('show'),3000);



    setIoTZone(zid);



  }







  // Build hotspots: nav (from manifest) + AR (from manifest)



  const shs=(hotspots[zid]?.[sid]||[]).slice();







  // Auto back nav



  const fwdNav=shs.find(h=>h.type==='nav'&&h.targetSceneId!==sid&&h.targetZoneId===zid);



  const hasAnyBack=shs.some(h=>zones[h.targetZoneId]?.scenes.findIndex(s=>s.id===h.targetSceneId)===idx-1);



  if(fwdNav&&idx>0&&!hasAnyBack){



    const by=((fwdNav.yaw+180)+360)%360;



    shs.push({type:'nav',pitch:fwdNav.pitch,yaw:by>180?by-360:by,



      targetZoneId:zid,targetSceneId:zone.scenes[idx-1].id,auto:true});



  }







  // Cross-zone back nav



  const prev=navHistory.length>0?navHistory[navHistory.length-1]:null;



  const hasAnyCross=shs.some(h=>h.type==='cross');



  const hasForward=shs.some(h=>!h.auto&&h.targetSceneId!==sid);



  if(prev&&!hasAnyCross&&!hasForward){



    const pz=zones[prev.zoneId];



    if(pz&&(!RESTRICT_ZONES||RESTRICT_ZONES.includes(prev.zoneId))){



      const refYaw=fwdNav?.yaw??(shs[0]?.yaw??0);



      const by=((refYaw+180)+360)%360;



      shs.push({type:'cross',pitch:fwdNav?.pitch??-20,yaw:by>180?by-360:by,



        targetZoneId:prev.zoneId,targetSceneId:prev.sceneId,auto:true});



    }



  }







  const fst=shs.find(h=>h.type==='nav'&&!h.auto)||shs[0];



  const sy=fst?.yaw??0, sp=fst?Math.min(fst.pitch+18,5):0;







  const phs=shs.map(hs=>{



    if(hs.type==='ar'){



      const desc=hs.arDesc||hs.label||'';



      const rawKey=desc.toLowerCase().trim();



      // Alias map — normalise all manifest variants to canonical HS_VISUALS/AR_CONTENT keys



      const _AL={



        // climate



        'ventilation':'ventilation','brumisateur':'brumisateur','co2':'co2',



        'sensors':'sensors','capteurs':'sensors',



        'fenetre auto':'fenetre auto','fenetre':'fenetre auto','fenetres':'fenetre auto',



        'rideaux auto':'rideaux auto','rideaux':'rideaux auto',



        'système de refroidissement':'système de refroidissement',



        'syst de refroidissement':'système de refroidissement',



        'syst de refroidissment':'système de refroidissement',



        'ventilation dehors':'ventilation dehors','ventilation ext':'ventilation dehors',



        'système de ventilation':'ventilation','systeme de ventilation':'ventilation',



        // water treatment



        'audoucisseur':'audoucisseur',



        // units



        'unité protection des plantes':'unité protection des plantes',



        // plants



        'fraise':'fraise','courgette':'courgette',



        'avocatier':'avocatier','avocat':'avocatier',



        'cactus malade':'cactus malade',



        'tomates malades':'tomates malades','tomate malades':'tomates malades','tomate malade':'tomates malades',



        'ble malade':'ble malade','blé malade':'ble malade','blé':'ble malade',



        'plante x':'plante x',



      };

      const vis=getHSVisual(key);



      const stateKey=hsGetState(key);



      return {



        pitch:hs.pitch, yaw:hs.yaw, type:'custom', cssClass:'hs-ar-base',



        createTooltipFunc:function(div){



          div.style.cssText='background:transparent;border:none;width:auto;height:auto';



          const inner=document.createElement('div');



          inner.style.cssText=vis.style+';position:relative';



          inner.innerHTML=vis.html;



          if(stateKey!==null){



            const dot=document.createElement('div');



            const dc=stateKey==='on'?'#22c55e':'#ef4444';



            const gc=stateKey==='on'?'rgba(34,197,94,.6)':'rgba(239,68,68,.5)';



            dot.setAttribute('data-state-dot',key);



            dot.style.cssText=['position:absolute','bottom:4px','right:4px','width:7px','height:7px','border-radius:50%',`background:${dc}`,'border:1.5px solid rgba(255,255,255,.85)',`box-shadow:0 0 5px ${gc}`,'animation:dot-pulse 2.4s ease-in-out infinite'].join(';');



            inner.appendChild(dot);



          }



          inner.addEventListener('mouseenter',()=>{ inner.style.transform='scale(1.12)'; });



          inner.addEventListener('mouseleave',()=>{ inner.style.transform=''; });



          div.appendChild(inner);



          div.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();});



          div.addEventListener('touchstart',e=>{e.stopPropagation();},{passive:false});



        },



        createTooltipArgs:{},



clickHandlerFunc:function(){
  openSimpleAR(key);
}


      };



    }



    const color=hs.type==='cross'?'rgba(200,225,255,.95)':'rgba(255,255,255,.95)';



    return {



      pitch:hs.pitch, yaw:hs.yaw, type:'custom',



      cssClass:hs.type==='cross'?'hs-cross':'hs-nav',



      createTooltipFunc:function(div){



        div.innerHTML=`<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/><\/svg>`;



      },



      createTooltipArgs:{},



      clickHandlerFunc:function(){ goTo(hs.targetZoneId,hs.targetSceneId); }



    };



  }).filter(Boolean);







  // Dual-buffer crossfade



  const nextSlot=instant?activeSlot:(activeSlot===0?1:0);



  const nextId=nextSlot===0?'pano-a':'pano-b';



  const curId=activeSlot===0?'pano-a':'pano-b';



  const nextEl=document.getElementById(nextId);



  const curEl=document.getElementById(curId);



  if(!nextEl||!curEl) return;







  if(window._fadeTimer){clearTimeout(window._fadeTimer);window._fadeTimer=null;}



  if(viewers[nextSlot]){try{viewers[nextSlot].destroy();}catch(e){}viewers[nextSlot]=null;}



  nextEl.innerHTML='';



  nextEl.style.transition='none';



  nextEl.style.opacity='0';



  nextEl.style.pointerEvents='none';







  if(!instant){

          vr: true, autoRotate:0,



    hfov:100, minHfov:50, maxHfov:130,

  viewers[nextSlot]=v;

    if(instant){



      nextEl.style.transition='none';



      nextEl.style.opacity='1';



      nextEl.style.pointerEvents='all';



      activeSlot=nextSlot;



    } else {



      requestAnimationFrame(()=>{



        nextEl.style.transition='opacity .5s cubic-bezier(.4,0,.2,1)';



        nextEl.style.opacity='1';



        nextEl.style.pointerEvents='all';



        curEl.style.transition='opacity .5s cubic-bezier(.4,0,.2,1)';



        curEl.style.opacity='0';



        curEl.style.pointerEvents='none';



      });



      const slotToClean=activeSlot;



      activeSlot=nextSlot;



      window._fadeTimer=setTimeout(()=>{



        if(viewers[slotToClean]){try{viewers[slotToClean].destroy();}catch(e){}viewers[slotToClean]=null;}



        document.getElementById(slotToClean===0?'pano-a':'pano-b').innerHTML='';



        window._fadeTimer=null;



      },600);



    }



  });



}







function stepScene(d){



  const zone=zones[curZone];



  const idx=zone?.scenes.findIndex(s=>s.id===curScene);



  const next=zone?.scenes[idx+d];



  if(next) goTo(curZone,next.id);



}

      config.autoLoad                 = config.autoLoad                 ?? true;



      config.touchPanSpeedCoeffFactor = config.touchPanSpeedCoeffFactor ?? 1;



      return _origViewer.call(this, container, config);



    };



  }







  /* ── VR entry on button click ── */



  function enterVRMode() {



    const btn = document.getElementById('vr-enter-btn');







    /* 1. Fullscreen */



    const el = document.documentElement;



    const fsReq = el.requestFullscreen



      || el.webkitRequestFullscreen



      || el.mozRequestFullScreen



      || el.msRequestFullscreen;







    if (fsReq) {



      fsReq.call(el).catch(err => {



        console.warn('[VR] Fullscreen failed:', err);



      });



    }







    /* 2. Screen orientation — landscape for Quest */



    if (screen.orientation && screen.orientation.lock) {



      screen.orientation.lock('landscape').catch(() => {});



    }







    /* 3. Enable Pannellum orientation if on mobile/Quest */



    if (isMobile) {



      /* Find all active Pannellum viewers and enable orientation */



      ['pano-a', 'pano-b'].forEach(id => {



        const el = document.getElementById(id);



        if (!el) return;



        const iframe = el.querySelector('iframe');



        /* Pannellum exposes orientation toggle via its container events */



      });



      /* Trigger Pannellum's built-in orientation button if present */



      const orientBtn = document.querySelector('.pnlm-orientation-button');



      if (orientBtn) orientBtn.click();



    }







    /* 4. Add vr-mode class — hides heavy UI, enlarges hotspots */



    document.body.classList.add('vr-mode');







    /* 5. Lock pointer / prevent scroll */



    document.body.style.overflow = 'hidden';







    /* 6. Show exit button after 3s */



    setTimeout(() => {



      if (!document.getElementById('vr-exit-btn')) {



        const exit = document.createElement('button');



        exit.id = 'vr-exit-btn';



        exit.innerHTML = '✕ Quitter VR';



        Object.assign(exit.style, {



          position: 'fixed', top: '16px', right: '16px', zIndex: '99999',



          padding: '8px 18px', borderRadius: '100px',



          background: 'rgba(0,0,0,0.45)', border: '1px solid rgba(255,255,255,0.2)',



          color: 'rgba(255,255,255,0.8)', fontSize: '12px', fontWeight: '600',



          cursor: 'pointer', backdropFilter: 'blur(12px)',



          fontFamily: "'Outfit','Inter',system-ui",



        });



        exit.onclick = exitVRMode;



        document.body.appendChild(exit);



      }



    }, 3000);



  }







  function exitVRMode() {



    document.body.classList.remove('vr-mode');



    document.body.style.overflow = '';



    const exit = document.getElementById('vr-exit-btn');



    if (exit) exit.remove();



    if (document.fullscreenElement && document.exitFullscreen) {



      document.exitFullscreen().catch(() => {});



    }



  }







  /* ── Exit VR on fullscreen change (user pressed Esc) ── */



  document.addEventListener('fullscreenchange', () => {



    if (!document.fullscreenElement) exitVRMode();



  });







  /* ── Wire the button ── */



  document.addEventListener('DOMContentLoaded', () => {



    const btn = document.getElementById('vr-enter-btn');



    if (btn) btn.addEventListener('click', enterVRMode);







    /* On Quest — add a subtle label below the button */



    if (isQuest) {



      const label = document.createElement('div');



      label.textContent = 'Optimisé Meta Quest';



      Object.assign(label.style, {



        position: 'fixed', bottom: '82px', right: '24px', zIndex: '99999',



        fontSize: '10px', fontWeight: '600', letterSpacing: '0.1em',



        textTransform: 'uppercase', color: 'rgba(255,255,255,0.45)',



        fontFamily: "'Outfit','Inter',system-ui",



        pointerEvents: 'none',



      });



      document.body.appendChild(label);



    }



  });







})();



</script>








<script>
(function () {
  var isQuest  = /Oculus|Quest/i.test(navigator.userAgent);
  var isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent) || isQuest;

  function enterVR() {
    /* fullscreen only */
    var el  = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen
           || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) req.call(el).catch(function(){});

    /* landscape on Quest */
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(function(){});
    }

    /* gyro if mobile/Quest — only clicks Pannellum's own button */
    if (isMobile) {
      var ob = document.querySelector('.pnlm-orientation-button');
      if (ob) ob.click();
    }

    /* hide VR button, show exit button */
    var btn = document.getElementById('vr-enter-btn');
    if (btn) btn.style.display = 'none';

    var exit = document.getElementById('vr-exit-btn');
    if (!exit) {
      exit = document.createElement('button');
      exit.id = 'vr-exit-btn';
      exit.textContent = '✕ Quitter VR';
      exit.onclick = exitVR;
      document.body.appendChild(exit);
    }
  }

  function exitVR() {
    var btn = document.getElementById('vr-enter-btn');
    if (btn) btn.style.display = '';
    var exit = document.getElementById('vr-exit-btn');
    if (exit) exit.remove();
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(function(){});
    }
  }

  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement) exitVR();
  });

  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('vr-enter-btn');
    if (btn) btn.addEventListener('click', enterVR);
  });
})();
</script>

<script>
  window.addEventListener('message', function(e) {
    if (e.data === 'enterPanorama') enterPanorama()
    if (e.data === 'exitPanorama')  exitPanorama()
  })

  function enterPanorama() {
    // 1. Pannellum : redimensionne le viewer pour remplir tout l'écran
    //    Pannellum expose son instance soit via pannellumViewer (variable globale)
    //    soit via l'API window.viewer — on essaie les deux
    resizePannellum()

    // 2. Cache tout ce qui n'est pas le viewer (hotspots toolbar, titres, etc.)
    hideUI()

    // 3. Force le fond en noir pour éviter le flash blanc
    document.documentElement.style.background = '#000'
    document.body.style.background = '#000'
    document.body.style.overflow   = 'hidden'
  }

  function exitPanorama() {
    showUI()
    document.documentElement.style.background = ''
    document.body.style.background = ''
    document.body.style.overflow   = ''
    resizePannellum()
  }

  function resizePannellum() {
    // Pannellum v2 API — resize() recalcule la taille du canvas
    setTimeout(function() {
      // Cas 1 : instance exposée comme variable globale "viewer"
      if (window.viewer && typeof window.viewer.resize === 'function') {
        window.viewer.resize()
        return
      }
      // Cas 2 : instance exposée comme "pannellumViewer"
      if (window.pannellumViewer && typeof window.pannellumViewer.resize === 'function') {
        window.pannellumViewer.resize()
        return
      }
      // Cas 3 : instance dans un div #panorama (API pannellum.viewer)
      if (window.pannellum && window.pannellum.viewer) {
        window.pannellum.viewer.resize()
        return
      }
      // Cas 4 : déclenchement manuel via resize event du navigateur
      window.dispatchEvent(new Event('resize'))
    }, 80)
  }

  function hideUI() {
    // Pannellum génère un div .pnlm-container — on cache tout sauf lui
    var toHide = document.querySelectorAll(
      '.pnlm-controls-container, .pnlm-load-button, ' +
      '.pnlm-title-box, .pnlm-author-box, ' +
      'header, footer, nav, .toolbar, .sidebar, ' +
      '[data-ui="true"], .ui-overlay'
    )
    toHide.forEach(function(el) {
      el.setAttribute('data-pano-hidden', 'true')
      el.style.opacity = '0'
      el.style.pointerEvents = 'none'
      el.style.transition = 'opacity 0.25s ease'
    })
  }

  function showUI() {
    var hidden = document.querySelectorAll('[data-pano-hidden="true"]')
    hidden.forEach(function(el) {
      el.removeAttribute('data-pano-hidden')
      el.style.opacity = ''
      el.style.pointerEvents = ''
    })
  }
</script>
