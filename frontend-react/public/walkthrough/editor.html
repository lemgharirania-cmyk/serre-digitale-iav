<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>AgroBioTech — Éditeur Universel</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>
<script src="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --g50:#edf7f0;--g100:#c6e9d0;--g300:#6dbc85;--g500:#2d8e50;--g700:#1a5c33;
  --b50:#e8f4fb;--b300:#5ba8d8;--b500:#1e7ab5;
  --n50:#f8faf9;--n100:#eef1ee;--n200:#d8ddd8;--n300:#c0c7c0;--n400:#9aa09a;--n500:#6b736b;--n800:#2a2e2a;
  --white:#fff;--panel:300px;--topbar:52px;
  --shadow:0 1px 4px rgba(0,0,0,.08);--shadow-md:0 4px 16px rgba(0,0,0,.1);
}
body{font-family:'DM Sans',sans-serif;background:var(--n50);color:var(--n800);height:100vh;overflow:hidden;
  display:grid;grid-template-rows:var(--topbar) 1fr;grid-template-columns:1fr var(--panel)}

/* ── TOPBAR ── */
.topbar{grid-column:1/-1;background:var(--white);border-bottom:1px solid var(--n200);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;gap:12px;box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:8px}
.logo-badge{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,var(--g300),var(--b300));
  display:flex;align-items:center;justify-content:center;font-size:14px}
.logo-text{font-size:14px;font-weight:600;color:var(--n800)}
.logo-text span{color:var(--g500)}
.logo-text small{color:var(--n400);font-weight:400;font-size:11px;margin-left:4px}

.zone-selector{display:flex;align-items:center;gap:8px;background:var(--n100);border-radius:8px;padding:4px 8px}
.zone-selector label{font-size:11px;color:var(--n500);font-weight:500;white-space:nowrap}
.zone-selector select{border:none;background:transparent;font-size:12px;font-weight:600;color:var(--n800);
  font-family:'DM Sans',sans-serif;outline:none;cursor:pointer;padding-right:4px}

.scene-nav{display:flex;align-items:center;gap:6px}
.snav{width:26px;height:26px;border-radius:5px;background:var(--n100);border:none;color:var(--n800);
  cursor:pointer;font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;transition:.12s}
.snav:hover{background:var(--n200)}
.snav:disabled{opacity:.3;pointer-events:none}
.scene-info{min-width:110px;text-align:center}
.scene-num{font-size:12px;font-weight:600}
.scene-fname{font-size:10px;color:var(--n500);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}

.status{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--n500)}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--n300)}
.sdot.ready{background:var(--g300)}.sdot.loading{background:#f0a030;animation:blink 1s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

.topbar-right{display:flex;align-items:center;gap:8px}
.kbd{background:var(--n100);border:1px solid var(--n200);border-radius:4px;padding:1px 5px;font-size:10px;font-family:'DM Mono',monospace;color:var(--n500)}
.hints{display:flex;gap:8px;font-size:11px;color:var(--n400)}
.tbtn{padding:6px 13px;border-radius:7px;font-size:12px;font-weight:500;border:none;cursor:pointer;font-family:'DM Sans',sans-serif;transition:.13s}
.tbtn.ghost{background:var(--n100);color:var(--n800);border:1px solid var(--n200)}.tbtn.ghost:hover{background:var(--n200)}
.tbtn.green{background:var(--g500);color:white}.tbtn.green:hover{background:var(--g700)}
.tbtn.green.ok{background:#16a34a}

/* ── VIEWER ── */
#pano{grid-row:2;grid-column:1;position:relative;cursor:crosshair;background:#111}
#pano-inner{width:100%;height:100%}
.pnlm-about-msg,.pnlm-panorama-info{display:none!important}

.coords-hud{position:absolute;bottom:12px;left:12px;z-index:50;background:rgba(255,255,255,.92);
  backdrop-filter:blur(8px);border:1px solid var(--n200);border-radius:8px;padding:7px 13px;
  font-family:'DM Mono',monospace;font-size:12px;color:var(--g700);pointer-events:none;line-height:1.8}
.coords-hud .lbl{color:var(--n400);font-size:10px}

.zone-badge-hud{position:absolute;top:12px;left:12px;z-index:50;
  background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border:1px solid var(--n200);
  border-radius:999px;padding:5px 14px;font-size:12px;font-weight:600;pointer-events:none}

.toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:200;
  background:var(--g500);color:white;border-radius:999px;padding:6px 18px;
  font-size:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap;
  box-shadow:0 4px 12px rgba(0,0,0,.15)}
.toast.show{opacity:1}
.toast.warn{background:#b45309}

.ring{position:absolute;width:22px;height:22px;border-radius:50%;border:2.5px solid var(--g500);
  background:rgba(45,142,80,.2);transform:translate(-50%,-50%);pointer-events:none;z-index:60;
  animation:ringPop .35s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes ringPop{from{transform:translate(-50%,-50%) scale(0);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}

/* ── PANEL ── */
.panel{grid-row:2;grid-column:2;background:var(--white);border-left:1px solid var(--n200);
  display:flex;flex-direction:column;overflow:hidden}
.p-block{padding:12px 14px;border-bottom:1px solid var(--n100)}
.p-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--n400);margin-bottom:8px}

/* Mode */
.mode-row{display:flex;gap:6px}
.mode-opt{flex:1;padding:6px 4px;border-radius:7px;border:1.5px solid var(--n200);background:var(--white);
  cursor:pointer;font-size:12px;font-weight:500;color:var(--n500);text-align:center;
  transition:.13s;font-family:'DM Sans',sans-serif}
.mode-opt:hover{border-color:var(--g300);color:var(--g700);background:var(--g50)}
.mode-opt.active{border-color:var(--g500);background:var(--g50);color:var(--g700);font-weight:600}
.mode-opt.active-b{border-color:var(--b500);background:var(--b50);color:var(--b500);font-weight:600}

/* Cross-zone target selector */
.target-section{margin-top:10px}
.target-section label{font-size:11px;color:var(--n500);display:block;margin-bottom:4px}
.target-zone-row{display:flex;gap:6px;margin-bottom:6px}
.target-zone-row select,.target-scene-row select{flex:1;border:1.5px solid var(--n200);border-radius:6px;
  padding:5px 7px;font-size:12px;font-family:'DM Sans',sans-serif;color:var(--n800);background:var(--white);
  outline:none;transition:.13s}
.target-zone-row select:focus,.target-scene-row select:focus{border-color:var(--g300)}
.target-zone-row label,.target-scene-row label{font-size:10px;color:var(--n500);white-space:nowrap;align-self:center}
.target-zone-row,.target-scene-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}

.click-status{margin-top:8px;padding:7px 10px;border-radius:7px;background:var(--n50);border:1px solid var(--n200);
  font-family:'DM Mono',monospace;font-size:11px;color:var(--n500);text-align:center;transition:.2s}
.click-status.has-click{background:var(--g50);border-color:var(--g100);color:var(--g700)}

/* Progress */
.progress-wrap{padding:10px 14px;border-bottom:1px solid var(--n100)}
.pdots{display:flex;gap:3px;flex-wrap:wrap;margin-bottom:4px}
.pdot{width:10px;height:10px;border-radius:50%;background:var(--n200);cursor:pointer;
  transition:.13s;border:1.5px solid transparent;flex-shrink:0;title-attr:attr(title)}
.pdot:hover{background:var(--g300)}
.pdot.active{background:var(--g500)}
.pdot.done{background:var(--g100);border-color:var(--g300)}
.pdot-lbl{font-size:10px;color:var(--n400)}

/* HS list */
.list-hdr{padding:8px 14px 2px;display:flex;align-items:center;justify-content:space-between}
.list-hdr span{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--n400)}
.list-hdr button{font-size:10px;color:var(--n400);background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif}
.list-hdr button:hover{color:#dc2626}
.hs-scroll{flex:1;overflow-y:auto;padding:4px 8px 8px}
.hs-scroll::-webkit-scrollbar{width:3px}.hs-scroll::-webkit-scrollbar-thumb{background:var(--n200);border-radius:99px}
.hs-row{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:7px;border:1px solid var(--n100);
  background:var(--n50);margin-bottom:4px;transition:.13s}
.hs-row:hover{border-color:var(--n200);background:var(--white)}
.hs-badge{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.hs-badge.nav{background:var(--g300)}.hs-badge.ar{background:var(--b300)}
.hs-txt{flex:1;min-width:0}
.hs-mono{font-family:'DM Mono',monospace;font-size:11px;color:var(--g700);font-weight:500}
.hs-sub{font-size:10px;color:var(--n500);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hs-cross-tag{font-size:9px;background:var(--b50);color:var(--b500);border-radius:4px;padding:1px 5px;margin-left:3px;font-weight:600}
.hs-del{width:20px;height:20px;border-radius:4px;background:transparent;border:none;color:var(--n300);
  cursor:pointer;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.13s}
.hs-del:hover{background:#fef2f2;color:#dc2626}
.empty{text-align:center;padding:24px 12px;color:var(--n400);font-size:12px;line-height:1.7}

/* Export */
.export-wrap{padding:10px 14px;border-top:1px solid var(--n100)}
.export-wrap .tbtn{width:100%;padding:9px;border-radius:7px;font-size:13px}

/* HS visuals in viewer */
.hs-visu-nav{width:50px;height:50px;border-radius:50%;
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.96) 0%,rgba(190,235,205,.9) 52%,rgba(45,142,80,.2) 100%);
  border:2px solid rgba(45,142,80,.75);
  box-shadow:0 0 0 7px rgba(45,142,80,.15),0 3px 12px rgba(0,0,0,.18);
  cursor:default;animation:hsp 2.5s infinite;display:flex;align-items:center;justify-content:center}
.hs-visu-nav svg{width:16px;height:16px;fill:rgba(30,100,55,.8)}
.hs-visu-cross{border-color:rgba(30,122,181,.75);
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.96) 0%,rgba(190,220,245,.9) 52%,rgba(30,122,181,.2) 100%);
  box-shadow:0 0 0 7px rgba(30,122,181,.13),0 3px 12px rgba(0,0,0,.18)}
.hs-visu-ar{border-color:rgba(180,83,9,.6);width:40px;height:40px;
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.96) 0%,rgba(250,238,218,.9) 52%,rgba(180,83,9,.15) 100%);
  box-shadow:0 0 0 5px rgba(180,83,9,.1),0 3px 10px rgba(0,0,0,.15);font-size:16px}
@keyframes hsp{0%,100%{box-shadow:0 0 0 7px rgba(45,142,80,.15),0 3px 12px rgba(0,0,0,.18)}50%{box-shadow:0 0 0 13px rgba(45,142,80,.06),0 3px 12px rgba(0,0,0,.18)}}
.pnlm-hotspot-base{background:transparent!important;border:none!important;width:auto!important;height:auto!important;overflow:visible!important}
.pnlm-hotspot-base .pnlm-sprite{display:none!important}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div style="display:flex;align-items:center;gap:14px">
    <div class="logo">
      <div class="logo-badge">🌿</div>
      <div class="logo-text">Agro<span>Bio</span>Tech <small>/ Éditeur Universel</small></div>
    </div>

    <div class="zone-selector">
      <label>Zone</label>
      <select id="zone-sel" onchange="onZoneChange()"></select>
    </div>

    <div class="scene-nav">
      <button class="snav" id="btn-prev" onclick="changeScene(-1)">‹</button>
      <div class="scene-info">
        <div class="scene-num" id="scene-num">— / —</div>
        <div class="scene-fname" id="scene-fname">—</div>
      </div>
      <button class="snav" id="btn-next" onclick="changeScene(1)">›</button>
    </div>

    <div class="status"><div class="sdot loading" id="sdot"></div><span id="stxt">Chargement manifest…</span></div>
  </div>

  <div class="topbar-right">
    <div class="hints">
      <span>Clic = place</span>
      <span><kbd class="kbd">Space</kbd>/<kbd class="kbd">→</kbd> suivant</span>
      <span><kbd class="kbd">←</kbd> précédent</span>
      <span><kbd class="kbd">Z</kbd> annuler</span>
    </div>
    <button class="tbtn ghost" onclick="clearScene()">🗑 Vider</button>
    <button class="tbtn green" id="export-btn" onclick="saveAndExport()">💾 Sauvegarder</button>
  </div>
</div>

<!-- VIEWER -->
<div id="pano">
  <div id="pano-inner"></div>
  <div class="coords-hud"><span class="lbl">pitch</span> <b id="lp">—</b> &nbsp; <span class="lbl">yaw</span> <b id="ly">—</b></div>
  <div class="zone-badge-hud" id="zone-badge">—</div>
  <div class="toast" id="toast"></div>
</div>

<!-- PANEL -->
<div class="panel">

  <!-- Mode -->
  <div class="p-block">
    <div class="p-label">Mode de placement</div>
    <div class="mode-row">
      <button class="mode-opt active" id="mode-nav" onclick="setMode('nav')">⬤ Même zone</button>
      <button class="mode-opt" id="mode-cross" onclick="setMode('cross')">↗ Autre zone</button>
      <button class="mode-opt" id="mode-ar" onclick="setMode('ar')">🌿 Info AR</button>
    </div>

    <div class="target-section" id="target-section">
      <div class="target-zone-row" id="target-zone-row" style="display:none">
        <label>Zone →</label>
        <select id="target-zone-sel" onchange="onTargetZoneChange()"></select>
      </div>
      <div class="target-scene-row">
        <label>Scène →</label>
        <select id="target-scene-sel"></select>
      </div>
    </div>

    <!-- AR description field — only visible in AR mode -->
    <div id="ar-desc-row" style="display:none;margin-top:10px">
      <div style="font-size:10px;color:var(--n500);font-weight:500;margin-bottom:4px">Description (ce que tu pointes)</div>
      <input id="ar-desc-input" type="text" placeholder="ex: Fraisier en production, Sonde pH..."
        style="width:100%;border:1.5px solid var(--n200);border-radius:6px;padding:7px 10px;
        font-size:12px;font-family:'DM Sans',sans-serif;color:var(--n800);outline:none;
        background:var(--white);transition:border-color .13s"
        onfocus="this.style.borderColor='var(--g300)'"
        onblur="this.style.borderColor='var(--n200)'"/>
    </div>

    <div class="click-status" id="click-status">Cliquez sur le sol du panorama</div>
  </div>

  <!-- Zone progress dots -->
  <div class="progress-wrap">
    <div class="p-label">Scènes — <span id="zone-progress-lbl">—</span></div>
    <div class="pdots" id="pdots"></div>
    <div class="pdot-lbl" id="pdot-lbl">—</div>
  </div>

  <!-- HS list -->
  <div class="list-hdr">
    <span>Hotspots — scène <span id="hs-snum">—</span></span>
    <button onclick="clearScene()">tout supprimer</button>
  </div>
  <div class="hs-scroll" id="hs-list">
    <div class="empty">Cliquez sur le sol<br>pour placer un hotspot</div>
  </div>

  <!-- Export -->
  <div class="export-wrap">
    <button class="tbtn green" style="width:100%;padding:9px;font-size:13px" onclick="saveAndExport()">💾 Sauvegarder tous les hotspots</button>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════════
let manifest   = null;   // loaded from manifest.json
let zones      = [];     // manifest.zones
let hotspots   = {};     // { zoneId: { sceneId: [ {type,pitch,yaw,targetZone,targetScene,label} ] } }

let currentZoneId  = null;
let currentSceneIdx = 0;
let mode       = 'nav';
let viewer     = null;
let ready      = false;

// ══════════════════════════════════════════════════
//  BOOT — load manifest.json
// ══════════════════════════════════════════════════
window.addEventListener('load', async () => {
  try {
    const res = await fetch('images/manifest.json');
    if (!res.ok) throw new Error('manifest.json not found');
    manifest = await res.json();
    zones    = manifest.zones;

    // Restore saved hotspots if any
    const saved = localStorage.getItem('agrobiotech_hotspots');
    if (saved) {
      hotspots = JSON.parse(saved);
      showToast('💾 Hotspots restaurés', false);
    } else {
      zones.forEach(z => { hotspots[z.id] = {}; });
    }

    buildZoneDropdown();
    buildTargetDropdowns();
    setupKeyboard();
    loadZone(zones[0].id);

  } catch(e) {
    setStatus('loading', 'manifest.json introuvable');
    document.getElementById('stxt').style.color = '#dc2626';
    showToast('⚠ Lancez generate_manifest.py d\'abord', true);
  }
});

// ══════════════════════════════════════════════════
//  ZONE / SCENE LOADING
// ══════════════════════════════════════════════════
function buildZoneDropdown() {
  const sel = document.getElementById('zone-sel');
  zones.forEach(z => {
    const o = document.createElement('option');
    o.value = z.id;
    o.textContent = `${z.icon} ${z.label}`;
    sel.appendChild(o);
  });
}

function buildTargetDropdowns() {
  // Target zone dropdown (for cross-zone mode)
  const zsel = document.getElementById('target-zone-sel');
  zones.forEach(z => {
    const o = document.createElement('option');
    o.value = z.id; o.textContent = `${z.icon} ${z.label}`;
    zsel.appendChild(o);
  });
  onTargetZoneChange(); // populate scene dropdown for first zone
}

function onTargetZoneChange() {
  const zoneId = document.getElementById('target-zone-sel').value;
  const zone   = zones.find(z => z.id === zoneId);
  const ssel   = document.getElementById('target-scene-sel');
  ssel.innerHTML = '';
  if (!zone) return;
  zone.scenes.forEach((sc, i) => {
    const o = document.createElement('option');
    o.value = sc.id; o.textContent = `${i+1}. ${sc.file.split('/').pop()}`;
    ssel.appendChild(o);
  });
}

function onZoneChange() {
  const zoneId = document.getElementById('zone-sel').value;
  loadZone(zoneId);
}

function loadZone(zoneId) {
  const zone = zones.find(z => z.id === zoneId);
  if (!zone) return;
  currentZoneId   = zoneId;
  currentSceneIdx = 0;

  if (!hotspots[zoneId]) hotspots[zoneId] = {};

  // Update target scene dropdown default to same zone first scene
  document.getElementById('target-zone-sel').value = zoneId;
  onTargetZoneChange();

  // Badge
  document.getElementById('zone-badge').textContent = `${zone.icon} ${zone.label}`;
  document.getElementById('zone-badge').style.color = zone.color;

  // Progress dots
  buildProgressDots(zone);

  // Set target-zone default to next zone
  const zi = zones.findIndex(z => z.id === zoneId);
  if (mode === 'nav') {
    document.getElementById('target-zone-sel').value = zoneId;
    onTargetZoneChange();
  }

  loadScene(0);
}

function loadScene(idx) {
  const zone = zones.find(z => z.id === currentZoneId);
  if (!zone || !zone.scenes[idx]) return;
  currentSceneIdx = idx;
  ready = false;

  const sc = zone.scenes[idx];
  setStatus('loading', 'Chargement…');
  document.getElementById('scene-num').textContent  = `${idx+1} / ${zone.scenes.length}`;
  document.getElementById('scene-fname').textContent = sc.file.split('/').pop();
  document.getElementById('hs-snum').textContent     = idx + 1;
  document.getElementById('btn-prev').disabled = idx === 0;
  document.getElementById('btn-next').disabled = idx === zone.scenes.length - 1;
  document.getElementById('click-status').textContent = 'Cliquez sur le sol du panorama';
  document.getElementById('click-status').classList.remove('has-click');

  // Default target scene to next in same zone
  if (mode === 'nav') {
    const nextIdx = Math.min(idx + 1, zone.scenes.length - 1);
    document.getElementById('target-scene-sel').value = zone.scenes[nextIdx]?.id;
  }

  updateProgressDots();
  renderList();

  if (viewer) { viewer.destroy(); viewer = null; }
  document.getElementById('pano-inner').innerHTML = '';
  viewer = pannellum.viewer('pano-inner', {
    type: 'equirectangular',
    panorama: sc.file,
    autoLoad: true, autoRotate: 0,
    hfov: 100, pitch: -10, yaw: 0,
    minHfov: 50, maxHfov: 130,
    compass: false, showControls: true, showFullscreenCtrl: false,
    hotSpots: buildVisuHotspots(),
  });
  viewer.on('load', () => {
    ready = true;
    setStatus('ready', `${zone.label} — scène ${idx+1}`);
    attachTracking();
  });
}

// ══════════════════════════════════════════════════
//  MOUSE TRACKING
// ══════════════════════════════════════════════════
function attachTracking() {
  const el = document.getElementById('pano-inner');
  el.onmousemove = e => {
    if (!ready || !viewer) return;
    try {
      const c = viewer.mouseEventToCoords(e);
      if (c) { document.getElementById('lp').textContent = c[0].toFixed(1); document.getElementById('ly').textContent = c[1].toFixed(1); }
    } catch(_) {}
  };
  el.onclick = e => {
    if (!ready || !viewer || e.target.closest('.pnlm-hotspot-base')) return;
    try {
      const c = viewer.mouseEventToCoords(e);
      if (c) placeHotspot(parseFloat(c[0].toFixed(1)), parseFloat(c[1].toFixed(1)), e.clientX, e.clientY);
    } catch(_) {}
  };
}

// ══════════════════════════════════════════════════
//  HOTSPOT PLACEMENT
// ══════════════════════════════════════════════════
function placeHotspot(pitch, yaw, cx, cy) {
  if (mode === 'ar') {
    const desc = document.getElementById('ar-desc-input').value.trim() || 'Info AR';
    addHS({ type:'ar', pitch, yaw, label: desc, arDesc: desc });
    showToast(`🌿 "${desc}" placé`);
    showRing(cx, cy);
    document.getElementById('click-status').textContent = `pitch ${pitch}  ·  yaw ${yaw}`;
    document.getElementById('click-status').classList.add('has-click');
    return;
  }

  const targetZoneId = mode === 'cross'
    ? document.getElementById('target-zone-sel').value
    : currentZoneId;

  const targetSceneId = document.getElementById('target-scene-sel').value;
  const targetZone    = zones.find(z => z.id === targetZoneId);
  const targetScene   = targetZone?.scenes.find(s => s.id === targetSceneId);
  const isCross       = targetZoneId !== currentZoneId;

  if (!targetScene) { showToast('⚠ Sélectionnez une scène cible', true); return; }

  addHS({
    type:         isCross ? 'cross' : 'nav',
    pitch, yaw,
    targetZoneId,
    targetSceneId,
    label: isCross
      ? `${targetZone.icon} ${targetZone.label}`
      : `→ sc.${targetZone.scenes.indexOf(targetScene)+1}`,
  });

  showRing(cx, cy);
  showToast(isCross
    ? `↗ ${targetZone.label} — sc.${targetZone.scenes.indexOf(targetScene)+1} placé`
    : `⬤ Scène ${targetZone.scenes.indexOf(targetScene)+1} placé`
  );

  document.getElementById('click-status').textContent = `pitch ${pitch}  ·  yaw ${yaw}`;
  document.getElementById('click-status').classList.add('has-click');

  // Auto-advance if nav to next scene in same zone
  const zone = zones.find(z => z.id === currentZoneId);
  const targetIdx = zone?.scenes.findIndex(s => s.id === targetSceneId);
  if (!isCross && targetIdx === currentSceneIdx + 1 && currentSceneIdx < zone.scenes.length - 1) {
    setTimeout(() => changeScene(1), 700);
  }
}

function getSceneHotspots() {
  const zone = zones.find(z => z.id === currentZoneId);
  if (!zone) return [];
  const sceneId = zone.scenes[currentSceneIdx]?.id;
  if (!hotspots[currentZoneId]) hotspots[currentZoneId] = {};
  if (!hotspots[currentZoneId][sceneId]) hotspots[currentZoneId][sceneId] = [];
  return hotspots[currentZoneId][sceneId];
}

function addHS(hs) {
  getSceneHotspots().push(hs);
  reloadHotspots(); renderList(); updateProgressDots(); autoSave();
}

function deleteHotspot(i) {
  getSceneHotspots().splice(i, 1);
  reloadHotspots(); renderList(); updateProgressDots(); autoSave();
}

function undoLast() {
  const arr = getSceneHotspots();
  if (!arr.length) return;
  arr.pop();
  showToast('↩ Annulé');
  reloadHotspots(); renderList(); updateProgressDots(); autoSave();
}

function clearScene() {
  const zone = zones.find(z => z.id === currentZoneId);
  const sceneId = zone?.scenes[currentSceneIdx]?.id;
  if (!sceneId || !hotspots[currentZoneId]?.[sceneId]?.length) return;
  hotspots[currentZoneId][sceneId] = [];
  reloadHotspots(); renderList(); updateProgressDots(); autoSave();
  showToast('🗑 Scène vidée');
}

// ══════════════════════════════════════════════════
//  VIEWER HOTSPOT VISUALS
// ══════════════════════════════════════════════════
function buildVisuHotspots() {
  return getSceneHotspots().map(hs => ({
    pitch: hs.pitch, yaw: hs.yaw, type:'custom', cssClass:'pnlm-hs',
    createTooltipFunc: div => {
      div.style.cssText = 'background:transparent;border:none;width:auto;height:auto;overflow:visible';
      const el = document.createElement('div');
      el.className = 'hs-visu-nav';
      if (hs.type === 'cross') el.classList.add('hs-visu-cross');
      if (hs.type === 'ar')    el.classList.add('hs-visu-ar');
      el.innerHTML = hs.type === 'ar'
        ? '<span style="font-size:16px">🌿</span>'
        : `<svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>`;
      div.appendChild(el);
    },
    createTooltipArgs: {}, clickHandlerFunc: () => {},
  }));
}

function reloadHotspots() {
  if (!viewer) return;
  const pitch = viewer.getPitch(), yaw = viewer.getYaw(), hfov = viewer.getHfov();
  const zone = zones.find(z => z.id === currentZoneId);
  viewer.destroy();
  viewer = null;
  document.getElementById('pano-inner').innerHTML = '';
  viewer = pannellum.viewer('pano-inner', {
    type:'equirectangular', panorama: zone.scenes[currentSceneIdx].file,
    autoLoad:true, autoRotate:0, hfov, pitch, yaw,
    minHfov:50, maxHfov:130, compass:false, showControls:true, showFullscreenCtrl:false,
    hotSpots: buildVisuHotspots(),
  });
  viewer.on('load', () => { ready = true; attachTracking(); });
}

// ══════════════════════════════════════════════════
//  PANEL RENDERING
// ══════════════════════════════════════════════════
function renderList() {
  const list  = document.getElementById('hs-list');
  const items = getSceneHotspots();
  if (!items.length) { list.innerHTML = '<div class="empty">Cliquez sur le sol<br>pour placer un hotspot</div>'; return; }

  list.innerHTML = items.map((hs, i) => {
    const isCross = hs.type === 'cross';
    const tz = isCross ? zones.find(z => z.id === hs.targetZoneId) : null;
    const sub = hs.type === 'ar'
      ? `🌿 ${hs.arDesc || hs.label || 'Info AR'}`
      : isCross
        ? `↗ ${tz?.icon} ${tz?.label}`
        : `→ ${hs.label}`;
    return `
    <div class="hs-row">
      <div class="hs-badge ${hs.type === 'ar' ? 'ar' : 'nav'}" style="${isCross ? 'background:#5ba8d8' : ''}"></div>
      <div class="hs-txt">
        <div class="hs-mono">p ${hs.pitch} · y ${hs.yaw}</div>
        <div class="hs-sub">${sub}${isCross ? '<span class="hs-cross-tag">CROSS</span>' : ''}</div>
      </div>
      <button class="hs-del" onclick="deleteHotspot(${i})">✕</button>
    </div>`;
  }).join('');
}

function buildProgressDots(zone) {
  const el = document.getElementById('pdots');
  el.innerHTML = '';
  zone.scenes.forEach((sc, i) => {
    const d = document.createElement('div');
    d.className = 'pdot'; d.dataset.i = i; d.title = sc.file.split('/').pop();
    d.onclick = () => loadScene(i);
    el.appendChild(d);
  });
  document.getElementById('zone-progress-lbl').textContent = zone.label;
  updateProgressDots();
}

function updateProgressDots() {
  const zone = zones.find(z => z.id === currentZoneId);
  if (!zone) return;
  let done = 0;
  document.querySelectorAll('.pdot').forEach((d, i) => {
    const sceneId = zone.scenes[i]?.id;
    const has = hotspots[currentZoneId]?.[sceneId]?.length > 0;
    if (has) done++;
    d.className = 'pdot' + (i === currentSceneIdx ? ' active' : has ? ' done' : '');
  });
  document.getElementById('pdot-lbl').textContent = `${done} / ${zone.scenes.length} scènes avec hotspots`;
}

// ══════════════════════════════════════════════════
//  SAVE / EXPORT
// ══════════════════════════════════════════════════
function autoSave() {
  localStorage.setItem('agrobiotech_hotspots', JSON.stringify(hotspots));
}

function saveAndExport() {
  autoSave();
  // Build export string for all zones
  const lines = [];
  zones.forEach(zone => {
    const zhs = hotspots[zone.id];
    if (!zhs) return;
    zone.scenes.forEach((sc, si) => {
      const shs = zhs[sc.id];
      if (!shs?.length) return;
      const items = shs.map(h => {
        if (h.type === 'ar') return `    { type:"ar", pitch:${h.pitch}, yaw:${h.yaw}, plant:{ icon:"🌿", name:"…", desc:"…", tags:[] } }`;
        const tz = zones.find(z => z.id === h.targetZoneId);
        const ts = tz?.scenes.find(s => s.id === h.targetSceneId);
        return `    { type:"${h.type}", pitch:${h.pitch}, yaw:${h.yaw}, targetZone:"${h.targetZoneId}", targetScene:"${h.targetSceneId}", label:"${h.label}" }`;
      }).join(',\n');
      lines.push(`  // ${zone.label} — scène ${si+1} (${sc.file.split('/').pop()})\n  "${sc.id}": [\n${items}\n  ]`);
    });
  });

  const out = `{\n${lines.join(',\n\n')}\n}`;
  navigator.clipboard.writeText(out).then(() => {
    showToast('✓ Sauvegardé + copié !');
    const btn = document.getElementById('export-btn');
    btn.textContent = '✓ Sauvegardé !'; btn.classList.add('ok');
    setTimeout(() => { btn.textContent = '💾 Sauvegarder'; btn.classList.remove('ok'); }, 2000);
  });

  // Also update manifest with hotspots and save as downloadable
  if (manifest) {
    manifest.hotspots = hotspots;
    const blob = new Blob([JSON.stringify(manifest, null, 2)], { type:'application/json' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href = url; a.download = 'manifest.json'; a.click();
    URL.revokeObjectURL(url);
  }
}

// ══════════════════════════════════════════════════
//  UI HELPERS
// ══════════════════════════════════════════════════
function changeScene(d) {
  const zone = zones.find(z => z.id === currentZoneId);
  const n = currentSceneIdx + d;
  if (zone && n >= 0 && n < zone.scenes.length) loadScene(n);
}

function setMode(m) {
  mode = m;
  document.getElementById('mode-nav').className   = 'mode-opt' + (m==='nav'   ? ' active'   : '');
  document.getElementById('mode-cross').className = 'mode-opt' + (m==='cross' ? ' active'   : '');
  document.getElementById('mode-ar').className    = 'mode-opt' + (m==='ar'    ? ' active-b' : '');
  const showZone  = m === 'cross';
  const showScene = m !== 'ar';
  document.getElementById('target-zone-row').style.display  = showZone  ? 'flex' : 'none';
  document.querySelector('.target-scene-row').style.display = showScene ? 'flex' : 'none';
  document.getElementById('ar-desc-row').style.display      = m === 'ar' ? 'block' : 'none';

  // For same-zone nav, reset zone selector to current zone
  if (m === 'nav') {
    document.getElementById('target-zone-sel').value = currentZoneId;
    onTargetZoneChange();
    const zone = zones.find(z => z.id === currentZoneId);
    const nextId = zone?.scenes[Math.min(currentSceneIdx+1, zone.scenes.length-1)]?.id;
    if (nextId) document.getElementById('target-scene-sel').value = nextId;
  }
}

function setupKeyboard() {
  document.addEventListener('keydown', e => {
    if (['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName)) return;
    if (e.code==='Space'||e.code==='ArrowRight') { e.preventDefault(); changeScene(1); }
    if (e.code==='ArrowLeft') { e.preventDefault(); changeScene(-1); }
    if (e.code==='KeyZ') undoLast();
  });
}

function showRing(x, y) {
  const pano = document.getElementById('pano');
  const rect = pano.getBoundingClientRect();
  const r = document.createElement('div'); r.className = 'ring';
  r.style.left = (x-rect.left)+'px'; r.style.top = (y-rect.top)+'px';
  pano.appendChild(r); setTimeout(() => r.remove(), 500);
}

function showToast(msg, warn=false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (warn?' warn':'');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1600);
}

function setStatus(s, txt) {
  document.getElementById('sdot').className = 'sdot '+s;
  document.getElementById('stxt').textContent = txt;
}
</script>
