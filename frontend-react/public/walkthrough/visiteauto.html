<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pannellum@2.5.6/build/pannellum.css"/>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',sans-serif;background:#000}
#pano-a,#pano-b{position:fixed;inset:0;width:100%;height:100%;z-index:1}
#pano-a{opacity:1}
#pano-b{opacity:0;pointer-events:none}
.pnlm-about-msg,.pnlm-panorama-info,.pnlm-controls-container,
.pnlm-load-box,.pnlm-lbar,.pnlm-lbar-fill,.pnlm-load-button,
.pnlm-loading,.pnlm-compass{display:none!important}
#vignette { display: none; }
#atmo{position:fixed;inset:0;z-index:9;pointer-events:none;
  background:linear-gradient(to bottom,rgba(0,0,0,.08) 0%,transparent 30%,transparent 70%,rgba(0,0,0,.15) 100%)}
.arrow{position:fixed;top:50%;transform:translateY(-50%);z-index:50;width:42px;height:42px;
  border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
  cursor:pointer;display:flex;align-items:center;justify-content:center;color:white;font-size:20px;
  backdrop-filter:blur(8px);transition:.25s}
.arrow:hover{background:rgba(255,255,255,.22);transform:translateY(-50%) scale(1.08)}
.arrow.L{left:16px}.arrow.R{right:16px}
.arrow.off{opacity:0;pointer-events:none}
.scene-ctr{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:50;
  background:rgba(255,255,255,.1);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.18);
  border-radius:999px;padding:5px 14px;font-size:11px;font-weight:500;color:rgba(255,255,255,.7);
  letter-spacing:.04em;opacity:0;transition:opacity .4s}
.scene-ctr.show{opacity:1}
.zf{position:fixed;bottom:28px;right:28px;z-index:50;background:rgba(255,255,255,.12);
  backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.22);border-radius:12px;
  padding:10px 16px;opacity:0;transform:translateY(6px) scale(.97);transition:.4s}
.zf.show{opacity:1;transform:translateY(0) scale(1)}
.zf-label{font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:3px}
.zf-name{font-size:13px;font-weight:500;color:white}
.zf-unit{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px}
#flash{position:fixed;inset:0;z-index:200;pointer-events:none;background:rgba(255,255,255,0);transition:background .08s ease}
#flash.on{background:rgba(255,255,255,.04)}
#tourBtn{position:fixed;top:20px;right:20px;z-index:100;padding:12px 18px;border-radius:999px;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:white;
  font-size:13px;font-weight:500;cursor:pointer;backdrop-filter:blur(12px);transition:.25s;font-family:'Inter',sans-serif}
#tourBtn:hover{background:rgba(255,255,255,.22);transform:scale(1.05)}
.tour-bar{position:fixed;bottom:0;left:0;right:0;z-index:161;height:2px;pointer-events:none}
.tour-bar-fill{height:100%;width:0%;background:linear-gradient(to right,rgba(255,255,255,.2),rgba(255,255,255,.8));border-radius:0 1px 1px 0;transition:width linear}
#langPicker{
position:fixed;
top:70px;
right:20px;
z-index:9999;
display:flex;
gap:8px;
pointer-events:auto;
}

#langPicker button{
padding:8px 12px;
border:none;
border-radius:999px;
background:rgba(255,255,255,.12);
border:1px solid rgba(255,255,255,.2);
color:white;
cursor:pointer;
backdrop-filter:blur(10px);
transition:.25s;
font-family:'Inter',sans-serif;
pointer-events:auto;
position:relative;
z-index:9999;
}

#langPicker button:hover{
background:rgba(255,255,255,.22);
transform:scale(1.05);
}

#langPicker button.active{
background:white;
color:black;
transform:scale(1.05);
box-shadow:0 0 18px rgba(255,255,255,.35);
}

/* ── AR Popup System ── */
#ar-layer{position:fixed;inset:0;z-index:80;pointer-events:none}

.ar-popup{
  position:absolute;
  pointer-events:auto;
  min-width:200px;max-width:280px;
  background:rgba(0,8,20,.72);
  border:1px solid rgba(0,200,255,.28);
  border-radius:12px;
  padding:16px 18px 14px;
  backdrop-filter:blur(18px);
  opacity:0;
  transform:translateY(10px) scale(.97);
  transition:opacity .5s cubic-bezier(.4,0,.2,1), transform .5s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 28px rgba(0,180,255,.12), inset 0 0 20px rgba(0,180,255,.04);
}
.ar-popup.visible{
  opacity:1;
  transform:translateY(0) scale(1);
  animation:arFloat 4s ease-in-out infinite;
}
@keyframes arFloat{
  0%,100%{transform:translateY(0) scale(1)}
  50%{transform:translateY(-5px) scale(1)}
}
.ar-popup-tag{
  font-size:8px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(0,200,255,.7);margin-bottom:8px;display:flex;align-items:center;gap:6px;
}
.ar-popup-tag::before{
  content:'';display:inline-block;width:6px;height:6px;border-radius:50%;
  background:rgba(0,200,255,.9);box-shadow:0 0 8px rgba(0,200,255,.8);
  animation:arPulse 1.8s ease-in-out infinite;
}
@keyframes arPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
.ar-popup-title{
  font-size:14px;font-weight:600;color:#fff;margin-bottom:6px;line-height:1.3;
}
.ar-popup-body{
  font-size:11px;font-weight:400;color:rgba(255,255,255,.55);line-height:1.6;
}
.ar-popup-stat{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.07);
}
.ar-popup-stat-val{
  font-size:18px;font-weight:300;color:rgba(0,220,255,.9);letter-spacing:-.02em;
}
.ar-popup-stat-unit{
  font-size:10px;color:rgba(255,255,255,.35);
}
.ar-popup-close{
  position:absolute;top:10px;right:12px;font-size:14px;color:rgba(255,255,255,.25);
  cursor:pointer;line-height:1;transition:color .2s;background:none;border:none;
}
.ar-popup-close:hover{color:rgba(255,255,255,.7)}

/* corner brackets */
.ar-popup::before,.ar-popup::after{
  content:'';position:absolute;width:10px;height:10px;
  border-color:rgba(0,200,255,.5);border-style:solid;
}
.ar-popup::before{top:6px;left:6px;border-width:1px 0 0 1px;border-radius:2px 0 0 0}
.ar-popup::after{bottom:6px;right:6px;border-width:0 1px 1px 0;border-radius:0 0 2px 0}

/* Scene narration subtitle bar */
#narration-bar{
  position:fixed;bottom:36px;left:50%;transform:translateX(-50%);
  z-index:120;pointer-events:none;
  max-width:640px;width:90%;
  text-align:center;
  opacity:0;transition:opacity .6s ease;
}
#narration-bar.show{opacity:1}
#narration-text{
  display:inline-block;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.1);
  border-radius:8px;
  padding:8px 18px;
  font-size:12px;font-weight:400;
  color:rgba(255,255,255,.85);
  letter-spacing:.02em;line-height:1.5;
}
</style>
</head>

  const r = await fetch('images/manifest.json');
  manifest = await r.json();
  manifest.zones.forEach(z=>{ zones[z.id]=z; });
  const cfg = TOUR_CONFIG[0];
  load(cfg.z, cfg.s, true, null);
  document.addEventListener('keydown',e=>{
    if(e.code==='ArrowRight') stepScene(1);
    if(e.code==='ArrowLeft')  stepScene(-1);
  });
  setTimeout(()=>document.getElementById('scene-ctr').classList.add('show'),800);
});

// ── Tour ──
function toggleTour(){

  if(tourActive){
    stopTour();
    return;
  }

  tourActive=true;
  tourStep=0;

  const music=document.getElementById('bgMusic');
  const voice=document.getElementById('voiceover');

  // LOAD CORRECT LANGUAGE
  voice.src=`audio/${currentLang}.mp3`;

  // force browser load
  voice.load();

  // MUSIC
  music.volume=0;
  music.playbackRate=0.97;

  // VOICE — muted: Gemini TTS handles per-scene narration now
  voice.volume=0;

  // START AUDIO
  Promise.all([
    music.play().catch(()=>{}),
    voice.play().catch(()=>{})
  ]);

  // smooth music fade
  let vol=0;

  const fade=setInterval(()=>{

    vol+=0.015;

    if(vol>=0.18){

      vol=0.18;

      clearInterval(fade);
    }

    music.volume=vol;

  },60);

  document.getElementById('tourBtn').textContent='⏸ Arrêter';

  document.getElementById('prev').style.opacity='0';
  document.getElementById('next').style.opacity='0';

  runStep();
}

function setLang(lang){
  currentLang=lang;
  document.querySelectorAll('#langPicker button').forEach(b=>{
    b.classList.toggle('active', b.textContent===lang.toUpperCase());
  });
}

function runStep(){
  if(!tourActive) return;
  if(tourStep>=TOUR_CONFIG.length){ stopTour(true); return; }
  const cfg = TOUR_CONFIG[tourStep];
  load(cfg.z, cfg.s, false, cfg);
  let ms;
  if(cfg.rotate){
    ms = Math.ceil((360/cfg.rotateSpeed)*1000) + 1200;
  } else if(cfg.yawStart !== null && cfg.yawEnd !== null){
    const diff = Math.abs(((cfg.yawEnd - cfg.yawStart + 540) % 360) - 180);
    ms = 600 + (diff / cfg.rotateSpeed) * 1000 + 800;
  } else {
    ms = cfg.duration * 1000;
  }
  const fill = document.getElementById('tour-fill');
  fill.style.transition='none'; fill.style.width='0%';
  requestAnimationFrame(()=>{
    fill.style.transition=`width ${ms}ms linear`;
    fill.style.width='100%';
  });
  tourTimer = setTimeout(()=>{ tourStep++; runStep(); }, ms);
}

function stopTour(finished=false){
const music=document.getElementById('bgMusic');
const voice=document.getElementById('voiceover');
voice.src=`audio/${currentLang}.mp3`;

music.pause();

music.currentTime=0;

voice.pause();

voice.currentTime=0;

  tourActive=false;
  clearTimeout(tourTimer);
  if(_activeAnim){ clearInterval(_activeAnim); _activeAnim=null; }
  PopupMgr.dismiss();
  NarrationMgr.stop();
  document.getElementById('tourBtn').textContent='▶ Visite immersive';
  document.getElementById('prev').style.opacity='';
  document.getElementById('next').style.opacity='';
  const fill=document.getElementById('tour-fill');
  fill.style.transition='width .4s ease'; fill.style.width='0%';
}

function stepScene(d){
  if(tourActive) stopTour();
  const next=tourStep+d;
  if(next<0||next>=TOUR_CONFIG.length) return;
  tourStep=next;
  const cfg=TOUR_CONFIG[tourStep];
  load(cfg.z, cfg.s, false, null);
}

const IoTStore = (() => {
  const _data = { temp:24.2, humidity:68, ec:1.8, ph:6.2, waterLevel:85, activeSensors:57 };
  return {
    get(key) { return _data[key]; },
    update(patch) { Object.assign(_data, patch); },
    // Dynamic narration template — resolves {tokens} at speak-time using live values
    resolve(template) {
      return template.replace(/\{(\w+)\}/g, (_, k) => _data[k] ?? '—');
    }
  };
})();

// ── NarrationMgr — Static MP3 playback (pre-generated via Gemini TTS) ──
// Files live in audio/scenes/{lang}/{scene_id}.mp3
const NarrationMgr = (() => {
  let _audio = null;

  function _stop() {
    if (_audio) { _audio.pause(); _audio.currentTime = 0; _audio = null; }
    NarrationBar.hide();
  }

  return {
    speak(ev, lang, guardFn) {
      // ev not used — we play by scene ID directly
      // Called via speakScene(sid, lang) below
    },

    speakScene(sid, lang) {
      _stop();
      const src = `audio/scenes/${lang}/${sid}.mp3`;
      const audio = new Audio(src);
      _audio = audio;

      audio.oncanplaythrough = () => {
        audio.play().catch(() => {});
      };

      audio.onplay = () => {
        // Show subtitle from SCENE_EVENTS text
        const ev = SCENE_EVENTS[sid];
        const text = ev?.text?.[lang] || ev?.text?.fr;
        if (text) NarrationBar.show(text, 999999);
      };

      audio.onended = () => {
        _audio = null;
        NarrationBar.hide();
      };

      audio.onerror = () => {
        // File missing — silent fail, no crash
        _audio = null;
        NarrationBar.hide();
      };

      audio.load();
    },

    stop: _stop,

    alert(text, lang) {
      // For IoT alerts — still use live TTS if available, else silent
      console.log(`[Alert] ${lang}: ${text}`);
    },

    iotAlert(key, value, lang) {
      const msgs = {
        temp:     { fr:`Alerte température : ${value} degrés.`,   en:`Temperature alert: ${value} degrees.`,    ar:`تنبيه درجة الحرارة: ${value}.` },
        humidity: { fr:`Humidité hors norme : ${value} %.`,       en:`Humidity out of range: ${value}%.`,       ar:`الرطوبة خارج النطاق: ${value}%.` },
        ec:       { fr:`EC anormale : ${value} mS/cm.`,           en:`Abnormal EC: ${value} mS/cm.`,            ar:`موصلية غير طبيعية: ${value}.` },
        ph:       { fr:`pH hors norme : ${value}.`,               en:`pH out of range: ${value}.`,              ar:`درجة حموضة خارج النطاق: ${value}.` }
      };
      const text = msgs[key]?.[lang] || msgs[key]?.fr;
      if (text) NarrationBar.show(text, 5000);
    }
  };
})();

    if (!_current) return;
    _current.classList.remove('visible');
    const el = _current;
    setTimeout(() => { el.remove(); }, 520);
    _current = null;
    clearTimeout(_hideTimer);

      el.innerHTML = `

        <div class="ar-popup-tag">${cfg.tag || 'AR'}</div>
        <div class="ar-popup-title">${title}</div>
        <div class="ar-popup-body">${body}</div>
        ${cfg.stat ? `<div class="ar-popup-stat">
          <span class="ar-popup-stat-val">${cfg.stat.val}</span>
          <span class="ar-popup-stat-unit">${cfg.stat.unit}</span>
        </div>` : ''}
      `;

      document.getElementById('ar-layer').appendChild(el);
      _current = el;

      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));

      if (autoDismissMs > 0) {
        _hideTimer = setTimeout(() => _dismiss(), autoDismissMs);
      }
    },
    dismiss: _dismiss
  };
})();

// ── Narration Bar ──
const NarrationBar = (() => {
  let _t = null;
  const bar  = () => document.getElementById('narration-bar');
  const text = () => document.getElementById('narration-text');

  return {
    show(msg, ms = 4000) {
      clearTimeout(_t);
      text().textContent = msg;
      bar().classList.add('show');
      _t = setTimeout(() => bar().classList.remove('show'), ms);
    },
    hide() { clearTimeout(_t); bar().classList.remove('show'); }
  };
})();

// ── Scene Event Dispatcher ──
function dispatchSceneEvent(sid, isTour) {
  const ev = SCENE_EVENTS[sid];
  PopupMgr.dismiss();
  NarrationMgr.stop();

  if (!ev) return;

  const popupDelay     = isTour ? 900 : 600;
  const narrationDelay = isTour ? 700 : 400;
  const guard = () => curScene === sid; // abort if scene changed mid-flight

  // Popup — resolve live IoT stat value at show-time
  setTimeout(() => {
    if (!guard()) return;
    if (ev.popup) {
      const cfg = ev.popup;
      // Resolve live stat value from IoTStore if flagged
      const statVal = cfg.stat?.live ? IoTStore.get(cfg.stat.key) : cfg.stat?.val;
      const resolvedCfg = cfg.stat
        ? { ...cfg, stat: { val: statVal ?? '—', unit: cfg.stat.unit } }
        : cfg;
      PopupMgr.show(resolvedCfg, 13000);
    }
  }, popupDelay);

  // Narration — static → dynamic chain via NarrationMgr
  setTimeout(() => {
    if (!guard()) return;
    NarrationMgr.speakScene(sid, currentLang);
  }, narrationDelay);
}

// ── Load ──
function load(zid, sid, instant, tourCfg){
  const zone=zones[zid];
  const scene=zone?.scenes.find(s=>s.id===sid);
  if(!scene) return;
  curZone=zid; curScene=sid;

  document.getElementById('scene-ctr').textContent=`${tourStep+1} / ${TOUR_CONFIG.length}`;
  document.getElementById('prev').className='arrow L'+(tourStep===0?' off':'');
  document.getElementById('next').className='arrow R'+(tourStep===TOUR_CONFIG.length-1?' off':'');

  if(zid!==lastZoneId){
    lastZoneId=zid;
    document.getElementById('zfn').textContent=zone.label;
    document.getElementById('zfu').textContent=zone.unit!=='—'?`Unité ${zone.unit}`:'';
    const zf=document.getElementById('zf');
    zf.classList.remove('show');
    requestAnimationFrame(()=>zf.classList.add('show'));
    clearTimeout(sceneT);
    sceneT=setTimeout(()=>zf.classList.remove('show'),3000);
  }

  const nextSlot=instant?activeSlot:(activeSlot===0?1:0);
  const nextId=nextSlot===0?'pano-a':'pano-b';
  const curId=activeSlot===0?'pano-a':'pano-b';
  const nextEl=document.getElementById(nextId);
  const curEl=document.getElementById(curId);

  if(viewers[nextSlot]){try{viewers[nextSlot].destroy();}catch(e){}viewers[nextSlot]=null;}
  nextEl.innerHTML='';
  nextEl.style.transition='none';
  nextEl.style.opacity='0';
  nextEl.style.pointerEvents='none';

  if(!instant){
    const fl=document.getElementById('flash');
    fl.classList.add('on');
    setTimeout(()=>fl.classList.remove('on'),80);
  }

  // Starting yaw
  const startYaw = tourCfg?.yawStart ?? 0;

  const v=pannellum.viewer(nextId,{
    type:'equirectangular',
    panorama:scene.file,
    autoLoad:true,
    autoRotate:0,
    hfov:100, minHfov:60, maxHfov:120,
    pitch:0, yaw:startYaw,
    hotSpots:[]
  });
  viewers[nextSlot]=v;

  v.on('load',()=>{
    if(viewers[nextSlot]!==v) return;

    // Force exact starting yaw immediately — prevents Pannellum micro-reset glitch
    if(tourCfg?.yawStart !== null && tourCfg?.yawStart !== undefined){
      try{ v.setYaw(tourCfg.yawStart); }catch(e){}
    }

    // ── Fire scene event (AR popup + audio) ──
    dispatchSceneEvent(sid, !!tourCfg);

    if(instant){
      nextEl.style.transition='none';
      nextEl.style.opacity='1';
      nextEl.style.pointerEvents='all';
      activeSlot=nextSlot;
    } else {
      requestAnimationFrame(()=>{
        nextEl.style.transition='opacity .55s cubic-bezier(.4,0,.2,1)';
        nextEl.style.opacity='1';
        nextEl.style.pointerEvents='all';
        curEl.style.transition='opacity .55s cubic-bezier(.4,0,.2,1)';
        curEl.style.opacity='0';
        curEl.style.pointerEvents='none';
      });
      const slotToClean=activeSlot;
      activeSlot=nextSlot;
      setTimeout(()=>{
        if(viewers[slotToClean]){try{viewers[slotToClean].destroy();}catch(e){}viewers[slotToClean]=null;}
        document.getElementById(slotToClean===0?'pano-a':'pano-b').innerHTML='';
      },600);
    }

    // Camera animation — only during tour
    if(tourCfg){
      if(_activeAnim){clearInterval(_activeAnim);_activeAnim=null;}

      if(tourCfg.rotate && tourCfg.yawStart!==null){
        // 360° — start after crossfade
        setTimeout(()=>{
          if(viewers[activeSlot]!==v) return;
          try{ v.startAutoRotate(tourCfg.rotateSpeed); }catch(e){}
        }, 600);

      } else if(!tourCfg.rotate && tourCfg.yawStart!==null && tourCfg.yawEnd!==null){
        const diff=((tourCfg.yawEnd-tourCfg.yawStart+540)%360)-180;
        // Use Pannellum's native autoRotate — positive=CCW, negative=CW
        // rotateSpeed is in °/s, sign determines direction
        const speed = diff > 0 ? -tourCfg.rotateSpeed : tourCfg.rotateSpeed;
        const panMs = (Math.abs(diff)/tourCfg.rotateSpeed)*1000;

        setTimeout(()=>{
          if(viewers[activeSlot]!==v) return;
          try{ v.startAutoRotate(speed); }catch(e){}

          // Stop exactly when we've covered the distance
          setTimeout(()=>{
            if(viewers[activeSlot]!==v) return;
            try{
              v.stopAutoRotate();
              v.setYaw(tourCfg.yawEnd);
            }catch(e){}
          }, panMs);
        }, 600);
      }
    }
  });
}
