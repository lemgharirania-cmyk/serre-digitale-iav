<style>



*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}



html,body{width:100%;height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:#000}







/* ── PANNELLUM SLOTS ── */



#pano-a,#pano-b{position:fixed;inset:0;width:100%;height:100%;z-index:1;pointer-events:auto}



#pano-a{opacity:1}



#pano-b{opacity:0;pointer-events:none}







/* Hide all Pannellum chrome */



.pnlm-about-msg,.pnlm-panorama-info,.pnlm-controls-container,



.pnlm-load-box,.pnlm-lbar,.pnlm-lbar-fill,.pnlm-load-button,



.pnlm-loading,.pnlm-compass{display:none!important}



.pnlm-hotspot-base{background:transparent!important;border:none!important;



  width:auto!important;height:auto!important;overflow:visible!important}



.pnlm-hotspot-base .pnlm-sprite{display:none!important}







/* ── VIGNETTE ── */



#vignette { display: none; }







/* ── ATMOSPHERE ── */



#atmo{position:fixed;inset:0;z-index:9;pointer-events:none;



  background:linear-gradient(to bottom,rgba(0,0,0,.08) 0%,transparent 30%,transparent 70%,rgba(0,0,0,.15) 100%)}







/* ── NAV HOTSPOTS ── */



.hs-nav{



  width:58px;height:58px;border-radius:50%;cursor:pointer;



  background:rgba(255,255,255,.13);



  border:1px solid rgba(255,255,255,.38);



  box-shadow:0 2px 20px rgba(0,0,0,.22),0 0 0 6px rgba(255,255,255,.05);



  display:flex;align-items:center;justify-content:center;



  animation:nav-breathe 3.5s ease-in-out infinite;



  transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s}



.hs-cross{



  width:58px;height:58px;border-radius:50%;cursor:pointer;



  background:rgba(147,197,253,.13);



  border:1px solid rgba(147,197,253,.4);



  box-shadow:0 2px 20px rgba(30,80,200,.18),0 0 0 6px rgba(147,197,253,.06);



  display:flex;align-items:center;justify-content:center;



  animation:nav-breathe 3.5s ease-in-out infinite;



  transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s}



.hs-nav:hover{transform:scale(1.12);background:rgba(255,255,255,.22)}



.hs-cross:hover{transform:scale(1.12);background:rgba(147,197,253,.24)}



@keyframes nav-breathe{



  0%,100%{box-shadow:0 2px 20px rgba(0,0,0,.22),0 0 0 6px rgba(255,255,255,.05)}



  50%{box-shadow:0 2px 20px rgba(0,0,0,.22),0 0 0 14px rgba(255,255,255,.0)}}







/* ── SIDE NAV ARROWS ── */



.arrow{position:fixed;top:50%;z-index:50;transform:translateY(-50%);



  width:40px;height:40px;border-radius:50%;



  background:rgba(255,255,255,.1);



  border:1px solid rgba(255,255,255,.2);



  cursor:pointer;color:rgba(255,255,255,.7);font-size:18px;



  display:flex;align-items:center;justify-content:center;



  transition:all .2s;backdrop-filter:blur(8px)}



.arrow:hover{background:rgba(255,255,255,.2);color:white;border-color:rgba(255,255,255,.4)}



.arrow.L{left:16px}.arrow.R{right:16px}



.arrow.off{opacity:0;pointer-events:none}







/* ── ZONE LABEL — bottom right glass pill ── */



.zf{



  position:fixed;bottom:28px;right:28px;z-index:50;



  background:rgba(255,255,255,.12);



  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);



  border:1px solid rgba(255,255,255,.22);



  border-radius:12px;padding:10px 16px;



  box-shadow:0 4px 24px rgba(0,0,0,.15),inset 0 1px 0 rgba(255,255,255,.18);



  opacity:0;pointer-events:none;



  transform:translateY(6px) scale(.97);



  transition:opacity .4s ease,transform .4s cubic-bezier(.34,1.2,.64,1)}



.zf.show{opacity:1;transform:translateY(0) scale(1)}



.zf-label{font-size:9px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;



  color:rgba(255,255,255,.45);margin-bottom:3px}



.zf-name{font-size:13px;font-weight:500;color:rgba(255,255,255,.9);letter-spacing:-.01em}



.zf-unit{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px;font-weight:300}







/* ── SCENE COUNTER ── */



.scene-ctr{



  position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:50;



  background:rgba(255,255,255,.1);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);



  border:1px solid rgba(255,255,255,.18);border-radius:999px;



  padding:5px 14px;font-size:11px;font-weight:500;color:rgba(255,255,255,.55);



  letter-spacing:.04em;opacity:0;transition:opacity .4s}



.scene-ctr.show{opacity:1}







/* ── TRANSITION FLASH — brief exposure on scene change ── */



#flash{position:fixed;inset:0;z-index:200;pointer-events:none;



  background:rgba(255,255,255,0);transition:background .08s ease}



#flash.on{background:rgba(255,255,255,.04)}







.iot-hud{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:150;display:flex;align-items:flex-end;gap:6px;pointer-events:none}



.iot-group{display:flex;align-items:stretch;gap:5px;padding:6px 7px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:22px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);overflow:visible;box-shadow:0 2px 16px rgba(0,0,0,.12)}



.iot-divider{width:1px;align-self:stretch;margin:4px 3px;flex-shrink:0;background:linear-gradient(to bottom,transparent,rgba(255,255,255,.2) 30%,rgba(255,255,255,.2) 70%,transparent)}



.iot-pill{position:relative;width:70px;padding:11px 6px 10px;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:default;pointer-events:all;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(16px) saturate(130%);-webkit-backdrop-filter:blur(16px) saturate(130%);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 -1px 0 rgba(0,0,0,.06) inset,0 3px 14px rgba(0,0,0,.14);transition:transform .28s cubic-bezier(.34,1.35,.64,1),box-shadow .28s ease,background .28s ease,border-color .28s ease;overflow:visible}



.iot-pill.env::after{content:'';position:absolute;top:0;left:18%;right:18%;height:1px;border-radius:1px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(120,200,155,.55),transparent)}



.iot-pill.irr::after{content:'';position:absolute;top:0;left:18%;right:18%;height:1px;border-radius:1px;pointer-events:none;background:linear-gradient(90deg,transparent,rgba(100,175,225,.55),transparent)}



.iot-pill:hover{transform:scale(1.12) translateY(-4px);background:rgba(255,255,255,.19);border-color:rgba(255,255,255,.34);box-shadow:0 1px 0 rgba(255,255,255,.22) inset,0 12px 30px rgba(0,0,0,.18)}



.iot-icon{width:17px;height:17px;flex-shrink:0;opacity:.7}



.iot-pill.env .iot-icon{color:rgba(140,215,170,1)}



.iot-pill.irr .iot-icon{color:rgba(120,195,235,1)}



.iot-pill:hover .iot-icon{opacity:.9}



.iot-val{font-family:'DM Sans',system-ui,sans-serif;font-size:16px;font-weight:500;line-height:1;color:rgba(255,255,255,.88);letter-spacing:-.3px}



.iot-unit{font-family:'DM Sans',system-ui,sans-serif;font-size:8px;font-weight:400;color:rgba(255,255,255,.42);letter-spacing:.8px;text-transform:uppercase}



.iot-tip{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%) translateY(5px);background:rgba(255,255,255,.14);backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);border:1px solid rgba(255,255,255,.24);color:rgba(255,255,255,.86);font-family:'DM Sans',system-ui,sans-serif;font-size:10px;font-weight:400;letter-spacing:.2px;white-space:nowrap;padding:5px 11px;border-radius:9px;pointer-events:none;opacity:0;z-index:10;transition:opacity .18s ease,transform .18s ease;box-shadow:0 4px 18px rgba(0,0,0,.16),0 1px 0 rgba(255,255,255,.14) inset}



.iot-pill:hover .iot-tip{opacity:1;transform:translateX(-50%) translateY(0)}



.iot-pip{position:absolute;top:7px;right:7px;width:5px;height:5px;border-radius:50%;background:rgba(140,230,170,.9);box-shadow:0 0 5px rgba(140,230,170,.45);animation:pip-pulse 2.8s ease-in-out infinite}



@keyframes pip-pulse{0%,100%{opacity:.88;transform:scale(1)}50%{opacity:.22;transform:scale(.72)}}



@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.35}}



/* Nav arrows */



.arrow{position:fixed;top:50%;z-index:201;transform:translateY(-50%);



  width:40px;height:40px;border-radius:50%;



  background:rgba(255,255,255,.1);backdrop-filter:blur(8px);



  border:1px solid rgba(255,255,255,.2);



  cursor:pointer;color:rgba(255,255,255,.7);font-size:18px;



  display:flex;align-items:center;justify-content:center;transition:.2s}



.arrow:hover{background:rgba(255,255,255,.2);color:white}



.arrow.L{left:14px}.arrow.R{right:14px}



.arrow.off{opacity:0;pointer-events:none}







/* Zone flash */



.zf{position:fixed;bottom:24px;right:24px;z-index:300;



  background:rgba(15,15,15,.75);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);



  border:1px solid rgba(255,255,255,.12);border-radius:14px;



  padding:10px 18px;text-align:left;



  box-shadow:0 8px 32px rgba(0,0,0,.25);



  opacity:0;pointer-events:none;



  transform:translateY(8px);



  transition:opacity .3s ease,transform .3s ease}



.zf.show{opacity:1;transform:translateY(0)}



.zf-name{font-size:13px;font-weight:600;color:rgba(255,255,255,.92);letter-spacing:.01em}



.zf-unit{font-size:11px;color:rgba(255,255,255,.4);margin-top:2px}

<script>
// ── AR Identity ──
window.AR_VIEWER   = 'serregenetique';
window.currentLang = 'FR';
window.activeAR    = null;
window.activeTab   = 0;





let arEnabled = true;







function applyARState(){



  document.body.classList.toggle('ar-hidden', !arEnabled);



  if(!arEnabled && typeof closeAR==='function') closeAR();



}







function toggleAR(){



  arEnabled = !arEnabled;



  const btn = document.getElementById('ar-toggle');



  const lbl = document.getElementById('ar-toggle-label');



  if(arEnabled){ btn.classList.add('ar-on'); lbl.textContent=typeof t==='function'?t('arOn'):'AR ON'; }



  else { btn.classList.remove('ar-on'); lbl.textContent=typeof t==='function'?t('arOff'):'AR OFF'; }



  applyARState();



}



const START_ZONE     = 'genetique';



const RESTRICT_ZONES = ['genetique'];







let manifest, zones={}, hotspots={};



let curZone, curScene;



const preloaded = new Set();



let lastZoneId=null, flashT, sceneT;



const navHistory=[];



let viewers=[null,null], activeSlot=0;







window.addEventListener('load', async ()=>{



  const r = await fetch('images/manifest.json');



  manifest = await r.json();



  manifest.zones.forEach(z=>zones[z.id]=z);



  hotspots = manifest.hotspots||{};



  const p = new URLSearchParams(location.search);



  const z = p.get('zone')||START_ZONE;



  const s = p.get('scene')||zones[z]?.scenes[0]?.id;



  // ── Await both fetches before rendering scene 1 so dots are live on first load ──
  await Promise.all([fetchThresholds(), fetchIoT()]);

  load(z, s, true);

  fetchOutsideTemp(); setInterval(fetchOutsideTemp,600000);
  setInterval(fetchIoT,60000);



  document.addEventListener('keydown', e=>{



    if(e.code==='ArrowRight') stepScene(1);



    if(e.code==='ArrowLeft')  stepScene(-1);



  });



  // Show scene counter after short delay



  setTimeout(()=>document.getElementById('scene-ctr').classList.add('show'), 800);



});







function goTo(zid, sid) {



  if(RESTRICT_ZONES && !RESTRICT_ZONES.includes(zid)) return;



  if(curZone && curScene) navHistory.push({zoneId:curZone, sceneId:curScene});



  if(navHistory.length>50) navHistory.shift();



  if(typeof closeAR==='function') closeAR();



  load(zid, sid, false);



}







const pill=(r,g,b)=>`width:46px;height:46px;border-radius:50%;background:rgba(${r},${g},${b},.06);backdrop-filter:blur(14px) saturate(130%);-webkit-backdrop-filter:blur(14px) saturate(130%);border:1px solid rgba(255,255,255,.35);box-shadow:0 3px 14px rgba(${r},${g},${b},.15),0 1px 0 rgba(255,255,255,.5) inset;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform .22s;overflow:hidden`;

    @keyframes hs-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}



    @keyframes hs-drop{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-3px) scaleY(1.08)}}



    @keyframes dot-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}



    @keyframes hs-mist{0%{opacity:.9;transform:translateY(0) scale(1)}60%{opacity:.4;transform:translateY(-8px) scale(1.15)}100%{opacity:0;transform:translateY(-14px) scale(.8)}}



    @keyframes hs-airflow{0%{opacity:0;transform:translateX(-4px)}40%{opacity:1}100%{opacity:0;transform:translateX(6px)}}



    @keyframes hs-particle-l{0%{opacity:.8;transform:translateX(0)}50%{opacity:.3;transform:translateX(-7px)}100%{opacity:0;transform:translateX(-12px)}}



    @keyframes hs-curtain{0%,100%{d:path('M4 8C5 12 5 20 7 26C8 30 6 34 8 39L4 39Z')}50%{d:path('M4 8C6 13 4 21 8 26C9 30 5 34 7 39L4 39Z')}}



  `;

function load(zid, sid, instant) {



  const zone  = zones[zid];



  const scene = zone?.scenes.find(s=>s.id===sid);



  if(!zone||!scene) return;



  curZone=zid; curScene=sid;



  const idx = zone.scenes.indexOf(scene);







  // UI updates



  document.getElementById('prev').className = 'arrow L'+(idx===0?' off':'');



  document.getElementById('next').className = 'arrow R'+(idx===zone.scenes.length-1?' off':'');



  document.getElementById('scene-ctr').textContent = `${idx+1} / ${zone.scenes.length}`;







  // Zone label



  if(zid!==lastZoneId) {



    lastZoneId=zid;



    document.getElementById('zfn').textContent = zone.label;



    document.getElementById('zfu').textContent = zone.unit!=='—' ? `Unité ${zone.unit}` : '';



    const zf=document.getElementById('zf');



    zf.classList.remove('show');



    requestAnimationFrame(()=>{ zf.classList.add('show'); });



    clearTimeout(sceneT);



    sceneT=setTimeout(()=>zf.classList.remove('show'), 3000);



  }







  // Build hotspots — filter AR



  const shs=(hotspots[zid]?.[sid]||[]).slice();



  const fwdNav=shs.find(h=>h.type==='nav'&&h.targetSceneId!==sid&&h.targetZoneId===zid);



  const hasAnyBack=shs.some(h=>zones[h.targetZoneId]?.scenes.findIndex(s=>s.id===h.targetSceneId)===idx-1);



  if(fwdNav&&idx>0&&!hasAnyBack){



    const by=((fwdNav.yaw+180)+360)%360;



    shs.push({type:'nav',pitch:fwdNav.pitch,yaw:by>180?by-360:by,



      targetZoneId:zid,targetSceneId:zone.scenes[idx-1].id,auto:true});



  }



  const prev=navHistory.length>0?navHistory[navHistory.length-1]:null;



  const hasAnyCross=shs.some(h=>h.type==='cross');



  const hasForward=shs.some(h=>!h.auto&&h.targetSceneId!==sid);



  if(prev&&!hasAnyCross&&!hasForward){



    const pz=zones[prev.zoneId];



    if(pz&&(!RESTRICT_ZONES||RESTRICT_ZONES.includes(prev.zoneId))){



      const refYaw=fwdNav?.yaw??(shs[0]?.yaw??0);



      const by=((refYaw+180)+360)%360;



      shs.push({type:'cross',pitch:fwdNav?.pitch??-20,yaw:by>180?by-360:by,



        targetZoneId:prev.zoneId,targetSceneId:prev.sceneId,auto:true});



    }



  }







  const fst=shs.find(h=>!h.auto)||shs[0];



  const sy=fst?.yaw??0;



  const sp=fst?Math.min(fst.pitch+20,5):0;







  const phs=shs.map(hs=>{



    if(hs.type==='ar'){



      const desc=hs.arDesc||hs.label||'';



      const rawKey=desc.toLowerCase().trim();


const _al = {
  'ventilation':'ventilation',
  'brumisateur':'brumisateur',
  'co2':'co2',
  'sensors':'sensors',

  'fenetre':'fenetre auto',
  'fenetres':'fenetre auto',

  'rideaux':'rideaux auto',

  'système de chauffage':'chauffage',
  'lampes led':'lumiere',

  'blé':'blé'
};

      const hsKey=_al[rawKey]||rawKey;
console.log('rawKey =', rawKey);
console.log('hsKey =', hsKey);


      const stateKey=hsGetState(hsKey);



      const def=HS_DEFS[hsKey]||HS_DEFS['co2'];



      const dotColor=stateKey==='on'?'#22c55e':'#ef4444';



      const glowColor=stateKey==='on'?'rgba(34,197,94,.6)':'rgba(239,68,68,.5)';



      return {



        pitch:hs.pitch,yaw:hs.yaw,type:'custom',cssClass:'hs-ar-base',



        createTooltipFunc:function(div){



          div.style.cssText='background:transparent;border:none;width:auto;height:auto';



          const inner=document.createElement('div');



          inner.style.cssText=def.style+';position:relative';



          inner.innerHTML=def.html;



          if(stateKey!==null){



            const dot=document.createElement('div');



            dot.setAttribute('data-state-dot',hsKey);



            dot.style.cssText='position:absolute;bottom:4px;right:4px;width:7px;height:7px;border-radius:50%;background:'+dotColor+';border:1.5px solid rgba(255,255,255,.85);box-shadow:0 0 4px '+glowColor+';animation:dot-pulse 2.4s ease-in-out infinite;z-index:10';



            inner.appendChild(dot);



          }



          inner.addEventListener('mouseenter',()=>{inner.style.transform='scale(1.12)';});



          inner.addEventListener('mouseleave',()=>{inner.style.transform='';});



          div.appendChild(inner);



          div.addEventListener('mousedown',e=>{e.stopPropagation();e.preventDefault();});



        },



        createTooltipArgs:{},



clickHandlerFunc:function(){
  openSimpleAR(hsKey);
}


      };



    }



    return ({



    pitch:hs.pitch, yaw:hs.yaw, type:'custom',



    cssClass:hs.type==='cross'?'hs-cross':'hs-nav',



    createTooltipFunc:function(div){



      const isX = hs.type==='cross';



      const c = isX?'rgba(200,225,255,.9)':'rgba(255,255,255,.9)';



      div.innerHTML=`<svg width="24" height="24" viewBox="0 0 24 24" fill="none"



        stroke="${c}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">



        <line x1="12" y1="19" x2="12" y2="5"/>



        <polyline points="5 12 12 5 19 12"/>



      <\/svg>`;



    },



    createTooltipArgs:{},



    clickHandlerFunc:function(){goTo(hs.targetZoneId,hs.targetSceneId);}



    });



  }).filter(Boolean);







  // Dual-buffer crossfade



  const nextSlot = instant?activeSlot:(activeSlot===0?1:0);



  const nextId   = nextSlot===0?'pano-a':'pano-b';



  const curId    = activeSlot===0?'pano-a':'pano-b';



  const nextEl   = document.getElementById(nextId);



  const curEl    = document.getElementById(curId);







  if(window._fadeTimer){clearTimeout(window._fadeTimer);window._fadeTimer=null;}



  if(viewers[nextSlot]){try{viewers[nextSlot].destroy();}catch(e){}viewers[nextSlot]=null;}



  nextEl.innerHTML='';



  nextEl.style.transition='none';



  nextEl.style.opacity='0';



  nextEl.style.pointerEvents='none';







  // Brief flash on transition



  if(!instant){



    const fl=document.getElementById('flash');



    fl.classList.add('on');



    setTimeout(()=>fl.classList.remove('on'),80);



  }







  const v=pannellum.viewer(nextId,{



    type:'equirectangular', panorama:scene.file,



    autoLoad:true,



          vr: true, autoRotate:0,



    hfov:100, minHfov:60, maxHfov:120,



    pitch:sp, yaw:sy, hotSpots:phs



  });



  viewers[nextSlot]=v;







  v.on('load',()=>{



    if(viewers[nextSlot]!==v) return;







    if(instant){



      nextEl.style.transition='none';



      nextEl.style.opacity='1';



      nextEl.style.pointerEvents='all';



      activeSlot=nextSlot;



    } else {



      requestAnimationFrame(()=>{



        nextEl.style.transition='opacity .55s cubic-bezier(.4,0,.2,1)';



        nextEl.style.opacity='1';



        nextEl.style.pointerEvents='all';



        curEl.style.transition='opacity .55s cubic-bezier(.4,0,.2,1)';



        curEl.style.opacity='0';



        curEl.style.pointerEvents='none';



      });



      const slotToClean=activeSlot;



      activeSlot=nextSlot;



      window._fadeTimer=setTimeout(()=>{



        if(viewers[slotToClean]){try{viewers[slotToClean].destroy();}catch(e){}viewers[slotToClean]=null;}



        document.getElementById(slotToClean===0?'pano-a':'pano-b').innerHTML='';



        window._fadeTimer=null;



      },600);



    }







    setTimeout(updateHotspotDots,200);



    // Preload neighbours



    [-1,1,2].forEach(d=>{



      const sc=zone.scenes[idx+d];



      if(sc&&!preloaded.has(sc.file)){preloaded.add(sc.file);new Image().src=sc.file;}



    });



  });



}

    iotData = (d.serres||[]).find(s=>s.code==='S01')||null;



    if(iotData){ updateIoTOverlay(); window._iotData=iotData; updateHotspotDots(); }



  }catch(e){}

async function fetchThresholds(){



  try{



    const r = await fetch(`${API}/api/dashboard/thresholds/1/public`);



    if(!r.ok) throw new Error(r.status);



    const data = await r.json();



    thresholds = {};



    (data||[]).forEach(t=>{ if(t.actif!==false) thresholds[t.capteur]=t; });



    window._thresholds = thresholds;



  }catch(e){ console.warn('Thresholds: using defaults',e.message); }



}







async function fetchOutsideTemp(){

    const d = await r.json();



    outsideTemp = d?.current_weather?.temperature ?? null;



    window._outsideTemp = outsideTemp;



  }catch(e){ outsideTemp=null; }



}

    humidite:   {valeur_min:55,valeur_max:85},

    ph:         {valeur_min:5.5,valeur_max:6.5},



    ec:         {valeur_min:1.0,valeur_max:2.2},



    niveau_eau: {valeur_min:0.3,valeur_max:1.5},



  };



  return thresholds[key] || DEFAULTS[key] || {valeur_min:null,valeur_max:null};



}







// Returns 'on' | 'off' | null (null = no state for this equipment)



function hsGetState(key){



  const env = iotData?.env||{};



  const tT  = getThresh('temperature');



  const hT  = getThresh('humidite');



  const vT  = getThresh('vpd');



  switch(key){



    case 'ventilation':



    case 'ventilation dehors':



      if(env.temperature==null) return null;



      return (env.temperature > tT.valeur_max-2 || (env.humidite!=null && env.humidite > hT.valeur_max)) ? 'on' : 'off';



    case 'brumisateur':



      if(env.temperature==null) return null;



      return (env.temperature > tT.valeur_max || (env.humidite!=null && env.humidite < hT.valeur_min)) ? 'on' : 'off';



    case 'co2':



      if(env.vpd==null) return null;



      return env.vpd > vT.valeur_min ? 'on' : 'off';



    case 'système de refroidissement':



      if(env.temperature==null) return null;



      return env.temperature > tT.valeur_max ? 'on' : 'off';



    case 'fenetre auto':



      if(env.temperature==null || outsideTemp==null) return null;



      return (env.temperature > tT.valeur_max && outsideTemp < env.temperature-2) ? 'on' : 'off';



    case 'rideaux auto':



      if(outsideTemp==null) return null;



      return (outsideTemp > 10 && outsideTemp < 32) ? 'on' : 'off';



    default: return null;



  }



}







function updateIoTOverlay(){



  if(!iotData) return;



  const env=iotData.env||{}, irr=iotData.irr||{};



  const set=(id,val,dec=1)=>{ const el=document.getElementById(id); if(el) el.textContent=val!=null?Number(val).toFixed(dec):'—'; };



  set('iot-temp',  env.temperature, 1);



  set('iot-hum',   env.humidite,    1);



  set('iot-vpd',   env.vpd,         2);



  set('iot-ph',    irr.ph,          2);



  set('iot-ec',    irr.ec,          2);



  set('iot-twater',irr.temp_eau,    1);



  set('iot-level', irr.niveau_eau,  2);



}







function goTo(zid,sid){



  if(RESTRICT_ZONES&&!RESTRICT_ZONES.includes(zid)) return;



  if(curZone&&curScene) navHistory.push({zoneId:curZone,sceneId:curScene});



  if(navHistory.length>50) navHistory.shift();



  closeAR();



  setTimeout(()=>load(zid,sid),80);



}











function stepScene(d){



  const zone=zones[curZone];



  const idx=zone?.scenes.findIndex(s=>s.id===curScene);



  const next=zone?.scenes[idx+d];



  if(next) goTo(curZone,next.id);



}

/* ── Auto VR entry when URL contains ?vr=1 ── */



(function () {



  if (!/[?&]vr=1/.test(location.search)) return;







  var MAX_WAIT = 4000;   // ms before giving up



  var POLL_MS  = 150;    // check interval



  var elapsed  = 0;



  var entered  = false;







  function tryEnterVR() {



    if (entered) return;







    /* Strategy 1 — click Pannellum's built-in VR button */



    var btn = document.querySelector(



      '.pnlm-vr-button, [class*="vr"], button[title*="VR"], button[title*="vr"]'



    );



    if (btn) {



      btn.click();



      entered = true;



      return;



    }







    /* Strategy 2 — use WebXR API directly */



    if (navigator.xr) {



      navigator.xr.isSessionSupported('immersive-vr').then(function (ok) {



        if (!ok || entered) return;



        navigator.xr.requestSession('immersive-vr').then(function (session) {



          entered = true;



          /* hand session to Pannellum if available */



          if (window.pannellumViewer && window.pannellumViewer.enterVR) {



            window.pannellumViewer.enterVR(session);



          }



        }).catch(function (e) { console.warn('[VR-AUTO] requestSession failed:', e); });



      });



      entered = true; /* prevent looping even if promise pending */



      return;



    }







    /* Keep polling until MAX_WAIT */



    elapsed += POLL_MS;



    if (elapsed < MAX_WAIT) setTimeout(tryEnterVR, POLL_MS);



    else console.warn('[VR-AUTO] Could not find VR entry point after', MAX_WAIT, 'ms');



  }







  /* Wait for page load, then start polling */



  if (document.readyState === 'complete') {



    setTimeout(tryEnterVR, 600);



  } else {



    window.addEventListener('load', function () { setTimeout(tryEnterVR, 600); });



  }



})();



</script>

  const _origViewer = window.pannellum?.viewer;



  if (_origViewer) {



    window.pannellum.viewer = function(container, config) {



      /* Inject defaults without overriding existing values */



      config.showFullscreenCtrl       = config.showFullscreenCtrl       ?? true;



      config.orientationOnByDefault   = config.orientationOnByDefault   ?? isMobile;



      config.autoLoad                 = config.autoLoad                 ?? true;



      config.touchPanSpeedCoeffFactor = config.touchPanSpeedCoeffFactor ?? 1;



      return _origViewer.call(this, container, config);



    };



  }







  /* ── VR entry on button click ── */



  function enterVRMode() {



    const btn = document.getElementById('vr-enter-btn');







    /* 1. Fullscreen */



    const el = document.documentElement;



    const fsReq = el.requestFullscreen



      || el.webkitRequestFullscreen



      || el.mozRequestFullScreen



      || el.msRequestFullscreen;







    if (fsReq) {



      fsReq.call(el).catch(err => {



        console.warn('[VR] Fullscreen failed:', err);



      });



    }







    /* 2. Screen orientation — landscape for Quest */



    if (screen.orientation && screen.orientation.lock) {



      screen.orientation.lock('landscape').catch(() => {});



    }







    /* 3. Enable Pannellum orientation if on mobile/Quest */



    if (isMobile) {

      ['pano-a', 'pano-b'].forEach(id => {



        const el = document.getElementById(id);



        if (!el) return;



        const iframe = el.querySelector('iframe');



        /* Pannellum exposes orientation toggle via its container events */



      });



      /* Trigger Pannellum's built-in orientation button if present */



      const orientBtn = document.querySelector('.pnlm-orientation-button');



      if (orientBtn) orientBtn.click();



    }







    /* 4. Add vr-mode class — hides heavy UI, enlarges hotspots */



    document.body.classList.add('vr-mode');







    /* 5. Lock pointer / prevent scroll */



    document.body.style.overflow = 'hidden';







    /* 6. Show exit button after 3s */



    setTimeout(() => {



      if (!document.getElementById('vr-exit-btn')) {



        const exit = document.createElement('button');



        exit.id = 'vr-exit-btn';



        exit.innerHTML = '✕ Quitter VR';



        Object.assign(exit.style, {



          position: 'fixed', top: '16px', right: '16px', zIndex: '99999',



          padding: '8px 18px', borderRadius: '100px',



          background: 'rgba(0,0,0,0.45)', border: '1px solid rgba(255,255,255,0.2)',



          color: 'rgba(255,255,255,0.8)', fontSize: '12px', fontWeight: '600',



          cursor: 'pointer', backdropFilter: 'blur(12px)',



          fontFamily: "'Outfit','Inter',system-ui",



        });



        exit.onclick = exitVRMode;



        document.body.appendChild(exit);



      }



    }, 3000);



  }







  function exitVRMode() {



    document.body.classList.remove('vr-mode');



    document.body.style.overflow = '';



    const exit = document.getElementById('vr-exit-btn');



    if (exit) exit.remove();



    if (document.fullscreenElement && document.exitFullscreen) {



      document.exitFullscreen().catch(() => {});



    }



  }







  /* ── Exit VR on fullscreen change (user pressed Esc) ── */



  document.addEventListener('fullscreenchange', () => {



    if (!document.fullscreenElement) exitVRMode();



  });







  /* ── Wire the button ── */



  document.addEventListener('DOMContentLoaded', () => {



    const btn = document.getElementById('vr-enter-btn');



    if (btn) btn.addEventListener('click', enterVRMode);







    /* On Quest — add a subtle label below the button */



    if (isQuest) {



      const label = document.createElement('div');



      label.textContent = 'Optimisé Meta Quest';



      Object.assign(label.style, {



        position: 'fixed', bottom: '82px', right: '24px', zIndex: '99999',



        fontSize: '10px', fontWeight: '600', letterSpacing: '0.1em',



        textTransform: 'uppercase', color: 'rgba(255,255,255,0.45)',



        fontFamily: "'Outfit','Inter',system-ui",



        pointerEvents: 'none',



      });



      document.body.appendChild(label);



    }



  });







})();



</script>








<script>
(function () {
  var isQuest  = /Oculus|Quest/i.test(navigator.userAgent);
  var isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent) || isQuest;

  function enterVR() {
    /* fullscreen only */
    var el  = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen
           || el.mozRequestFullScreen || el.msRequestFullscreen;
    if (req) req.call(el).catch(function(){});

    /* landscape on Quest */
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(function(){});
    }

    /* gyro if mobile/Quest — only clicks Pannellum's own button */
    if (isMobile) {
      var ob = document.querySelector('.pnlm-orientation-button');
      if (ob) ob.click();
    }

    /* hide VR button, show exit button */
    var btn = document.getElementById('vr-enter-btn');
    if (btn) btn.style.display = 'none';

    var exit = document.getElementById('vr-exit-btn');
    if (!exit) {
      exit = document.createElement('button');
      exit.id = 'vr-exit-btn';
      exit.textContent = '✕ Quitter VR';
      exit.onclick = exitVR;
      document.body.appendChild(exit);
    }
  }

  function exitVR() {
    var btn = document.getElementById('vr-enter-btn');
    if (btn) btn.style.display = '';
    var exit = document.getElementById('vr-exit-btn');
    if (exit) exit.remove();
    if (document.fullscreenElement && document.exitFullscreen) {
      document.exitFullscreen().catch(function(){});
    }
  }

  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement) exitVR();
  });

  document.addEventListener('DOMContentLoaded', function () {
    var btn = document.getElementById('vr-enter-btn');
    if (btn) btn.addEventListener('click', enterVR);
  });
})();

  <script>
  window.addEventListener('message', function(e) {
    if (e.data === 'enterPanorama') enterPanorama()
    if (e.data === 'exitPanorama')  exitPanorama()
  })

  function enterPanorama() {
    // 1. Pannellum : redimensionne le viewer pour remplir tout l'écran
    //    Pannellum expose son instance soit via pannellumViewer (variable globale)
    //    soit via l'API window.viewer — on essaie les deux
    resizePannellum()

    // 2. Cache tout ce qui n'est pas le viewer (hotspots toolbar, titres, etc.)
    hideUI()

    // 3. Force le fond en noir pour éviter le flash blanc
    document.documentElement.style.background = '#000'
    document.body.style.background = '#000'
    document.body.style.overflow   = 'hidden'
  }

  function exitPanorama() {
    showUI()
    document.documentElement.style.background = ''
    document.body.style.background = ''
    document.body.style.overflow   = ''
    resizePannellum()
  }

  function resizePannellum() {
    // Pannellum v2 API — resize() recalcule la taille du canvas
    setTimeout(function() {
      // Cas 1 : instance exposée comme variable globale "viewer"
      if (window.viewer && typeof window.viewer.resize === 'function') {
        window.viewer.resize()
        return
      }
      // Cas 2 : instance exposée comme "pannellumViewer"
      if (window.pannellumViewer && typeof window.pannellumViewer.resize === 'function') {
        window.pannellumViewer.resize()
        return
      }
      // Cas 3 : instance dans un div #panorama (API pannellum.viewer)
      if (window.pannellum && window.pannellum.viewer) {
        window.pannellum.viewer.resize()
        return
      }
      // Cas 4 : déclenchement manuel via resize event du navigateur
      window.dispatchEvent(new Event('resize'))
    }, 80)
  }

  function hideUI() {
    // Pannellum génère un div .pnlm-container — on cache tout sauf lui
    var toHide = document.querySelectorAll(
      '.pnlm-controls-container, .pnlm-load-button, ' +
      '.pnlm-title-box, .pnlm-author-box, ' +
      'header, footer, nav, .toolbar, .sidebar, ' +
      '[data-ui="true"], .ui-overlay'
    )
    toHide.forEach(function(el) {
      el.setAttribute('data-pano-hidden', 'true')
      el.style.opacity = '0'
      el.style.pointerEvents = 'none'
      el.style.transition = 'opacity 0.25s ease'
    })
  }

  function showUI() {
    var hidden = document.querySelectorAll('[data-pano-hidden="true"]')
    hidden.forEach(function(el) {
      el.removeAttribute('data-pano-hidden')
      el.style.opacity = ''
      el.style.pointerEvents = ''
    })
  }
</script>
