<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AgroBioTech — Globe VR Intro</title>

<!-- ① Tell CesiumJS where its own bundled assets live (must come first) -->
<script>window.CESIUM_BASE_URL = 'https://cesium.com/downloads/cesiumjs/releases/1.107/Build/Cesium/';</script>
<link  rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.107/Build/Cesium/Widgets/widgets.css">
<script src="https://cesium.com/downloads/cesiumjs/releases/1.107/Build/Cesium/Cesium.js"></script>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<style>
html,body { margin:0; height:100%; background:#000010; overflow:hidden; font-family:'DM Sans',system-ui,sans-serif; }
a-scene   { width:100%; height:100%; }

/* ── Cesium hidden renderer ─────────────────────────────────────── */
#cesium-container {
  position:fixed; top:0; left:0; width:1280px; height:720px;
  opacity:0; pointer-events:none; z-index:-1; overflow:hidden;
}
/* suppress Cesium's own widget chrome */
#cesium-container .cesium-viewer-toolbar,
#cesium-container .cesium-viewer-animationContainer,
#cesium-container .cesium-viewer-timelineContainer,
#cesium-container .cesium-viewer-bottom,
#cesium-container .cesium-widget-credits { display:none !important; }

/* ── Loading overlay ─────────────────────────────────────────────── */
#loading {
  position:fixed; inset:0; background:#000010; z-index:200;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity .9s ease;
}
#loading.fade { opacity:0; pointer-events:none; }
.ld-ring {
  width:52px; height:52px; border:3px solid rgba(34,197,94,.18);
  border-top-color:#22C55E; border-radius:50%; animation:spin 1.1s linear infinite;
}
.ld-text { color:#4ADE80; font-size:13px; margin-top:20px; letter-spacing:.15em; text-transform:uppercase; }
@keyframes spin{ to{ transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- ── Loading overlay ───────────────────────────────────────────── -->
<div id="loading">
  <div class="ld-ring"></div>
  <div class="ld-text">Initialisation du globe…</div>
</div>

<!-- ── Cesium renders here (hidden — we use its canvas as a texture) ── -->
<div id="cesium-container"></div>

<!-- ================================================================
     A-Frame VR Scene
================================================================ -->
<a-scene
  vr-mode-ui="enabled:true"
  loading-screen="enabled:false"
  renderer="colorManagement:true; antialias:true; foveationLevel:0; highRefreshRate:true; sortTransparentObjects:true"
  background="color:#000010"
  device-orientation-permission-ui="enabled:true">

  <!-- Sky sphere: shows the Cesium globe, updated every frame via globe-sky component -->
  <a-sky id="globe-sky" globe-sky></a-sky>

  <!-- Camera rig ──────────────────────────────────────────────── -->
  <a-entity id="rig" position="0 1.6 0">

    <!-- Entry panel: appears at end of fly-in, parented to rig so
         it's positioned relative to the viewer in both flat and VR modes -->
    <a-plane id="entry-panel" class="clickable" visible="false"
      width="1.9" height="1.06" position="0 0.05 -3.2"
      material="shader:flat; transparent:true; depthWrite:false; opacity:0"
      billboard></a-plane>

    <a-camera id="cam" wasd-controls-enabled="false"
      look-controls="reverseMouseDrag:false; touchEnabled:true; magicWindowTrackingEnabled:true">
      <!-- Desktop / emulator mouse cursor -->
      <a-entity cursor="rayOrigin:mouse" raycaster="objects:.clickable; far:25"></a-entity>
    </a-camera>

    <!-- Quest 2 Touch controllers -->
    <a-entity laser-controls="hand:left"
      raycaster="objects:.clickable; far:25; lineColor:#06B6D4; lineOpacity:0.85"
      cursor="rayOrigin:entity; fuse:false; downEvents:triggerdown; upEvents:triggerup"></a-entity>
    <a-entity laser-controls="hand:right"
      raycaster="objects:.clickable; far:25; lineColor:#22C55E; lineOpacity:0.85"
      cursor="rayOrigin:entity; fuse:false; downEvents:triggerdown; upEvents:triggerup"></a-entity>
  </a-entity>

</a-scene>

<script>
/* ================================================================
   AgroBioTech · Globe VR Intro
   ─────────────────────────────────────────────────────────────────
   Architecture:
     Cesium renders its globe into an offscreen 1280×720 canvas
     (preserveDrawingBuffer:true).  Each A-Frame tick we blit that
     WebGL canvas into a plain 2D transfer-canvas via drawImage(),
     then mark the THREE.CanvasTexture as needsUpdate — giving us
     a live globe texture on the A-Frame sky sphere.

   Flow:
     1. Cesium initialises (NaturalEarth offline or Ion satellite)
     2. Camera starts high above Africa, flies to IAV campus
     3. At fly-in complete → "Entrer dans l'expérience" panel fades in
     4. Click / trigger → navigate to the 360° VR tour
================================================================ */

/* ── Config ────────────────────────────────────────────────────── */
const DEST_URL     = 'visitemanuelle-vr.html';  // tour file in the same folder
const IAV_LON      = -6.8539;
const IAV_LAT      = 33.9716;
const FLY_DURATION = 11;         // seconds for the dramatic fly-in

// Optional: paste your free Cesium Ion access token here.
// Get one at https://cesium.com/ion — the free tier gives satellite imagery.
// Without a token the globe uses offline Natural Earth II tiles (looks fine).
const CESIUM_TOKEN = '';

/* ── Transfer canvas (Cesium WebGL → 2D canvas → THREE.CanvasTexture) ── */
const xferCanvas = document.createElement('canvas');
xferCanvas.width  = 1280;
xferCanvas.height = 720;
const xferCtx = xferCanvas.getContext('2d');

/* ── A-Frame component: refreshes the sky texture from Cesium every frame ──
   This runs inside the XR render loop so it stays in sync in VR.           */
AFRAME.registerComponent('globe-sky', {
  init(){
    this._tex  = null;
    this._src  = null;   // cached ref to Cesium's canvas
  },

  _applyTexture(){
    const mesh = this.el.getObject3D('mesh');
    if (!mesh) return;
    if (this._tex) this._tex.dispose();
    this._tex = new THREE.CanvasTexture(xferCanvas);
    if ('colorSpace' in this._tex) this._tex.colorSpace = THREE.SRGBColorSpace;
    this._tex.anisotropy = 8;
    mesh.material.map            = this._tex;
    mesh.material.transparent    = false;
    mesh.material.color.set('#ffffff');
    mesh.material.needsUpdate    = true;
  },

  tick(){
    // Lazily grab Cesium's canvas on the first frame it exists
    if (!this._src){
      const c = document.querySelector('#cesium-container canvas');
      if (!c) return;
      this._src = c;
      this._applyTexture();
    }
    // Blit Cesium's WebGL canvas into the plain 2D transfer canvas
    try {
      xferCtx.drawImage(this._src, 0, 0, xferCanvas.width, xferCanvas.height);
    } catch(e){ return; }
    if (this._tex) this._tex.needsUpdate = true;
  }
});

/* ── Canvas helpers ─────────────────────────────────────────────── */
function applyTexture(planeEl, canvas){
  const set = () => {
    const mesh = planeEl.getObject3D('mesh');
    if (!mesh){ planeEl.addEventListener('loaded', set, {once:true}); return; }
    const tex = new THREE.CanvasTexture(canvas);
    if ('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 8; tex.needsUpdate = true;
    mesh.material.map         = tex;
    mesh.material.transparent = true;
    mesh.material.color.set('#ffffff');
    mesh.material.needsUpdate = true;
  };
  planeEl.hasLoaded ? set() : planeEl.addEventListener('loaded', set, {once:true});
}

function drawEntryCard(){
  const W = 1520, H = 840, cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const c  = cv.getContext('2d');
  const px = 56, r = 52;

  const rr = (x,y,w,h,r) => {
    c.beginPath(); c.moveTo(x+r,y);
    c.arcTo(x+w,y, x+w,y+h,r); c.arcTo(x+w,y+h, x,y+h,r);
    c.arcTo(x,y+h, x,y,r);     c.arcTo(x,y, x+w,y,r); c.closePath();
  };

  // soft outer glow
  c.shadowColor = 'rgba(34,197,94,0.50)'; c.shadowBlur = 80;
  const g = c.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'rgba(255,255,255,0.92)'); g.addColorStop(1,'rgba(236,251,244,0.92)');
  rr(px,px,W-2*px,H-2*px,r); c.fillStyle = g; c.fill();
  c.shadowBlur = 0;

  // crisp glass border
  rr(px,px,W-2*px,H-2*px,r);
  c.lineWidth = 2.5; c.strokeStyle='rgba(255,255,255,0.95)'; c.stroke();

  const ax = px + 66;

  // institution label
  c.fillStyle='#64748B'; c.textBaseline='alphabetic';
  c.font='500 28px "DM Sans",system-ui,sans-serif';
  c.fillText('AgroBioTech · IAV Hassan II · Rabat', ax, px+74);

  // green→cyan accent bar
  const bar = c.createLinearGradient(ax,0,ax+200,0);
  bar.addColorStop(0,'#22C55E'); bar.addColorStop(1,'#06B6D4');
  c.fillStyle = bar; c.fillRect(ax, px+96, 200, 7);

  // main headline
  c.fillStyle='#0F172A'; c.font='700 82px "DM Sans",system-ui,sans-serif';
  c.fillText('Entrer dans', ax, px+206);
  c.fillStyle='#15803D';
  c.fillText("l'expérience", ax, px+296);

  // subtitle
  c.fillStyle='#475569'; c.font='400 34px "DM Sans",system-ui,sans-serif';
  c.fillText('Visite immersive 360°  ·  Insta360 X4', ax, px+356);

  // divider
  c.strokeStyle='rgba(34,197,94,0.25)'; c.lineWidth=1.5;
  c.beginPath(); c.moveTo(ax, px+390); c.lineTo(W-px-66, px+390); c.stroke();

  // call to action
  c.fillStyle='#15803D'; c.font='600 30px "DM Sans",system-ui,sans-serif';
  c.fillText('Cliquez · Appuyez sur la gâchette', ax, H-px-56);

  // small arrow
  c.strokeStyle='#22C55E'; c.lineWidth=3; c.lineCap='round'; c.lineJoin='round';
  const bx = W-px-100, by = H-px-70;
  c.beginPath(); c.moveTo(bx-20,by+8); c.lineTo(bx,by); c.lineTo(bx-20,by-8); c.stroke();

  return cv;
}

/* ── Show entry panel at end of fly-in ─────────────────────────── */
function showEntryPanel(){
  const panel = document.getElementById('entry-panel');
  applyTexture(panel, drawEntryCard());
  panel.setAttribute('visible', true);

  // Smooth fade-in using A-Frame animation (runs on XR render loop → works in VR)
  panel.setAttribute('animation',
    'property:material.opacity; from:0; to:1; dur:1400; easing:easeInOutQuad');

  // Navigation on click / trigger
  panel.addEventListener('click', () => {
    panel.setAttribute('animation',
      'property:material.opacity; from:1; to:0; dur:600; easing:easeInQuad');
    setTimeout(() => { window.location.href = DEST_URL; }, 650);
  });
}

/* ── Cesium initialisation ──────────────────────────────────────── */
async function initCesium(){
  if (CESIUM_TOKEN) Cesium.Ion.defaultAccessToken = CESIUM_TOKEN;

  // ── Imagery: Ion satellite (with token) or offline NaturalEarth (without) ──
  let baseImagery;
  if (!CESIUM_TOKEN){
    // NaturalEarth II is bundled with CesiumJS — no network request needed
    try {
      const url = Cesium.buildModuleUrl('Assets/Textures/NaturalEarthII');
      if (typeof Cesium.TileMapServiceImageryProvider.fromUrl === 'function'){
        baseImagery = await Cesium.TileMapServiceImageryProvider.fromUrl(url, { fileExtension:'jpg' });
      } else {
        baseImagery = new Cesium.TileMapServiceImageryProvider({ url, fileExtension:'jpg' });
      }
    } catch(e){
      // ultimate fallback: OpenStreetMap (free, no key)
      baseImagery = new Cesium.UrlTemplateImageryProvider({
        url: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
        maximumLevel: 18,
        credit: '© OpenStreetMap contributors'
      });
    }
  }

  const viewer = new Cesium.Viewer('cesium-container', {
    ...(baseImagery ? { imageryProvider: baseImagery } : {}),
    terrainProvider: new Cesium.EllipsoidTerrainProvider(),
    animation:false, baseLayerPicker:false, geocoder:false,
    homeButton:false, sceneModePicker:false, timeline:false,
    navigationHelpButton:false, fullscreenButton:false,
    infoBox:false, selectionIndicator:false,
    creditContainer: document.createElement('div'),   // hides the credit bar
    contextOptions: { webgl: { preserveDrawingBuffer: true } },
    useDefaultRenderLoop: true,
  });

  // ── Deep-space atmosphere ──
  viewer.scene.backgroundColor       = Cesium.Color.fromCssColorString('#000010');
  viewer.scene.skyBox                 = undefined;
  viewer.scene.sun                    = undefined;
  viewer.scene.moon                   = undefined;
  if (viewer.scene.skyAtmosphere)       viewer.scene.skyAtmosphere.show = false;
  if (viewer.scene.globe)               viewer.scene.globe.showGroundAtmosphere = false;
  if (viewer.scene.globe)               viewer.scene.globe.enableLighting = false;

  // ── Starting position: high above West Africa, tilted to show the curve ──
  viewer.camera.setView({
    destination: Cesium.Cartesian3.fromDegrees(IAV_LON - 5, 15.0, 7_500_000),
    orientation: {
      heading: Cesium.Math.toRadians(8),
      pitch:   Cesium.Math.toRadians(-28),
      roll:    0
    }
  });

  // Give Cesium one render cycle before we unhide
  await new Promise(r => setTimeout(r, 700));

  // ── Dismiss loading overlay ──
  const overlay = document.getElementById('loading');
  overlay.classList.add('fade');
  setTimeout(() => overlay.remove(), 1000);

  // ── Dramatic fly-in to IAV campus ──
  viewer.camera.flyTo({
    destination: Cesium.Cartesian3.fromDegrees(IAV_LON, IAV_LAT, 1400),
    orientation: {
      heading: Cesium.Math.toRadians(15),
      pitch:   Cesium.Math.toRadians(-32),
      roll:    0
    },
    duration:        FLY_DURATION,
    easingFunction:  Cesium.EasingFunction.QUARTIC_IN_OUT,
    complete:        showEntryPanel
  });
}

/* ── Boot: wait for A-Frame scene then start Cesium ────────────── */
const scene = document.querySelector('a-scene');
scene.addEventListener('loaded', () => {
  initCesium().catch(err => {
    console.error('[Globe Intro]', err);
    // Graceful degradation: skip globe, show the entry panel immediately
    document.getElementById('loading').remove();
    showEntryPanel();
  });
});
</script>
</body>
</html>
